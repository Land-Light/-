services:
  bot:
    build: .
    image: smash-bingo-bot
    container_name: smash-bingo-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      # 作ったカードを再起動後も残す
      - bingo-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bingo-data:
