services:
  bot:
    build: .
    image: smash-bingo-bot
    container_name: smash-bingo-bot
    restart: unless-stopped
    env_file: .env
    ports:
      # 外からはリバースプロキシ(Caddy等)でHTTPS化して渡す
      - "127.0.0.1:8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
