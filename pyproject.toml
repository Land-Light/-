[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kindle2pdf"
version = "0.1.0"
description = "Auto-scroll a Kindle book you own and assemble the pages into a PDF, prioritising accuracy and speed."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "img2pdf>=0.5",
    "mss>=9.0",
    "pyautogui>=0.9.54",
]

[project.optional-dependencies]
ocr = ["ocrmypdf>=15.0"]
dev = ["pytest>=7.0"]

[project.scripts]
kindle2pdf = "kindle2pdf.cli:main"

[tool.setuptools]
packages = ["kindle2pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
