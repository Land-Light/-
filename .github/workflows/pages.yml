name: Deploy to GitHub Pages

# この リポジトリの Pages は gh-pages ブランチから配信される設定のため、
# main の内容を gh-pages ブランチの flashcards/ ディレクトリへ同期する。
# gh-pages 上の既存アプリ (ルートの会社法クイズ, gyosei, keiso など) には触れない。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: flashcards
          keep_files: true
          exclude_assets: '.github,.gitignore'
          commit_message: 'Deploy flashcards app'
