{cat:"社債",q:"持分会社は、社債を発行することができる。",ans:true,exp:"会社法702条は持分会社も社債を発行できると規定する（2条23号「会社」には持分会社を含む）。"},
{cat:"社債",q:"無記名社債については、社債券を発行しなければならない。",ans:false,exp:"会社法696条は社債券の発行を必須とせず、定款等で定めた場合に発行するものとしている。無記名社債であっても社債券の発行は義務ではない（任意）。"},
{cat:"社債",q:"新株予約権付社債については、新株予約権又は社債の一方を他方から分離して譲渡することができる。",ans:false,exp:"会社法254条3項は、新株予約権付社債については社債と新株予約権を分離して譲渡することができないと規定する（分離禁止原則）。"},
{cat:"社債",q:"監査等委員会設置会社の取締役の過半数が社外取締役である場合であっても、当該監査等委員会設置会社の取締役会は、その決議によって、募集社債の募集事項の決定を取締役に委任することができない。",ans:false,exp:"会社法362条4項6号は取締役会が社債の募集に係る事項の決定を代表取締役等に委任できると規定する。監査等委員会設置会社で社外取締役が過半数の場合は委任範囲がさらに広がる（399条の13第6項）。よって「委任できない」は誤り。"},
{cat:"社債",q:"募集社債の申込者のうち、募集社債の割当てを受けた者は、募集社債と引換えにする金銭の払込みの期日に、各募集社債の払込金額を払い込むことにより、払込みをした募集社債の社債権者となる。",ans:true,exp:"会社法718条3項は、募集社債の割当てを受けた者が払込期日に払込みをすることにより社債権者となると規定する。"},
{cat:"資本金・発行済株式総数",q:"株式会社が自己株式を消却することにより、発行済株式の総数は減少するが、資本金の額は減少しない。",ans:true,exp:"自己株式の消却（178条）により発行済株式総数は減少するが、資本金の額は変動しない。"},
{cat:"資本金・発行済株式総数",q:"株式会社が株式の併合をすることにより、発行済株式の総数は減少するが、資本金の額は減少しない。",ans:true,exp:"株式の併合により発行済株式総数は減少するが、資本金の額は変動しない（資本金の変更には446条以下の手続が必要）。"},
{cat:"資本金・発行済株式総数",q:"株式会社がその処分する自己株式を引き受ける者の募集をし、自己株式を処分することにより、発行済株式の総数は増加しないが、資本金の額は増加する。",ans:false,exp:"自己株式の処分は既発行株式の移転であり発行済株式総数を増加させない。また処分対価が常に資本金を増加させるわけではない。「資本金の額は増加する」という断定は誤り。"},
{cat:"資本金・発行済株式総数",q:"資本金の額は、株式会社の業績と連動して増加し、又は減少する。",ans:false,exp:"資本金の額は業績と連動せず、会社法445条以下の手続によって増減する。業績による自動的な変動はない。"},
{cat:"資本金・発行済株式総数",q:"発行済株式の総数が増加し、又は減少した場合には、変更の登記をしなければならない。",ans:true,exp:"会社法911条3項5号・915条1項は、発行済株式総数の変更が生じた場合には変更登記が必要と規定する。"},
{cat:"剰余金の配当規制",q:"会計監査人設置会社である監査役会設置会社であって取締役の任期が選任後１年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までである株式会社は、金銭による剰余金の配当について取締役会が定めることができる旨を定款で定めることができる。",ans:true,exp:"会社法459条1項は、会計監査人設置会社で取締役任期が1年以内の場合、取締役会で剰余金の配当を決定できる旨を定款で定めることができると規定する。"},
{cat:"剰余金の配当規制",q:"株式会社は、株主に金銭以外の財産を配当する場合には、株主総会の特別決議により、当該配当財産に代えて金銭を交付することを当該株式会社に対して請求する権利を株主に与える旨を定めなければならない。",ans:false,exp:"会社法454条4項は、現物配当をする場合に株主に金銭配当との選択権を与えることが「できる」（任意）と規定するにとどまり、「定めなければならない」とはしていない。"},
{cat:"剰余金の配当規制",q:"株式会社が剰余金の配当をする場合には、当該配当により減少する剰余金の額に１０分の１を乗じて得た額を準備金として計上しなければならないものの、配当を行った日における準備金の額が資本金の額の４分の１以上であるときは、これを計上する必要はない。",ans:true,exp:"会社法445条4項は、配当に伴う準備金積立義務は準備金の額が資本金の4分の1に達するまで義務付けられ、既に4分の1以上であれば積立不要とする。"},
{cat:"剰余金の配当規制",q:"株式会社が分配可能額を超えて剰余金の配当を行ったときは、当該配当に関する職務を行った業務執行者は、当該株式会社に対し、連帯して、当該配当を受けた者が交付を受けた金銭等の帳簿価額に相当する金銭を支払う義務を負い、その職務を行うについて注意を怠らなかったことを証明してもその義務を免れない。",ans:false,exp:"会社法462条2項は、職務上注意を怠らなかったことを証明した場合の免責を認める（過失責任）。「注意を怠らなかったことを証明しても義務を免れない」は誤り。"},
{cat:"剰余金の配当規制",q:"株式会社が株主に剰余金の配当を行った場合において、配当を行った日の属する事業年度に係る計算書類の承認を受けた時において欠損が生じたときは、当該分配に関する職務を行った業務執行者は、当該株式会社に対し、連帯して、欠損の額を支払う義務を負うものの、定時株主総会の決議によって剰余金の配当を行った場合には、その義務を負わない。",ans:true,exp:"会社法465条2項は、定時株主総会において配当に関する事項を定めた場合には465条1項（欠損填補責任）を適用しないと規定している。"},
{cat:"スクイーズアウト",q:"株式の併合、全部取得条項付種類株式の取得及び特別支配株主の株式等売渡請求のいずれの手法を用いる場合も、Ａ社において株主総会の特別決議が必要である。",ans:false,exp:"特別支配株主の株式等売渡請求（179条以下）は、対象会社の取締役会の承認で足り、株主総会の決議は不要（179条の3第1項等参照）。「いずれの場合も特別決議が必要」は誤り。"},
{cat:"スクイーズアウト",q:"株式の併合又は全部取得条項付種類株式の取得の手法を用いる場合において、一株に満たない端数の処理として、その端数の合計数に相当する数の株式を裁判所の許可を得て競売以外の方法により売却するためには、Ａ社の取締役の全員の同意を得る必要がある。",ans:false,exp:"競売以外の方法による売却には裁判所の許可が必要（235条2項・234条2項）であるが、「取締役全員の同意」は要件とされていない。"},
{cat:"スクイーズアウト",q:"特別支配株主の株式等売渡請求の手法を用いる場合には、Ａ社の新株予約権についても売り渡すことを請求することができるが、株式の併合又は全部取得条項付種類株式の取得の手法を用いる場合には、Ａ社の新株予約権に取得条項が定められていない限り、その新株予約権を当然には取得することができない。",ans:true,exp:"特別支配株主は株式等売渡請求において新株予約権売渡請求もできる（179条1項）。一方、株式の併合・全部取得条項付種類株式では新株予約権は当然には対象にならない。"},
{cat:"スクイーズアウト",q:"Ｂ社がＡ社の総株主の議決権の１０分の７を有し、Ｄ株式会社（Ｂ社がその総株主の議決権の３分の２を有している。）がＡ社の総株主の議決権の１０分の２を有しているときは、Ｂ社は、特別支配株主の株式等売渡請求の手法を用いることができる。",ans:true,exp:"B社70%＋D社20%（B社がD社の3分の2以上保有）＝90%＝10分の9に達し、特別支配株主の要件（179条1項）を充足する。"},
{cat:"スクイーズアウト",q:"Ｂ社は、Ａ社との間で株式交換契約を締結し、Ｃらに対価として金銭又はＢ社の株式を交付することによって、Ｃらの有するＡ社の株式を取得することができる。",ans:true,exp:"株式交換（767条以下）により、完全親会社（B社）が完全子会社（A社）の株主（C等）に対して金銭またはB社株式を対価として交付し、A社を完全子会社にすることができる。"},

let _pushTimer = null;
function schedulePush(){
  if(!currentUser) return;
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(cloudPush, 1500);
}
async function cloudPush(){
  if(!currentUser || !fbDb) return;
  const d = {ts: firebase.firestore.FieldValue.serverTimestamp()};
  ['I','II'].forEach(k => {
    const p = localStorage.getItem('kaisha_quiz_'+k);
    const w = localStorage.getItem('kaisha_quiz_'+k+'_w');
    if(p) try{ d['p'+k]=JSON.parse(p); }catch(e){}
    if(w) try{ d['w'+k]=JSON.parse(w); }catch(e){}
  });
  try {
    await fbDb.collection('users').doc(currentUser.uid).set(d, {merge:true});
    const el = document.getElementById('syncStatus');
    if(el) el.textContent = '同期済み ✓';
  } catch(e){ console.warn('push:', e); }
}
async function cloudPull(uid){
  if(!fbDb) return;
  try {
    const doc = await fbDb.collection('users').doc(uid).get();
    if(!doc.exists){ await cloudPush(); return; }
    const d = doc.data();
    ['I','II'].forEach(k => {
      const cloud = d['p'+k];
      if(cloud){
        const localRaw = localStorage.getItem('kaisha_quiz_'+k);
        const localN = localRaw ? (JSON.parse(localRaw).answers||[]).filter(x=>x!==null).length : 0;
        const cloudN = (cloud.answers||[]).filter(x=>x!==null).length;
        if(cloudN > localN) localStorage.setItem('kaisha_quiz_'+k, JSON.stringify(cloud));
      }
      const cw = d['w'+k]||[];
      const lw = JSON.parse(localStorage.getItem('kaisha_quiz_'+k+'_w')||'[]');
      const merged = [...new Set([...lw,...cw])];
      if(merged.length) localStorage.setItem('kaisha_quiz_'+k+'_w', JSON.stringify(merged));
    });
    await cloudPush();
  } catch(e){ console.warn('pull:', e); }
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const SAVE_KEY_I  = 'kaisha_quiz_I';
const SAVE_KEY_II = 'kaisha_quiz_II';
let currentSubject = 0;
let currentMode = 'normal';
let qOrder = [];
let userAnswers = [];
let current = 0;
let score = 0;

const qarea      = document.getElementById('qarea');
const catName    = document.getElementById('catName');
const qNumHdr    = document.getElementById('qNumHdr');
const statsText  = document.getElementById('statsText');
const qNumBadge  = document.getElementById('qNumBadge');
const qText      = document.getElementById('qText');
const qResult    = document.getElementById('qResult');
const resultCard = document.getElementById('resultCard');
const resultIcon = document.getElementById('resultIcon');
const resultWord = document.getElementById('resultWord');
const resultAns  = document.getElementById('resultAns');
const qExp       = document.getElementById('qExp');
const maruBtn    = document.getElementById('maruBtn');
const batuBtn    = document.getElementById('batuBtn');
const maruVerdict= document.getElementById('maruVerdict');
const batuVerdict= document.getElementById('batuVerdict');
const circleG    = document.getElementById('circleG');
const prevBtn    = document.getElementById('prevBtn');
const nextBtn    = document.getElementById('nextBtn');
const progFill   = document.getElementById('progFill');
const ftrInfo    = document.getElementById('ftrInfo');
const ftrScore   = document.getElementById('ftrScore');

function getQ(idx){ return ALL[qOrder[idx]]; }
function subjectSize(s){ return s===1 ? 100 : 300; }
function getSaveKey(s){ return s===1 ? SAVE_KEY_I : SAVE_KEY_II; }
function getWrongKey(s){ return s===1 ? 'kaisha_quiz_I_w' : 'kaisha_quiz_II_w'; }

function getWrongList(s){
  try{ return JSON.parse(localStorage.getItem(getWrongKey(s))||'[]'); }
  catch(e){ return []; }
}

function addToWrongList(s, allIdx){
  const list = getWrongList(s);
  if(!list.includes(allIdx)){
    list.push(allIdx);
    localStorage.setItem(getWrongKey(s), JSON.stringify(list));
    schedulePush();
  }
}

function makeOrder(s){
  if(s===1) return shuffle([...Array(100).keys()]);
  const e1=shuffle([...Array(100).keys()].map(i=>i+100));
  const e2=shuffle([...Array(100).keys()].map(i=>i+200));
  const e3=shuffle([...Array(100).keys()].map(i=>i+300));
  const r=[];
  for(let i=0;i<100;i++) r.push(e1[i],e2[i],e3[i]);
  return r;
}

function saveState(){
  if(!currentSubject || currentMode !== 'normal') return;
  localStorage.setItem(getSaveKey(currentSubject), JSON.stringify({order:qOrder, answers:userAnswers, current, score}));
  schedulePush();
}

function loadState(s){
  try {
    const raw = localStorage.getItem(getSaveKey(s));
    if(!raw) return false;
    const sv = JSON.parse(raw);
    const sz = subjectSize(s);
    if(!Array.isArray(sv.order)||sv.order.length!==sz) return false;
    if(!Array.isArray(sv.answers)||sv.answers.length!==sz) return false;
    qOrder = sv.order;
    userAnswers = sv.answers.slice();
    current = sv.current||0;
    score = sv.score||0;
    return true;
  } catch(e){ return false; }
}

function getSubjectStats(s){
  try {
    const raw = localStorage.getItem(getSaveKey(s));
    if(!raw) return null;
    const sv = JSON.parse(raw);
    const sz = subjectSize(s);
    if(!Array.isArray(sv.answers)||sv.answers.length!==sz) return null;
    const answered = sv.answers.filter(x=>x!==null).length;
    return {answered, score:sv.score||0, total:sz};
  } catch(e){ return null; }
}

function startSubject(s, mode){
  currentSubject = s;
  currentMode = mode || 'normal';
  if(currentMode === 'review'){
    const wrong = getWrongList(s);
    qOrder = shuffle([...wrong]);
    userAnswers = new Array(qOrder.length).fill(null);
    current = 0;
    score = 0;
  } else {
    if(!loadState(s)){
      qOrder = makeOrder(s);
      userAnswers = new Array(subjectSize(s)).fill(null);
      current = 0;
      score = 0;
    }
  }
  document.getElementById('menu').style.display='none';
  qarea.style.display='';
  document.getElementById('ctrl').style.display='';
  document.getElementById('ftr').style.display='';
  document.getElementById('hdrControls').style.display='flex';
  document.getElementById('hdrCat').style.display='';
  document.getElementById('progWrap').style.display='';
  showQ(current);
}

function showMenu(){
  currentSubject = 0;
  for(let s=1;s<=2;s++){
    const st = getSubjectStats(s);
    const prog = document.getElementById('subjProg'+s);
    const fill = document.getElementById('subjProgFill'+s);
    if(st && st.answered>0){
      const pct = Math.round(st.score/st.answered*100);
      prog.textContent = st.answered+' / '+st.total+' 回答済み　正解率 '+pct+'%';
      fill.style.width = Math.round(st.answered/st.total*100)+'%';
    } else {
      prog.textContent = '未開始';
      fill.style.width = '0%';
    }
    const wList = getWrongList(s);
    const rc = document.getElementById('reviewCard'+s);
    const rn = document.getElementById('reviewCount'+s);
    if(wList.length > 0){
      rn.textContent = wList.length+'問';
      rc.style.display='flex';
    } else {
      rc.style.display='none';
    }
  }
  document.getElementById('menu').style.display='flex';
  qarea.style.display='none';
  document.getElementById('ctrl').style.display='none';
  document.getElementById('ftr').style.display='none';
  document.getElementById('hdrControls').style.display='none';
  document.getElementById('hdrCat').style.display='none';
  document.getElementById('progWrap').style.display='none';
}

function showResult(q, ok){
  resultCard.className='result-card '+(ok?'seikai':'gokai');
  resultIcon.textContent=ok?'⭕':'❌';
  resultWord.textContent=ok?'正　解！':'不正解';
  resultAns.textContent='正解は　'+(q.ans?'○（正しい）':'×（誤り）');
}

function resetBtns(){
  maruBtn.className='ans-btn maru-btn';
  batuBtn.className='ans-btn batu-btn';
  maruVerdict.textContent='';
  batuVerdict.textContent='';
  maruBtn.disabled=false;
  batuBtn.disabled=false;
}

function applyAnsweredState(q, userAns){
  const correct = q.ans;
  maruBtn.disabled=true;
  batuBtn.disabled=true;
  if(correct===true){
    maruBtn.className='ans-btn maru-btn correct';
    maruVerdict.textContent='正解';
    if(userAns===false){
      batuBtn.className='ans-btn batu-btn user-wrong';
      batuVerdict.textContent='不正解';
    } else {
      batuBtn.className='ans-btn batu-btn dimmed';
    }
  } else {
    batuBtn.className='ans-btn batu-btn correct';
    batuVerdict.textContent='正解';
    if(userAns===true){
      maruBtn.className='ans-btn maru-btn user-wrong';
      maruVerdict.textContent='不正解';
    } else {
      maruBtn.className='ans-btn maru-btn dimmed';
    }
  }
}

function showQ(idx){
  if(idx>=qOrder.length){showFinish();return;}
  const q=getQ(idx);
  const ua=userAnswers[idx];
  catName.textContent=q.cat;
  qNumHdr.textContent=(idx+1)+' / '+qOrder.length;
  qNumBadge.textContent='Q '+(idx+1);
  qText.textContent=q.q;
  qarea.scrollTop=0;
  if(ua===null){
    resetBtns();
    qResult.style.display='none';
    nextBtn.disabled=true;
  } else {
    const ok=(ua===q.ans);
    qResult.style.display='block';
    showResult(q, ok);
    qExp.textContent=q.exp;
    applyAnsweredState(q, ua);
    nextBtn.disabled=false;
  }
  prevBtn.disabled=(idx===0);
  updateStats();
}

function doAnswer(choice){
  const q=getQ(current);
  if(userAnswers[current]!==null)return;
  userAnswers[current]=choice;
  const ok=(choice===q.ans);
  if(ok){ score++; } else { addToWrongList(currentSubject, qOrder[current]); }
  qResult.style.display='block';
  showResult(q, ok);
  qExp.textContent=q.exp;
  applyAnsweredState(q, choice);
  nextBtn.disabled=false;
  updateStats();
  saveState();
  setTimeout(()=>{qarea.scrollTop=qarea.scrollHeight},80);
}

function nextQ(){
  if(current+1>=qOrder.length){showFinish();return;}
  current++;
  saveState();
  showQ(current);
}

function prevQ(){
  if(current===0)return;
  current--;
  saveState();
  showQ(current);
}

function resetQuiz(){
  localStorage.removeItem(getSaveKey(currentSubject));
  location.reload();
}

function updateStats(){
  const answered=userAnswers.filter(x=>x!==null).length;
  const pct=answered>0?Math.round(score/answered*100):0;
  statsText.textContent='正解率 '+pct+'%';
  progFill.style.width=Math.round(answered/qOrder.length*100)+'%';
  ftrInfo.textContent=answered+' / '+qOrder.length+' 回答済み';
  ftrScore.textContent=score+' 正解';
}

function showFinish(){
  const pct=Math.round(score/qOrder.length*100);
  let emoji='😢',msg='もう一度チャレンジ！';
  if(pct>=90){emoji='🏆';msg='会社法マスター！';}
  else if(pct>=70){emoji='🎉';msg='素晴らしい実力！';}
  else if(pct>=50){emoji='👏';msg='もう少し！';}
  else if(pct>=30){emoji='📚';msg='復習してリベンジ！';}
  if(currentMode==='normal') localStorage.removeItem(getSaveKey(currentSubject));
  const cs=currentSubject, cm=currentMode;
  const retryLabel = cm==='review' ? 'もう一度間違い直し' : 'もう一度挑戦する';
  qarea.innerHTML=`<div class="fin-card">
    <div class="emoji">${emoji}</div>
    <h2>全問終了！</h2>
    <div class="fscore">${score} / ${qOrder.length}</div>
    <p>正解率 ${pct}%<br>${msg}</p>
    <button class="rbtn" onclick="sessionStorage.setItem('qs_restart','${cs}');sessionStorage.setItem('qs_mode','${cm}');location.reload()" style="margin-bottom:8px">${retryLabel}</button><br>
    <button class="rbtn" onclick="location.reload()" style="background:rgba(124,58,237,.4);margin-top:8px">メニューへ戻る</button>
  </div>`;
  document.getElementById('ctrl').style.display='none';
  document.getElementById('hdrControls').style.display='none';
  document.getElementById('hdrCat').style.display='none';
  document.getElementById('progWrap').style.display='none';
}

function migrateWrongList(s){
  try {
    const raw = localStorage.getItem(getSaveKey(s));
    if(!raw) return;
    const sv = JSON.parse(raw);
    if(!Array.isArray(sv.order)||!Array.isArray(sv.answers)) return;
    sv.answers.forEach((ans, i) => {
      if(ans !== null && i < sv.order.length){
        const allIdx = sv.order[i];
        if(allIdx < ALL.length && ans !== ALL[allIdx].ans) addToWrongList(s, allIdx);
      }
    });
  } catch(e){}
}
migrateWrongList(1);
migrateWrongList(2);

const _rs = parseInt(sessionStorage.getItem('qs_restart')||'0');
const _rm = sessionStorage.getItem('qs_mode')||'normal';
sessionStorage.removeItem('qs_restart');
sessionStorage.removeItem('qs_mode');
if(_rs===1||_rs===2){ startSubject(_rs, _rm); } else { showMenu(); }
</script>
