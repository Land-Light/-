  .route-card .meta { font-size: 11px; color: #6b7280; display: flex; gap: 10px; align-items: center; }
  .route-card .savings { background: #ecfdf5; color: #047857; font-size: 11px; font-weight: 500; padding: 5px 8px; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; gap: 4px; }

  <div class="icon">🚃</div>

    <h1>通勤定期ルート検索</h1>
    <p>定期券を登録して最安ルートを探す</p>
  </div>
  <div id="pass-badge" class="badge">🎫 <span id="pass-badge-count">0</span>件 有効</div>
</header>
<main>

    <div class="section">
      <h2>🔍 ルート検索</h2>
      <div class="field">
        <label>出発駅</label>
        <div class="combo" id="from-combo">
          <div class="combo-input"><input id="from-input" type="text" placeholder="出発駅を入力..." autocomplete="off"></div>
          <div class="combo-list" id="from-list"></div>
        </div>
      </div>
      <div class="swap"><button id="swap-btn" title="入れ替え">⇅</button></div>
      <div class="field">
        <label>到着駅</label>
        <div class="combo" id="to-combo">
          <div class="combo-input"><input id="to-input" type="text" placeholder="到着駅を入力..." autocomplete="off"></div>
          <div class="combo-list" id="to-list"></div>
        </div>
      </div>
      <button class="btn-primary" id="search-btn" disabled>🔍 最安ルートを検索</button>
    </div>
    <div class="section" id="results-section" style="display:none">
      <h2>📍 検索結果 <span id="route-from-to" style="font-weight:400;color:#9ca3af;font-size:11px"></span></h2>
      <div id="results"></div>
    </div>
    <div class="section">
      <h2>🎫 登録済み定期券 <span id="pass-list-count" style="display:none;background:#dbeafe;color:#1d4ed8;font-size:11px;padding:1px 8px;border-radius:999px;margin-left:4px"></span></h2>
      <div id="pass-list"></div>
      <div id="pass-form-area"></div>
    </div>
  </aside>
  <div class="map-area">
    <div class="welcome" id="welcome"><div class="card"><div class="emoji">🚃</div><h3>ルート検索を始めよう</h3><p>左パネルで出発駅・到着駅を選び、定期券を登録すると最安ルートが地図上に表示されます</p></div></div>
    <div id="map"></div>
  </div>
</main>

function haversineKm(a, b) {
  var R = 6371;
  var toRad = function (d) { return d * Math.PI / 180; };
  var dLat = toRad(b.lat - a.lat);
  var dLng = toRad(b.lng - a.lng);
  var la1 = toRad(a.lat), la2 = toRad(b.lat);
  var h = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2 * R * Math.asin(Math.sqrt(h));
}

    if (km <= 20) return 320;
    if (km <= 25) return 400;
    if (km <= 30) return 480;
    return 520;
  }
  if (km <= 8) return 180;
  if (km <= 14) return 210;
  if (km <= 19) return 240;
  return 270;
}

function buildConnections() {
  var conns = [];
  LINES.forEach(function (line) {
    for (var i = 0; i < line.stations.length - 1; i++) {
      var a = STATION_MAP.get(line.stations[i]);
      var b = STATION_MAP.get(line.stations[i + 1]);
      if (!a || !b) continue;
      var km = haversineKm(a, b);
      var time = Math.max(1, Math.round(km * 2 + 1));
      conns.push({ from: a.id, to: b.id, lineId: line.id, km: km, time: time });
      conns.push({ from: b.id, to: a.id, lineId: line.id, km: km, time: time });
    }
  });
  return conns;
}

var CONNECTIONS = buildConnections();

function isPassCovered(conn, pass) {
  if (conn.lineId !== pass.lineId) return false;
  var line = LINE_MAP.get(pass.lineId);
  if (!line) return false;
  var idx = line.stations;
  var pf = idx.indexOf(pass.fromStationId);
  var pt = idx.indexOf(pass.toStationId);
  var cf = idx.indexOf(conn.from);
  var ct = idx.indexOf(conn.to);
  if (pf < 0 || pt < 0 || cf < 0 || ct < 0) return false;
  var pMin = Math.min(pf, pt), pMax = Math.max(pf, pt);
  var cMin = Math.min(cf, ct), cMax = Math.max(cf, ct);
  return cMin >= pMin && cMax <= pMax;
}

function activePasses() {
  var now = new Date();
  return state.passes.filter(function (p) { return new Date(p.validUntil) >= now; });
}

function buildGraph() {
  var passes = activePasses();
  var graph = new Map();
  CONNECTIONS.forEach(function (c) {
    var line = LINE_MAP.get(c.lineId);
    if (!line) return;
    var origFare = calcFare(line.operator, c.km);
    var covered = false, passId = null;
    for (var i = 0; i < passes.length; i++) {
      if (isPassCovered(c, passes[i])) { covered = true; passId = passes[i].id; break; }
    }
    if (!graph.has(c.from)) graph.set(c.from, []);
    graph.get(c.from).push({
      to: c.to, lineId: c.lineId,
      cost: covered ? 0 : origFare,
      origCost: origFare,
      time: c.time, covered: covered, passId: passId, km: c.km
    });
  });
  return graph;
}

function dijkstra(fromId, toId, graph) {
  if (fromId === toId) return null;
  var dist = new Map();
  dist.set(fromId, 0);
  var queue = [{ id: fromId, cost: 0, origCost: 0, time: 0, path: [] }];
  while (queue.length > 0) {
    var bestIdx = 0;
    for (var i = 1; i < queue.length; i++) {
      if (queue[i].cost < queue[bestIdx].cost) bestIdx = i;
    }
    var cur = queue.splice(bestIdx, 1)[0];
    if (cur.id === toId) return cur;
    if (cur.cost > (dist.get(cur.id) || Infinity)) continue;
    var edges = graph.get(cur.id) || [];
    for (var j = 0; j < edges.length; j++) {
      var e = edges[j];
      var nc = cur.cost + e.cost;
      if (nc < (dist.get(e.to) == null ? Infinity : dist.get(e.to))) {
        dist.set(e.to, nc);
        var step = {
          from: cur.id, to: e.to, lineId: e.lineId,
          fare: e.cost, origFare: e.origCost,
          covered: e.covered, passId: e.passId, time: e.time
        };
        queue.push({
          id: e.to, cost: nc,
          origCost: cur.origCost + e.origCost,
          time: cur.time + e.time,
          path: cur.path.concat([step])
        });
      }
    }
  }
  return null;
}

function mergeSegments(path) {
  var segs = [];
  for (var i = 0; i < path.length; i++) {
    var p = path[i];
    var last = segs[segs.length - 1];
    if (last && last.lineId === p.lineId && last.covered === p.covered) {
      last.to = p.to;
      last.fare += p.fare;
      last.origFare += p.origFare;
      last.time += p.time;
    } else {
      segs.push({ from: p.from, to: p.to, lineId: p.lineId, fare: p.fare, origFare: p.origFare, covered: p.covered, passId: p.passId, time: p.time });
    }
  }
  return segs;
}

function routeFromResult(r) {
  if (!r) return null;
  var segs = mergeSegments(r.path);
  var transfers = 0;
  for (var i = 1; i < segs.length; i++) {
    if (segs[i].lineId !== segs[i-1].lineId) transfers++;
  }
  var total = 0, orig = 0;
  segs.forEach(function (s) { total += s.fare; orig += s.origFare; });
  return {
    segments: segs, totalFare: total, originalFare: orig,
    savings: Math.max(0, orig - total),
    totalTime: r.time, transfers: transfers
  };
}

function findRoutes(fromId, toId) {
  var graph = buildGraph();
  var first = dijkstra(fromId, toId, graph);
  if (!first) return [];
  var routes = [routeFromResult(first)];
  // Alternative routes: remove a segment from each position in best path
  for (var i = 0; i < first.path.length && routes.length < 3; i++) {
    var blocked = first.path[i];
    var g2 = new Map();
    graph.forEach(function (edges, node) {
      g2.set(node, edges.filter(function (e) {
        var sameFwd = (node === blocked.from && e.to === blocked.to && e.lineId === blocked.lineId);
        var sameBwd = (node === blocked.to && e.to === blocked.from && e.lineId === blocked.lineId);
        return !sameFwd && !sameBwd;
      }));
    });
    var alt = dijkstra(fromId, toId, g2);
    if (alt) {
      var r2 = routeFromResult(alt);
      var sig = r2.segments.map(function (s) { return s.lineId + ':' + s.from + '>' + s.to; }).join('|');
      var dup = routes.some(function (r) {
        return r.segments.map(function (s) { return s.lineId + ':' + s.from + '>' + s.to; }).join('|') === sig;
      });
      if (!dup) routes.push(r2);
    }
  }
  return routes.sort(function (a, b) { return a.totalFare - b.totalFare; });
}

// Combo dropdowns
function setupCombo(side) {
  var input = $(side + '-input');
  var list = $(side + '-list');
  var combo = $(side + '-combo');

  function render(query) {
    var q = (query || '').trim();
    var excludeId = side === 'from' ? state.toId : state.fromId;
    var filtered = STATIONS.filter(function (s) {
      if (s.id === excludeId) return false;
      if (q === '') return true;
      return s.name.indexOf(q) !== -1;
    }).slice(0, 30);
    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-item">該当する駅がありません</div>';
    } else {
      list.innerHTML = filtered.map(function (s) {
        return '<div class="item" data-id="' + s.id + '">' + s.name + '</div>';
      }).join('');
    }
  }

  input.addEventListener('focus', function () {
    render(input.value);
    list.classList.add('open');
  });
  input.addEventListener('input', function () {
    if (side === 'from') state.fromId = ''; else state.toId = '';
    updateSearchBtn();
    render(input.value);
    list.classList.add('open');
  });
  list.addEventListener('mousedown', function (e) {
    var item = e.target.closest('.item');
    if (!item) return;
    var id = item.getAttribute('data-id');
    var st = STATION_MAP.get(id);
    if (!st) return;
    input.value = st.name;
    if (side === 'from') state.fromId = id; else state.toId = id;
    list.classList.remove('open');
    updateSearchBtn();
  });
  document.addEventListener('mousedown', function (e) {
    if (!combo.contains(e.target)) list.classList.remove('open');
  });
}

function fmtTime(min) {
  if (min < 60) return min + '分';
  return Math.floor(min / 60) + '時間' + (min % 60 > 0 ? (min % 60) + '分' : '');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function renderResults() {
  var section = $('results-section');
  var container = $('results');
  var header = $('route-from-to');
  var from = STATION_MAP.get(state.fromId);
  var to = STATION_MAP.get(state.toId);
  if (from && to) header.textContent = from.name + ' → ' + to.name;
  if (state.routes.length === 0) {
    container.innerHTML = '<div class="empty">ルートが見つかりませんでした</div>';
    section.style.display = 'block';
    return;
  }
  var html = state.routes.map(function (route, i) {
    var lineIds = [];
    route.segments.forEach(function (s) { if (lineIds.indexOf(s.lineId) === -1) lineIds.push(s.lineId); });
    var tags = lineIds.map(function (lid) {
      var line = LINE_MAP.get(lid);
      return line ? '<span class="tag" style="background:' + line.color + '">' + escapeHtml(line.name) + '</span>' : '';
    }).join('');
    var segs = route.segments.map(function (seg, j) {
      var line = LINE_MAP.get(seg.lineId);
      var fs = STATION_MAP.get(seg.from);
      var ts = STATION_MAP.get(seg.to);
      var color = line ? line.color : '#888';
      var transferHtml = j > 0 ? '<span class="transfer">乗換</span>' : '';
      var fareHtml = seg.covered
        ? '<span class="covered">✓ 定期</span>'
        : '<span class="paid">¥' + seg.fare + '</span>';
      return transferHtml + '<span class="seg">' +
        '<span class="dot" style="background:' + color + '"></span>' +
        '<span>' + escapeHtml(fs ? fs.name : '?') + '</span>' +
        '<span class="arrow">→</span>' +
        '<span>' + escapeHtml(ts ? ts.name : '?') + '</span>' +
        fareHtml + '</span>';
    }).join('');
    var selected = i === state.selectedRoute ? ' selected' : '';
    var cheap = i === 0 ? '<span class="badge-cheap">最安</span>' : '';
    var orig = route.savings > 0 ? '<span class="orig">¥' + route.originalFare.toLocaleString() + '</span>' : '';
    var savings = route.savings > 0
      ? '<div class="savings">🏷 定期券利用で ¥' + route.savings.toLocaleString() + ' 節約</div>'
      : '';
    return '<button class="route-card' + selected + '" data-idx="' + i + '">' +
      '<div class="top">' +
        '<div class="fare">' + cheap + '¥' + route.totalFare.toLocaleString() + orig + '</div>' +
        '<div class="meta"><span>⏱ ' + fmtTime(route.totalTime) + '</span><span>🔄 乗換' + route.transfers + '回</span></div>' +
      '</div>' +
      savings +
      '<div class="segs">' + segs + '</div>' +
      '<div class="tags">' + tags + '</div>' +
      '</button>';
  }).join('');
  container.innerHTML = html;
  Array.prototype.forEach.call(container.querySelectorAll('.route-card'), function (el) {
    el.addEventListener('click', function () {
      state.selectedRoute = parseInt(el.getAttribute('data-idx'), 10);
      renderResults();
      updateMap();
    });
  });
  section.style.display = 'block';
}

// ========== MAP RENDERING ==========
var mapLayers = [];
function clearMap() {
  mapLayers.forEach(function (l) { map.removeLayer(l); });
  mapLayers = [];
}
function addLayer(l) { map.addLayer(l); mapLayers.push(l); }

function makeBadgeIcon(text, color, size) {
  var html = '<div style="background:' + color + ';color:#fff;border-radius:50%;width:' + size + 'px;height:' + size + 'px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:' + Math.round(size * 0.45) + 'px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);font-family:inherit">' + text + '</div>';
  return L.divIcon({ html: html, className: '', iconSize: [size, size], iconAnchor: [size/2, size/2] });
}

function updateMap() {
  clearMap();
  var welcome = $('welcome');
  var route = state.routes[state.selectedRoute];
  if (!route) {
    welcome.style.display = 'flex';
    return;
  }
  welcome.style.display = 'none';
  var bounds = [];
  route.segments.forEach(function (seg) {
    var line = LINE_MAP.get(seg.lineId);
    if (!line) return;
    var color = seg.covered ? '#22c55e' : line.color;
    var weight = seg.covered ? 7 : 5;
    var stations = line.stations;
    var fi = stations.indexOf(seg.from);
    var ti = stations.indexOf(seg.to);
    if (fi < 0 || ti < 0) return;
    var lo = Math.min(fi, ti), hi = Math.max(fi, ti);
    var slice = stations.slice(lo, hi + 1);
    if (fi > ti) slice.reverse();
    var latlngs = [];
    slice.forEach(function (id) {
      var s = STATION_MAP.get(id);
      if (s) { latlngs.push([s.lat, s.lng]); bounds.push([s.lat, s.lng]); }
    });
    if (latlngs.length >= 2) {
      addLayer(L.polyline(latlngs, { color: color, weight: weight, opacity: .88 }));
    }
  });
  var first = route.segments[0];
  var last = route.segments[route.segments.length - 1];
  var start = STATION_MAP.get(first.from);
  var end = STATION_MAP.get(last.to);
  if (start) {
    addLayer(L.marker([start.lat, start.lng], { icon: makeBadgeIcon('出', '#22c55e', 30) }).bindTooltip(start.name));
    bounds.push([start.lat, start.lng]);
  }
  if (end) {
    addLayer(L.marker([end.lat, end.lng], { icon: makeBadgeIcon('着', '#ef4444', 30) }).bindTooltip(end.name));
    bounds.push([end.lat, end.lng]);
  }
  for (var i = 0; i < route.segments.length - 1; i++) {
    var st = STATION_MAP.get(route.segments[i].to);
    if (st) addLayer(L.marker([st.lat, st.lng], { icon: makeBadgeIcon('乗', '#f59e0b', 22) }).bindTooltip('乗換: ' + st.name));
  }
  if (bounds.length > 0) {
    map.fitBounds(L.latLngBounds(bounds), { padding: [50, 50] });
  }
}

        renderResults();

}

function estimateMonthly(lineId, fromId, toId) {
  var line = LINE_MAP.get(lineId);
  if (!line) return null;
  var fi = line.stations.indexOf(fromId);
  var ti = line.stations.indexOf(toId);
  if (fi < 0 || ti < 0 || fi === ti) return null;
  var lo = Math.min(fi, ti), hi = Math.max(fi, ti);
  var km = 0;
  for (var i = lo; i < hi; i++) {
    var a = STATION_MAP.get(line.stations[i]);
    var b = STATION_MAP.get(line.stations[i + 1]);
    if (a && b) km += haversineKm(a, b);
  }
  var oneway = calcFare(line.operator, km);
  var m1 = Math.round(oneway * 2 * 20 * 0.6 / 10) * 10;
  var m3 = Math.round(m1 * 3 * 0.9 / 10) * 10;
  var m6 = Math.round(m1 * 6 * 0.8 / 10) * 10;
  return { m1: m1, m3: m3, m6: m6, km: km };
}

function defaultValidUntil(passType) {
  var d = new Date();
  if (passType === '3month') d.setMonth(d.getMonth() + 3);
  else if (passType === '6month') d.setMonth(d.getMonth() + 6);
  else d.setMonth(d.getMonth() + 1);
  return d.toISOString().slice(0, 10);
}

        '<div class="field"><label>降車駅</label><select id="pf-to"><option value="">選択...</option></select></div>' +
      '</div>' +

        '<div class="field"><label>種別</label><select id="pf-type">' +

      '</div>' +

  $('pf-save').addEventListener('click', function () {
    var lid = lineSel.value, fid = fromSel.value, tid = toSel.value;
    if (!lid || !fid || !tid || fid === tid) {
      alert('路線と異なる2つの駅を選択してください');
      return;
    }
    if (!validInp.value) {
      alert('有効期限を入力してください');
      return;
    }
    state.passes.push({
      id: genId(), lineId: lid,
      fromStationId: fid, toStationId: tid,
      passType: typeSel.value, validUntil: validInp.value
    });
    savePasses();
    renderPassList();
    renderPassForm(false);
    if (state.searched && state.fromId && state.toId) {
      state.routes = findRoutes(state.fromId, state.toId);
      state.selectedRoute = 0;
      renderResults();
      updateMap();
    }
  });
}

renderPassList();
renderPassForm(false);

console.log('App ready. Stations:', STATIONS.length, 'Lines:', LINES.length, 'Connections:', CONNECTIONS.length, 'Passes:', state.passes.length);
</script>
</body>
</html>
