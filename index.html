<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会社法クイズ 100問</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Kaku Gothic Pro', 'メイリオ', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #1e293b;
    border-bottom: 1px solid #334155;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .header-left { display: flex; align-items: center; gap: 12px; }

  .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  .header-info h1 { font-size: 16px; font-weight: 600; }
  .header-info p { font-size: 12px; color: #94a3b8; }

  .score-badge {
    background: #1e3a5f;
    border: 1px solid #3b82f6;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    color: #93c5fd;
    font-weight: 600;
  }

  .progress-bar-wrap {
    background: #1e293b;
    border-bottom: 1px solid #334155;
    padding: 8px 20px;
    flex-shrink: 0;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #64748b;
    margin-bottom: 5px;
  }

  .progress-bar {
    height: 4px;
    background: #334155;
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #6366f1, #8b5cf6);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .chat-area::-webkit-scrollbar { width: 5px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

  .msg {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    animation: fadeUp 0.3s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  .msg.bot .msg-avatar { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
  .msg.user .msg-avatar { background: linear-gradient(135deg, #059669, #10b981); }

  .msg-content { max-width: 75%; display: flex; flex-direction: column; gap: 8px; }
  .msg.user .msg-content { align-items: flex-end; }

  .bubble {
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.6;
  }

  .msg.bot .bubble {
    background: #1e293b;
    border: 1px solid #334155;
    border-top-left-radius: 4px;
  }

  .msg.user .bubble {
    background: linear-gradient(135deg, #6366f1, #7c3aed);
    border-top-right-radius: 4px;
    color: #fff;
  }

  .q-number {
    font-size: 11px;
    color: #6366f1;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .q-text { font-size: 15px; font-weight: 600; line-height: 1.5; }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 75%;
    margin-left: 44px;
    animation: fadeUp 0.3s ease 0.1s both;
  }

  .choice-btn {
    background: #1e293b;
    border: 1px solid #475569;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 14px;
    color: #cbd5e1;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .choice-btn:hover:not(:disabled) {
    background: #2d3f5a;
    border-color: #6366f1;
    color: #fff;
    transform: translateX(3px);
  }

  .choice-btn .label {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #334155;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .choice-btn:hover:not(:disabled) .label { background: #6366f1; }

  .choice-btn.correct {
    background: #052e16;
    border-color: #16a34a;
    color: #86efac;
  }
  .choice-btn.correct .label { background: #16a34a; color: #fff; }

  .choice-btn.wrong {
    background: #2d0a0a;
    border-color: #dc2626;
    color: #fca5a5;
  }
  .choice-btn.wrong .label { background: #dc2626; color: #fff; }

  .choice-btn.reveal-correct {
    background: #052e16;
    border-color: #16a34a;
    color: #86efac;
  }
  .choice-btn.reveal-correct .label { background: #16a34a; color: #fff; }

  .choice-btn:disabled { cursor: default; transform: none; }

  .explanation {
    background: #0f2540;
    border: 1px solid #1e3a5f;
    border-left: 3px solid #6366f1;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 13px;
    color: #93c5fd;
    line-height: 1.7;
    max-width: 75%;
    margin-left: 44px;
    animation: fadeUp 0.3s ease;
  }

  .explanation strong { color: #a5b4fc; }

  .result-bubble {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }

  .result-bubble.ok  { background: #052e16; color: #4ade80; border: 1px solid #16a34a; }
  .result-bubble.ng  { background: #2d0a0a; color: #f87171; border: 1px solid #dc2626; }

  .next-btn {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none;
    border-radius: 12px;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.2s;
    margin-left: 44px;
    animation: fadeUp 0.3s ease;
    font-family: inherit;
  }

  .next-btn:hover { opacity: 0.85; transform: translateY(-1px); }

  .finish-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 32px;
    text-align: center;
    margin: 0 auto;
    max-width: 400px;
    animation: fadeUp 0.5s ease;
  }

  .finish-card .emoji { font-size: 60px; margin-bottom: 12px; }
  .finish-card h2 { font-size: 22px; margin-bottom: 8px; }
  .finish-card .final-score {
    font-size: 48px;
    font-weight: 700;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 12px 0;
  }
  .finish-card p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
  .finish-card .restart-btn {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none;
    border-radius: 12px;
    padding: 12px 32px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.2s;
  }
  .finish-card .restart-btn:hover { opacity: 0.85; }

  .typing-indicator {
    display: flex; gap: 5px; align-items: center;
    padding: 12px 16px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 18px;
    border-top-left-radius: 4px;
    width: fit-content;
  }

  .typing-indicator span {
    width: 7px; height: 7px;
    background: #6366f1;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="avatar">🧠</div>
    <div class="header-info">
      <h1>会社法クイズBot</h1>
      <p>100問チャレンジ</p>
    </div>
  </div>
  <div class="score-badge" id="scoreBadge">0 / 0</div>
</header>

<div class="progress-bar-wrap">
  <div class="progress-info">
    <span id="progressText">問題 0 / 100</span>
    <span id="progressPct">0%</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<div class="chat-area" id="chatArea"></div>

<script>
const quizData = [
  // ===== 会社の種類・総則 (1-5) =====
  { q:"会社法上の「会社」に含まれないものはどれか？", choices:["株式会社","合同会社","合資会社","相互会社"], ans:3, exp:"会社法2条1号で会社とは「株式会社、合名会社、合資会社又は合同会社をいう」と定義されています。相互会社は保険業法上の法人であり、会社法上の「会社」には含まれません。" },
  { q:"持分会社に該当しないものはどれか？", choices:["合名会社","合資会社","合同会社","株式会社"], ans:3, exp:"持分会社とは合名会社・合資会社・合同会社の総称です（会社法575条1項）。株式会社は持分会社ではありません。" },
  { q:"会社法上、法人格を持つのはどの段階からか？", choices:["設立登記を申請したとき","設立登記が完了したとき","定款を作成したとき","発起人が出資したとき"], ans:1, exp:"株式会社は設立の登記をすることによって成立します（会社法49条）。登記完了時に法人格を取得します。" },
  { q:"会社の住所（本店所在地）の決定について正しいものはどれか？", choices:["取締役が決める","定款で定める","株主総会で決める","法務局が決める"], ans:1, exp:"本店の所在地は定款の絶対的記載事項です（会社法27条3号）。定款に記載しなければ定款の効力自体が生じません。" },
  { q:"合同会社の社員の責任として正しいものはどれか？", choices:["無限責任","有限責任","直接責任","連帯責任"], ans:1, exp:"合同会社の社員は全員が有限責任社員です（会社法576条4項）。これが合名会社（全員無限責任）・合資会社（無限＋有限混在）との違いです。" },

  // ===== 株式会社の設立 (6-18) =====
  { q:"株式会社の定款の絶対的記載事項として誤っているものはどれか？", choices:["目的","商号","発行可能株式総数","本店所在地"], ans:2, exp:"絶対的記載事項（会社法27条）は①目的②商号③本店所在地④設立に際して出資される財産の価額・最低額⑤発起人の氏名と住所の5つです。発行可能株式総数は設立登記前に定款で定めれば足りるため、成立時の必須記載事項ではありません。" },
  { q:"発起設立と募集設立の違いとして正しいものはどれか？", choices:["発起設立は取締役会設置会社のみ選択できる","募集設立では設立時株主を外部から募集する","発起設立では公証人の認証が不要","募集設立では創立総会が不要"], ans:1, exp:"募集設立とは発起人以外の者（募集株主）に株式を引き受けさせる設立方法です（会社法25条1項2号）。設立後に創立総会の開催が必要です。発起設立では創立総会は開かれません。" },
  { q:"株式会社の定款に公証人の認証が必要な理由として最も適切なものはどれか？", choices:["税務申告のため","定款の真正性と法的効力を担保するため","商号の重複を防ぐため","株主名簿作成のため"], ans:1, exp:"株式会社の定款は公証人の認証を受けなければ効力を生じません（会社法30条1項）。定款の真正を担保し、その後の改変を防ぐための措置です。" },
  { q:"現物出資の目的となりえないものはどれか？", choices:["土地","特許権","労務（労働の提供）","著作権"], ans:2, exp:"現物出資の目的は財産（金銭以外の財産）に限られます（会社法28条1号）。労務（サービスの提供）は財産ではないため現物出資の目的にはなりません。" },
  { q:"変態設立事項（相対的記載事項）に含まれないものはどれか？", choices:["現物出資","財産引受け","発起人の報酬","株主の剰余金配当請求権"], ans:3, exp:"変態設立事項（会社法28条）は①現物出資②財産引受け③発起人の報酬・特別利益④設立費用の4つです。株主の剰余金配当請求権は変態設立事項ではありません。" },
  { q:"発起設立における設立時取締役の選任について正しいものはどれか？", choices:["公証人が選任する","発起人が選任する","設立時株主が選任する","裁判所が選任する"], ans:1, exp:"発起設立では、発起人全員の同意（または過半数）によって設立時取締役を選任します（会社法40条1項）。募集設立では創立総会で選任します。" },
  { q:"株式会社の設立に際し、出資の履行完了後に選任された設立時取締役が行う職務として正しいものはどれか？", choices:["定款の作成","商号の登録","設立手続の調査","株主名簿の公告"], ans:2, exp:"設立時取締役は、設立に関する事項に違法・不当なものがないかを調査する義務があります（会社法46条1項）。この調査義務は重要な設立手続の一つです。" },
  { q:"会社設立の無効を主張できる者として正しいものはどれか？", choices:["誰でも","株主・取締役・監査役のみ","発起人のみ","債権者のみ"], ans:1, exp:"会社設立の無効は、設立無効の訴えによってのみ主張できます（会社法828条1項1号）。提訴権者は株主等・取締役・監査役・清算人等に限られます。" },
  { q:"設立時における仮装払込（みせ金）を行った場合、その責任を負うのは誰か？", choices:["公証人","法務局長","設立時取締役と発起人が連帯責任を負う","銀行のみ"], ans:2, exp:"払込みを仮装した発起人・設立時取締役は、払込みを仮装した出資額を支払う義務を負います（会社法52条の2）。連帯して責任を負います。" },
  { q:"募集設立において創立総会が開催される目的として最も適切なものはどれか？", choices:["会社の解散を決議するため","設立の妥当性審査と設立時役員の選任のため","株主配当を決議するため","定款の廃止を決議するため"], ans:1, exp:"創立総会は募集設立における最高機関で、設立に関する事項の審議（会社法65条）、設立時取締役・監査役の選任（会社法88条）などを行います。" },
  { q:"設立費用（変態設立事項の一つ）として定款に記載できる上限はどのように定まるか？", choices:["法定の上限額がある","定款自治で自由に定める","法務大臣が決める","商業登記の費用と同額"], ans:1, exp:"設立費用は定款に記載した額を限度として会社が負担します（会社法28条4号）。上限は法定されておらず、定款の記載範囲内で設立時取締役が妥当性を調査します。" },
  { q:"合同会社（LLC）の特徴として誤っているものはどれか？", choices:["社員全員が有限責任","定款自治の範囲が広い","株式を発行できる","法人格を持つ"], ans:2, exp:"合同会社は「株式」を発行しません。社員の出資持分という形態をとります。一方で有限責任・広い定款自治・法人格の3点は合同会社の特徴です。" },

  // ===== 株式 (19-33) =====
  { q:"株式の特質として最も適切でないものはどれか？", choices:["有限責任の原則","株式の自由譲渡性","株主平等の原則","株主の業務執行権"], ans:3, exp:"株主は株主総会での議決権行使はできますが、原則として業務執行に直接携わる権限はありません。業務執行は取締役が行います（会社法348条）。" },
  { q:"株主平等の原則とは何か？", choices:["全株主が同数の議決権を持つ","株主はその有する株式の内容と数に応じて平等に取り扱われる","全株主が同額の配当を受ける","全株主が経営に参加できる"], ans:1, exp:"会社法109条1項「株式会社は、株主を、その有する株式の内容及び数に応じて、平等に取り扱わなければならない」と規定されています。" },
  { q:"譲渡制限株式とは何か？", choices:["取引所で売買できない株式","会社の承認なしに譲渡できない株式","外国人に譲渡できない株式","一定期間譲渡できない株式"], ans:1, exp:"譲渡制限株式とは、譲渡による当該株式の取得について会社の承認を要する旨の定めが定款にある株式です（会社法2条17号）。非公開会社では全株式を譲渡制限とすることができます。" },
  { q:"自己株式の取得についての原則として正しいのはどれか？", choices:["常に禁止","株主総会の決議があれば取得可能","取締役会決議だけで自由に取得できる","代表取締役が単独で決定できる"], ans:1, exp:"自己株式の取得は原則として株主総会（普通決議）の授権が必要です（会社法156条1項）。ただし一定の場合は取締役会または代表取締役に委任できます。" },
  { q:"株主が行使できる権利のうち「共익권（共益権）」に該当するものはどれか？", choices:["剰余金配当請求権","残余財産分配請求権","議決権","株式買取請求権"], ans:2, exp:"共益権とは会社の経営に参加するための権利で、議決権・提案権・総会招集請求権などが含まれます。剰余金配当・残余財産分配は自益権（経済的利益を受ける権利）です。" },
  { q:"株主総会において一株一議決権の原則の例外として認められるものはどれか？", choices:["議決権制限株式","取締役が独断で決定する場合","外国株主の議決権排除","会社の規模による制限"], ans:0, exp:"会社法は一株一議決権を原則としますが（会社法308条1項）、議決権制限株式（会社法108条1項3号）を発行することで特定の事項につき議決権を制限・排除できます。" },
  { q:"単元株制度について正しいものはどれか？", choices:["1単元未満の株式には議決権がない","1単元は法律で100株と定められている","単元未満株主は配当も受けられない","単元株式数は取締役会で自由に変更できる"], ans:0, exp:"単元株制度（会社法188条以下）では、1単元未満の株式には議決権が認められません。単元株式数は1,000株以下かつ発行済株式総数の200分の1以下の範囲で定款で定めます。" },
  { q:"新株予約権について正しいものはどれか？", choices:["権利行使すると会社に対して社員の地位を取得する","一定期間内に一定数の株式を一定価格で取得できる権利","新株予約権を消却すると出資義務が生じる","社外取締役にのみ発行できる"], ans:1, exp:"新株予約権とは、一定期間内に会社に対して行使することで当該会社の株式の交付を受けることができる権利です（会社法2条21号）。ストックオプション等に活用されます。" },
  { q:"株主が会社に対して株式の買取りを請求できる場面として適切でないものはどれか？", choices:["合併に反対した場合","取締役の選任に反対した場合","事業の全部の譲渡に反対した場合","定款変更によって株式が譲渡制限となった場合"], ans:1, exp:"反対株主の株式買取請求権は、組織再編（合併・会社分割等）や事業譲渡、譲渡制限の設定など一定の重要行為の場合に認められます（会社法116条等）。取締役の選任への反対では買取請求権は生じません。" },
  { q:"株式分割と株式無償割当ての違いについて正しいものはどれか？", choices:["株式分割では既存株主の割合は変わらないが、株式無償割当では変わる","株式分割は株主総会特別決議が必要","株式無償割当では異なる種類株式を交付できる","株式分割と株式無償割当は法的効果が同じ"], ans:2, exp:"株式無償割当て（会社法185条）では異なる種類の株式を交付することができます。株式分割（会社法183条）は同一種類の株式のみです。両者は自己株式の取り扱い等でも異なります。" },
  { q:"会社が発行できる株式総数（発行可能株式総数）の制限について公開会社の場合、正しいものはどれか？", choices:["発行済株式総数の4倍を超えてはならない","発行済株式総数の10倍を超えてはならない","制限はない","1000株を超えてはならない"], ans:0, exp:"公開会社では発行可能株式総数は発行済株式の総数の4倍を超えることができません（会社法113条3項）。これは取締役会が大量の株式発行によって株主構成を変更することを防ぐための制限です。" },
  { q:"株主名簿の基準日について正しいものはどれか？", choices:["登記が必要","基準日から3ヵ月以内に権利を行使させる必要がある","定款にのみ記載できる","法務大臣が定める"], ans:1, exp:"基準日（会社法124条）は、基準日後3ヵ月以内に権利を行使させなければなりません（同条2項）。基準日は定款または取締役会（または取締役）で定め、公告が必要です。" },
  { q:"端株（たんかぶ）処理について正しいものはどれか？", choices:["端株主には議決権がある","単元未満株主は会社に買取りを請求できる","端株は自動的に消却される","端株は他の株主に強制的に移転される"], ans:1, exp:"単元未満株主は会社に対して、自己の有する単元未満株式を買い取ることを請求することができます（会社法192条）。これを「売渡請求」と呼ぶこともあります。" },
  { q:"株式の消却について正しいものはどれか？", choices:["全株主の同意が必要","自己株式を消却するには株主総会決議が必要","自己株式の消却は取締役会決議でできる","消却した株式は復活させることができる"], ans:2, exp:"自己株式の消却は取締役会決議によって行うことができます（会社法178条）。消却された株式は消滅し復活しません。発行済株式総数が減少します。" },

  // ===== 機関設計 (34-53) =====
  { q:"公開会社に必置の機関として正しいものはどれか？", choices:["監査役会","取締役会","会計監査人","指名委員会"], ans:1, exp:"公開会社は必ず取締役会を置かなければなりません（会社法327条1項1号）。監査役会・会計監査人は大会社等に必置ですが、公開会社一般に必置ではありません。" },
  { q:"取締役会設置会社において代表取締役の選定は誰が行うか？", choices:["株主総会","取締役会","監査役","会計監査人"], ans:1, exp:"取締役会設置会社では取締役会が代表取締役を選定します（会社法362条2項3号）。非取締役会設置会社では取締役の互選等で決めることができます。" },
  { q:"監査役の任期について正しいものはどれか？", choices:["1年","2年","3年（短縮不可）","4年（非公開会社では定款で10年に延長可）"], ans:3, exp:"監査役の任期は4年です（会社法336条1項）。非公開会社（非取締役会設置会社）では定款で10年まで延長可能です（同条2項）。取締役（原則2年）より長い任期が特徴です。" },
  { q:"取締役の善管注意義務（善良な管理者の注意義務）の法的根拠はどれか？", choices:["会社法330条・民法644条","商法11条","会社法423条","民法709条"], ans:0, exp:"会社法330条が株式会社と役員等の関係を委任に関する規定に従うと規定し、民法644条の善管注意義務が準用されます。これにより取締役は職務遂行において善良な管理者の注意が要求されます。" },
  { q:"取締役の競業避止義務について正しいものはどれか？", choices:["取締役は会社と同種の営業を一切禁止される","承認なき競業取引の利益は会社に帰属するものとみなされる","承認は代表取締役が行う","退任後も5年間は競業が禁止される"], ans:1, exp:"取締役が取締役会の承認なしに自己の計算で競業取引を行った場合、その取引によって得た利益は会社に生じた損害の額と推定されます（会社法423条2項）。これを「介入権（帰属権）」と呼びます。" },
  { q:"利益相反取引（間接取引）の承認機関として正しいものはどれか？", choices:["株主総会（特別決議）","取締役会","代表取締役","監査役"], ans:1, exp:"取締役会設置会社において、利益相反取引（直接取引・間接取引）を行うには取締役会の承認が必要です（会社法365条1項）。非設置会社では株主総会の承認が必要です（会社法356条1項）。" },
  { q:"株主総会の決議の種類と要件の組み合わせで誤っているものはどれか？", choices:["普通決議：議決権の過半数を有する株主出席＋出席者の議決権の過半数","特別決議：議決権の過半数を有する株主出席＋出席者の議決権の2/3以上","特殊決議：議決権の半数以上＋出席者の議決権の4分の3以上","特別普通決議：出席者の議決権の3分の1以上"], ans:3, exp:"「特別普通決議」という決議種別は会社法に存在しません。会社法上の主な決議種別は①普通決議（309条1項）②特別決議（309条2項）③特殊決議（309条3・4項）です。" },
  { q:"株主総会の招集について原則として正しいものはどれか？", choices:["いつでも招集できる","取締役が招集し公開会社では2週間前までに通知","株主全員が同意すれば招集手続を省略できる","監査役が招集する"], ans:1, exp:"取締役（取締役会設置会社では取締役会）が招集権を持ちます（会社法296条3項）。公開会社では株主総会の2週間前まで、非公開会社では1週間前までに招集通知を発しなければなりません（会社法299条1項）。" },
  { q:"株主総会における書面決議（みなし決議）が成立するための要件として正しいものはどれか？", choices:["取締役の提案に全株主が書面で同意した場合","議決権の過半数の株主が同意した場合","公開会社では認められない","監査役の同意が必要"], ans:0, exp:"株主全員が書面又は電磁的方法で提案（会社法319条1項）に同意した場合、株主総会の決議があったものとみなされます（みなし決議）。全員の同意が必要です。" },
  { q:"取締役会の定足数と決議要件について正しいものはどれか？", choices:["取締役の過半数出席・出席取締役の過半数の賛成","取締役全員の同意","取締役の3分の2以上出席・出席取締役の3分の2以上の賛成","取締役の過半数出席・出席取締役の3分の2以上の賛成"], ans:0, exp:"取締役会の決議は取締役の過半数が出席し、出席取締役の過半数の賛成が必要です（会社法369条1項）。ただし定款で要件を厳格化することはできます。" },
  { q:"監査役の権限について誤っているものはどれか？", choices:["取締役の業務執行の適法性監査","会計監査","業務執行の妥当性監査（業務監査）","取締役会への出席と意見陳述"], ans:2, exp:"監査役は取締役の職務執行の適法性監査を行いますが、業務執行の妥当性（経営判断の良し悪し）を監査する権限は原則としてありません。例外として会計参与設置会社等の場合に異なる扱いがあります。" },
  { q:"会計参与の設置について正しいものはどれか？", choices:["大会社に必置","任意設置機関（定款で任意に設置可）","公認会計士のみ就任できる","取締役と共同で決算書を作成する"], ans:3, exp:"会計参与は公認会計士（監査法人）または税理士（税理士法人）がなれる機関で（会社法333条1項）、取締役と共同して計算書類を作成します（会社法374条1項）。任意設置機関です。" },
  { q:"指名委員会等設置会社の三委員会として正しい組み合わせはどれか？", choices:["監査委員会・報酬委員会・指名委員会","内部統制委員会・監査委員会・報酬委員会","指名委員会・報酬委員会・リスク委員会","取締役委員会・監督委員会・指名委員会"], ans:0, exp:"指名委員会等設置会社（会社法2条12号）は指名委員会・監査委員会・報酬委員会の三委員会を設置します。各委員会は3名以上の取締役で構成し、過半数が社外取締役でなければなりません。" },
  { q:"社外取締役の要件として正しいものはどれか？", choices:["会社の従業員でないこと","その会社及び子会社の業務執行取締役・執行役・使用人でないこと","株主でないこと","他社の取締役でないこと"], ans:1, exp:"社外取締役（会社法2条15号）は、当該会社及びその子会社の業務執行取締役・執行役・支配人その他の使用人ではなく、かつ過去にもそうした地位になかったことが要件の核心です。" },
  { q:"役員等（取締役・監査役等）の会社に対する責任の軽減について正しいものはどれか？", choices:["株主総会特別決議だけで責任を全額免除できる","定款で責任限定契約を結べるのは社外取締役・社外監査役のみ","責任の一部免除は株主全員の同意が必要","責任限定契約の上限は年額報酬の2倍"], ans:1, exp:"定款の定めに基づく責任限定契約（会社法427条）は、社外取締役・社外監査役・会計参与・会計監査人のみが対象です。業務執行取締役には責任限定契約制度は利用できません。" },
  { q:"株主代表訴訟について正しいものはどれか？", choices:["誰でも提起できる","6ヵ月前から引き続き株式を有する株主が提起できる（非公開会社を除く）","訴訟で勝訴した場合の損害賠償は原告株主に帰属する","会社に対して提起する"], ans:1, exp:"株主代表訴訟（会社法847条）は原則として6ヵ月前から株式を保有する株主が提起できます（非公開会社は株式保有期間の制限なし）。会社の代わりに役員等を被告として提起し、勝訴した場合の賠償金は会社に帰属します。" },
  { q:"多重代表訴訟（特定責任追及の訴え）について正しいものはどれか？", choices:["子会社の株主が直接提起できる","完全親会社の株主が子会社役員を被告として提起できる","連結子会社の役員のみ対象","提訴請求は子会社に対して行う"], ans:1, exp:"多重代表訴訟（会社法847条の3）は、完全親会社（親会社の発行済株式の全部を保有する会社）の最終完全親会社等の株主が、子会社の役員に対して損害賠償を請求できる制度です。" },
  { q:"会計監査人の設置が義務付けられる会社はどれか？", choices:["公開会社","監査役会設置会社","大会社","取締役会設置会社"], ans:2, exp:"大会社（資本金5億円以上または負債200億円以上）は会計監査人を必置とします（会社法328条）。大会社は規模が大きく、計算書類の正確性を公認会計士・監査法人が監査する必要があります。" },
  { q:"取締役の報酬等について正しいものはどれか？", choices:["代表取締役が自由に決定できる","取締役会が決定する","定款または株主総会決議で定める","監査役が決定する"], ans:2, exp:"取締役の報酬は定款又は株主総会の決議によって定めます（会社法361条1項）。お手盛り防止のため、取締役が自分の報酬を自由に決定することはできません。" },
  { q:"取締役（代表取締役）の第三者に対する責任（会社法429条）の発生要件として正しいものはどれか？", choices:["取締役の故意または重大な過失による職務懈怠","取締役の軽過失による行為","会社の損失発生のみ","取締役の退任のみ"], ans:0, exp:"会社法429条1項は、役員等がその職務を行うについて悪意又は重大な過失があったときに第三者に対する損害賠償責任を認めます。軽過失では第三者への直接責任は生じません。" },

  // ===== 計算・配当 (54-60) =====
  { q:"剰余金の配当について正しいものはどれか？", choices:["取締役の単独決定で配当できる","原則として株主総会の決議が必要","監査役の承認で配当できる","債権者の同意が必要"], ans:1, exp:"剰余金の配当は原則として株主総会（普通決議）で決定します（会社法454条1項）。ただし一定の要件を満たす場合、取締役会設置会社では定款の定めにより取締役会決議で中間配当等が可能です。" },
  { q:"純資産額が300万円を下回る場合の剰余金配当について正しいものはどれか？", choices:["配当は禁止される","配当総額を減らして配当できる","株主全員の同意があれば配当できる","取締役会決議のみで配当できる"], ans:0, exp:"会社法458条により、剰余金の配当時に純資産額が300万円を下回ることとなる場合は配当ができません。これは会社の最低資本規制的な機能を果たします。" },
  { q:"資本金の額について正しいものはどれか？", choices:["最低資本金は1000万円","資本金の額に制限はなく1円から設立可能","資本金は変更できない","資本金は常に払込額と一致する"], ans:1, exp:"2006年の会社法施行により最低資本金制度は廃止され、現在は1円から株式会社を設立できます。ただし実際の会社運営には適切な資本が必要です。" },
  { q:"資本準備金の積立が義務付けられる場合として正しいものはどれか？", choices:["毎年純利益の10%","剰余金配当のたびに配当額の10分の1","新株発行の払込額の2分の1以上","新株予約権の行使のたびに半額"], ans:1, exp:"剰余金の配当をする際は、配当額の10分の1以上を資本準備金または利益準備金として積み立てなければなりません（会社法445条4項）。これは会社財産の充実・維持のための制度です。" },
  { q:"会社の計算書類として会社法で定められているものに含まれないものはどれか？", choices:["貸借対照表","損益計算書","株主資本等変動計算書","キャッシュフロー計算書"], ans:3, exp:"会社法435条2項で定める計算書類は①貸借対照表②損益計算書③株主資本等変動計算書④個別注記表の4つです。キャッシュフロー計算書は上場会社に適用される金融商品取引法で義務付けられますが、会社法上の計算書類ではありません。" },
  { q:"分配可能額の算定において控除されるものはどれか？", choices:["貸借対照表上の純資産額","資本金・準備金等","その他有価証券評価差額金の全額","役員報酬の未払額"], ans:1, exp:"分配可能額（会社法461条2項）はその他資本剰余金＋その他利益剰余金を基礎とし、資本金・各種準備金・自己株式等を差し引いて算定します。配当の財源規制です。" },
  { q:"違法配当（財源規制違反の配当）が行われた場合の効果として正しいものはどれか？", choices:["配当は当然無効で返還不要","株主は善意でも返還義務を負う","株主が悪意の場合のみ返還義務を負う","取締役が連帯して補填する義務を負う（善意株主への返還不要）"], ans:1, exp:"財源規制（会社法461条）に違反した配当を受けた株主は、善意・悪意を問わず配当額を会社に返還する義務を負います（会社法462条）。取締役等も連帯して補填義務を負います。" },

  // ===== 定款変更・組織変更 (61-65) =====
  { q:"定款変更の決議要件として原則正しいものはどれか？", choices:["取締役会の普通決議","株主総会の普通決議","株主総会の特別決議","全株主の同意"], ans:2, exp:"定款変更は株主総会の特別決議（議決権の過半数が出席し、出席者の議決権の3分の2以上の賛成）が必要です（会社法466条、309条2項11号）。" },
  { q:"公開会社が非公開会社に変更する定款変更に必要な決議はどれか？", choices:["株主総会特別決議","株主総会普通決議","全株主の同意（特殊決議）","取締役会決議"], ans:2, exp:"公開会社が全株式に譲渡制限を付す定款変更（非公開会社化）には、株主全員の同意または総株主の半数以上かつ議決権の4分の3以上の賛成による特殊決議が必要です（会社法309条3項1号）。" },
  { q:"株式会社から持分会社への組織変更について正しいものはどれか？", choices:["取締役会決議のみで可能","株主全員の同意が必要","株主総会特別決議で可能","監査役の承認が必要"], ans:1, exp:"株式会社から持分会社への組織変更は、総株主の同意（株主全員の同意）が必要です（会社法781条1項）。組織変更後に株主は全員社員となるため、全員の合意が必要とされています。" },

let answered = false;

const chatArea = document.getElementById('chatArea');
const scoreBadge = document.getElementById('scoreBadge');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const progressPct  = document.getElementById('progressPct');

function updateProgress() {
  const pct = Math.round((current / quizData.length) * 100);
  progressFill.style.width = pct + '%';
  progressText.textContent = `問題 ${current} / ${quizData.length}`;
  progressPct.textContent  = pct + '%';
  scoreBadge.textContent   = `${score} / ${current}`;
}

function scrollBottom() {
  setTimeout(() => chatArea.scrollTop = chatArea.scrollHeight, 50);
}

function addTypingThenQuestion() {
  const typing = document.createElement('div');
  typing.className = 'msg bot';
  typing.innerHTML = `<div class="msg-avatar">🧠</div>
    <div class="typing-indicator"><span></span><span></span><span></span></div>`;
  chatArea.appendChild(typing);
  scrollBottom();
  setTimeout(() => {
    chatArea.removeChild(typing);
    showQuestion(current);
  }, 700);
}

function showQuestion(idx) {
  if (idx >= quizData.length) { showFinish(); return; }
  const q = quizData[idx];
  answered = false;

  const msgEl = document.createElement('div');
  msgEl.className = 'msg bot';
  msgEl.innerHTML = `
    <div class="msg-avatar">🧠</div>
    <div class="msg-content">
      <div class="bubble">
        <div class="q-number">Q${idx + 1} / ${quizData.length}</div>
        <div class="q-text">${q.q}</div>
      </div>
    </div>`;
  chatArea.appendChild(msgEl);

  const labels = ['A','B','C','D'];
  const choicesEl = document.createElement('div');
  choicesEl.className = 'choices';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="label">${labels[i]}</span>${c}`;
    btn.dataset.idx = i;
    btn.addEventListener('click', () => onAnswer(btn, i, idx, choicesEl));
    choicesEl.appendChild(btn);
  });
  chatArea.appendChild(choicesEl);
  scrollBottom();
}

function onAnswer(clickedBtn, chosen, qIdx, choicesEl) {
  if (answered) return;
  answered = true;
  const q = quizData[qIdx];
  const correct = q.ans;

  Array.from(choicesEl.children).forEach((btn, i) => {
    btn.disabled = true;
    if (i === correct) btn.classList.add('reveal-correct');
  });

  const isCorrect = chosen === correct;
  if (isCorrect) score++;
  clickedBtn.classList.remove('reveal-correct');
  clickedBtn.classList.add(isCorrect ? 'correct' : 'wrong');

  // User answer bubble
  const userMsg = document.createElement('div');
  userMsg.className = 'msg user';
  const labels = ['A','B','C','D'];
  userMsg.innerHTML = `
    <div class="msg-avatar">🙋</div>
    <div class="msg-content">
      <div class="bubble">${labels[chosen]}：${q.choices[chosen]}</div>
      <div class="result-bubble ${isCorrect ? 'ok' : 'ng'}">${isCorrect ? '✅ 正解！' : '❌ 不正解'}</div>
    </div>`;
  chatArea.appendChild(userMsg);

  // Explanation
  const expEl = document.createElement('div');
  expEl.className = 'explanation';
  expEl.innerHTML = `<strong>💡 解説：</strong>${q.exp}`;
  chatArea.appendChild(expEl);

  // Next button
  current++;
  updateProgress();

  const nextBtn = document.createElement('button');
  nextBtn.className = 'next-btn';
  nextBtn.textContent = current < quizData.length ? `次の問題へ →` : `結果を見る 🎉`;
  nextBtn.addEventListener('click', () => {
    nextBtn.remove();
    if (current < quizData.length) addTypingThenQuestion();
    else showFinish();
  });
  chatArea.appendChild(nextBtn);
  scrollBottom();
}

function showFinish() {
  const pct = Math.round((score / quizData.length) * 100);
  let emoji = '😢';
  let msg = 'もう一度チャレンジしてみよう！';
  if (pct >= 90) { emoji = '🏆'; msg = '素晴らしい！天才的な知識力です！'; }
  else if (pct >= 70) { emoji = '🎉'; msg = 'よくできました！かなりの知識力です！'; }
  else if (pct >= 50) { emoji = '👏'; msg = '半分以上正解！もう一歩です！'; }
  else if (pct >= 30) { emoji = '📚'; msg = '復習して再挑戦しましょう！'; }

  const card = document.createElement('div');
  card.className = 'finish-card';
  card.innerHTML = `
    <div class="emoji">${emoji}</div>
    <h2>クイズ完了！</h2>
    <div class="final-score">${score} / ${quizData.length}</div>
    <p>正解率 ${pct}%<br>${msg}</p>
    <button class="restart-btn" onclick="location.reload()">もう一度挑戦する</button>`;
  chatArea.appendChild(card);
  scrollBottom();
}

// Start
const welcomeEl = document.createElement('div');
welcomeEl.className = 'msg bot';
welcomeEl.innerHTML = `
  <div class="msg-avatar">🧠</div>
  <div class="msg-content">
    <div class="bubble">
      こんにちは！<br>
      <strong>会社法クイズ 100問</strong>へようこそ⚖️<br><br>
      会社の種類・設立・株式・機関設計・組織再編・清算など<br>
      会社法の重要テーマ全100問を出題します。<br><br>
      選択肢をタップして答えてください！
    </div>
  </div>`;
chatArea.appendChild(welcomeEl);

const startBtn = document.createElement('button');
startBtn.className = 'next-btn';
startBtn.textContent = 'スタート！ 🚀';
startBtn.addEventListener('click', () => {
  startBtn.remove();
  updateProgress();
  addTypingThenQuestion();
});
chatArea.appendChild(startBtn);
updateProgress();
</script>
</body>
</html>
