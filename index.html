<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>会社法 400問 v4</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Hiragino Kaku Gothic Pro','メイリオ',sans-serif;background:#1a1035;color:#1e1b4b}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ── HEADER ── */
#hdr{background:linear-gradient(160deg,#7c3aed 0%,#5b21b6 100%);flex-shrink:0}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px}
.hdr-title{color:rgba(255,255,255,.9);font-size:13px;font-weight:700}
.hdr-stats{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:4px 12px;color:#fff;font-size:13px;font-weight:700;white-space:nowrap}
.hdr-cat{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.25);padding:7px 14px 8px}
.hdr-dot{width:10px;height:10px;border-radius:50%;background:#ef4444;flex-shrink:0}
.hdr-catname{flex:1;color:#fff;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-qnum{color:rgba(255,255,255,.65);font-size:12px;white-space:nowrap}

/* ── QUESTION AREA ── */
#qarea{flex:1;overflow-y:auto;background:#f3f0ff;padding:18px 16px 12px}
#qarea::-webkit-scrollbar{width:3px}
#qarea::-webkit-scrollbar-thumb{background:#c4b5fd;border-radius:2px}
.q-badge{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px}
.q-num{background:#7c3aed;color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:10px;letter-spacing:.5px}
.q-exam{background:#ddd6fe;color:#5b21b6;font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px}
.q-text{font-size:16px;font-weight:600;line-height:1.75;color:#1e1b4b;padding-bottom:2px}

/* result section */
.q-result{margin-top:18px;animation:popIn .25s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.result-card{border-radius:16px;padding:16px 18px;margin-bottom:14px;display:flex;align-items:center;gap:14px}
.result-card.seikai{background:linear-gradient(135deg,#15803d,#16a34a);box-shadow:0 6px 24px rgba(21,128,61,.4)}
.result-card.gokai{background:linear-gradient(135deg,#b91c1c,#dc2626);box-shadow:0 6px 24px rgba(185,28,28,.4)}
.result-icon{font-size:44px;line-height:1;flex-shrink:0}
.result-text-col{display:flex;flex-direction:column;gap:3px}
.result-word{font-size:26px;font-weight:900;color:#fff;letter-spacing:.5px}
.result-ans{font-size:14px;color:rgba(255,255,255,.85);font-weight:600}

.exp-label{font-size:11px;font-weight:800;color:#7c3aed;letter-spacing:.5px;margin-bottom:6px;text-transform:uppercase}
.q-exp{font-size:14px;line-height:1.8;color:#374151;background:#fff;border-radius:12px;padding:12px 14px;border-left:4px solid #7c3aed}

/* ── ANSWER + NAV BUTTONS ── */
#ctrl{background:#1e1035;padding:10px 8px 10px;display:flex;align-items:center;gap:6px;flex-shrink:0}

.nav-btn{color:#a78bfa;font-size:13px;font-weight:700;padding:0 10px;height:72px;background:rgba(167,139,250,.12);border:1.5px solid rgba(167,139,250,.3);border-radius:12px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;min-width:52px;transition:opacity .15s}
.nav-btn:disabled{opacity:.25;cursor:default}

.ans-btn{flex:1;height:80px;border-radius:16px;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.ans-btn:active{transform:scale(.96)}

/* ○ button */
.maru-btn{background:#fdf3e0;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.circle-g{width:46px;height:46px;border-radius:50%;border:6px solid #e53935;background:transparent;transition:border-color .2s,box-shadow .2s}

/* × button */
.batu-btn{background:#ebebeb;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.cross-g{width:44px;height:44px;position:relative;display:flex;align-items:center;justify-content:center}
.cross-g::before,.cross-g::after{content:'';position:absolute;width:40px;height:8px;background:#999;border-radius:4px;transition:background .2s}
.cross-g::before{transform:rotate(45deg)}
.cross-g::after{transform:rotate(-45deg)}

.verdict{font-size:12px;font-weight:800;color:#888;min-height:16px;transition:color .2s}

/* Correct answer highlight */
.maru-btn.correct{background:#fff0f0;box-shadow:0 0 0 4px #e53935,0 6px 20px rgba(229,57,53,.35)}
.maru-btn.correct .circle-g{border-color:#e53935;border-width:7px}
.maru-btn.correct .verdict{color:#c62828;font-size:14px}
.batu-btn.correct{background:#f0f0f0;box-shadow:0 0 0 4px #333,0 6px 20px rgba(0,0,0,.3)}
.batu-btn.correct .cross-g::before,.batu-btn.correct .cross-g::after{background:#222;height:9px}
.batu-btn.correct .verdict{color:#111;font-size:14px}

/* Wrong choice — red tint + shake */
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.maru-btn.user-wrong{background:#ffd7d7;animation:shake .35s ease;box-shadow:0 0 0 3px #ef4444}
.maru-btn.user-wrong .circle-g{border-color:#ef4444;opacity:.6}
.maru-btn.user-wrong .verdict{color:#dc2626;font-size:13px}
.batu-btn.user-wrong{background:#ffd7d7;animation:shake .35s ease;box-shadow:0 0 0 3px #ef4444}
.batu-btn.user-wrong .cross-g::before,.batu-btn.user-wrong .cross-g::after{background:#ef4444;opacity:.6}
.batu-btn.user-wrong .verdict{color:#dc2626;font-size:13px}

/* Dimmed state */
.ans-btn.dimmed{opacity:.25;filter:grayscale(.5)}
.ans-btn:disabled{cursor:default}

/* ── FOOTER ── */
#ftr{background:#150d2a;padding:6px 16px 8px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;border-top:1px solid rgba(255,255,255,.08)}
.ftr-info{color:rgba(167,139,250,.5);font-size:11px}
.ftr-score{color:rgba(167,139,250,.7);font-size:12px;font-weight:700}

/* Progress bar */
.prog-wrap{background:rgba(255,255,255,.08);height:3px;border-radius:2px;margin:0 16px 6px}
.prog-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#818cf8);border-radius:2px;transition:width .4s ease}

/* Finish card */
.fin-card{background:#fff;border-radius:20px;padding:32px 24px;text-align:center;margin:20px auto;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,.15);animation:fadeIn .5s ease}
.fin-card .emoji{font-size:52px;margin-bottom:10px}
.fin-card h2{font-size:20px;color:#1e1b4b;margin-bottom:6px}
.fin-card .fscore{font-size:48px;font-weight:900;background:linear-gradient(135deg,#7c3aed,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:10px 0}
.fin-card p{color:#6b7280;font-size:14px;margin-bottom:20px}
.fin-card .rbtn{background:linear-gradient(135deg,#7c3aed,#5b21b6);border:none;border-radius:12px;padding:12px 28px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit}

/* ── MENU SCREEN ── */
#menu{flex:1;overflow-y:auto;background:#1a1035;padding:28px 16px;display:flex;flex-direction:column;gap:18px}
.menu-title{color:rgba(255,255,255,.85);font-size:15px;font-weight:700;text-align:center;letter-spacing:.5px}
.subj-card{background:linear-gradient(135deg,rgba(124,58,237,.25),rgba(91,33,182,.25));border:1.5px solid rgba(124,58,237,.45);border-radius:20px;padding:20px 18px;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:8px}
.subj-card:active{transform:scale(.97);box-shadow:0 4px 20px rgba(124,58,237,.4)}
.subj-name{color:#fff;font-size:17px;font-weight:800}
.subj-count{color:rgba(255,255,255,.55);font-size:13px}
.subj-progress{color:#a78bfa;font-size:13px;font-weight:600;margin-top:2px}
.subj-prog-bar{background:rgba(255,255,255,.1);height:5px;border-radius:3px;margin-top:2px}
.subj-prog-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#818cf8);border-radius:3px;transition:width .4s ease}
.review-card{background:rgba(239,68,68,.12);border:1.5px solid rgba(239,68,68,.4);border-radius:14px;padding:13px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:#fca5a5;font-weight:700;font-size:14px;transition:transform .15s;margin-top:-6px}
.review-card:active{transform:scale(.97)}

/* ── AUTH ── */
.auth-btn{width:100%;background:#fff;border:none;border-radius:14px;padding:14px 18px;color:#3c4043;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 16px rgba(0,0,0,.3)}
.auth-btn:active{transform:scale(.97)}
.user-row{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.user-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,.2)}
.user-name{color:rgba(255,255,255,.9);font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-st{color:#a78bfa;font-size:11px}
.signout-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:8px;color:rgba(255,255,255,.6);font-size:11px;padding:4px 8px;cursor:pointer;font-family:inherit;flex-shrink:0}
</style>
</head>
<body>
<div id="app">

<div id="hdr">
  <div class="hdr-top">
    <div class="hdr-title">会社法 ○×クイズ</div>
    <div id="hdrControls" style="display:none;align-items:center;gap:6px">
      <div class="hdr-stats" id="statsText">正解率 -%</div>
      <button onclick="showMenu()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:8px;color:rgba(255,255,255,.8);font-size:11px;padding:4px 8px;cursor:pointer;font-family:inherit">メニュー</button>
      <button onclick="if(confirm('この科目をリセットしますか？'))resetQuiz()" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:8px;color:rgba(255,255,255,.8);font-size:11px;padding:4px 8px;cursor:pointer;font-family:inherit">リセット</button>
    </div>
  </div>
  <div class="hdr-cat" id="hdrCat" style="display:none">
    <div class="hdr-dot"></div>
    <div class="hdr-catname" id="catName">-</div>
    <div class="hdr-qnum" id="qNumHdr">-</div>
  </div>
  <div class="prog-wrap" id="progWrap" style="display:none"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
</div>

<div id="menu">
  <button id="loginBtn" class="auth-btn" onclick="signIn()">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Google でログインして同期
  </button>
  <div id="userRow" class="user-row" style="display:none">
    <img id="userAvatar" class="user-avatar" src="" alt="">
    <div style="flex:1;min-width:0">
      <div class="user-name" id="userName"></div>
      <div class="sync-st" id="syncStatus">未同期</div>
    </div>
    <button class="signout-btn" onclick="signOut()">ログアウト</button>
  </div>
  <div class="menu-title">科目を選択してください</div>
  <div class="subj-card" onclick="startSubject(1,'normal')">
    <div class="subj-name">会社法総合Ⅰ</div>
    <div class="subj-count">全100問</div>
    <div class="subj-progress" id="subjProg1">未開始</div>
    <div class="subj-prog-bar"><div class="subj-prog-fill" id="subjProgFill1" style="width:0%"></div></div>
  </div>
  <div class="review-card" id="reviewCard1" onclick="startSubject(1,'review')" style="display:none">
    <span>📝 間違い直し</span>
    <span id="reviewCount1" style="opacity:.8;font-size:13px">0問</span>
  </div>
  <div class="subj-card" onclick="startSubject(2,'normal')">
    <div class="subj-name">会社法総合Ⅱ</div>
    <div class="subj-count">全300問</div>
    <div class="subj-progress" id="subjProg2">未開始</div>
    <div class="subj-prog-bar"><div class="subj-prog-fill" id="subjProgFill2" style="width:0%"></div></div>
  </div>
  <div class="review-card" id="reviewCard2" onclick="startSubject(2,'review')" style="display:none">
    <span>📝 間違い直し</span>
    <span id="reviewCount2" style="opacity:.8;font-size:13px">0問</span>
  </div>
</div>

<div id="qarea" style="display:none">
  <div class="q-badge">
    <span class="q-num" id="qNumBadge">Q 1</span>
  </div>
  <div class="q-text" id="qText"></div>
  <div class="q-result" id="qResult" style="display:none">
    <div class="result-card" id="resultCard">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-text-col">
        <div class="result-word" id="resultWord"></div>
        <div class="result-ans" id="resultAns"></div>
      </div>
    </div>
    <div class="exp-label">解　説</div>
    <div class="q-exp" id="qExp"></div>
  </div>
</div>

<div id="ctrl" style="display:none">
  <button class="nav-btn" id="prevBtn" onclick="prevQ()" disabled>◁<br>前へ</button>
  <button class="ans-btn maru-btn" id="maruBtn" onclick="doAnswer(true)">
    <div class="circle-g" id="circleG"></div>
    <div class="verdict" id="maruVerdict"></div>
  </button>
  <button class="ans-btn batu-btn" id="batuBtn" onclick="doAnswer(false)">
    <div class="cross-g"></div>
    <div class="verdict" id="batuVerdict"></div>
  </button>
  <button class="nav-btn" id="nextBtn" onclick="nextQ()" disabled>次へ<br>▷</button>
</div>

<div id="ftr" style="display:none">
  <div class="ftr-info" id="ftrInfo">0 / 0 回答済み</div>
  <div class="ftr-score" id="ftrScore">0 正解</div>
</div>

</div>

<script>
const ALL = [
{cat:"発起設立",q:"発起設立において、発起人は、公証人の認証を受けた定款で定められて選任されたものとみなされた設立時取締役を会社の成立の時よりも前に解任することができない。",ans:false,exp:"発起人は会社成立前であっても、発起人全員の議決権の過半数の決議によって設立時取締役を解任できる（会社法43条1項）。「解任できない」は誤り。"},
{cat:"発起設立",q:"募集設立において、会社法上の公開会社の設立時取締役の選任は、創立総会の決議によって行わなければならない。",ans:true,exp:"募集設立では、設立時取締役の選任は創立総会の決議によって行う（会社法88条）。"},
{cat:"発起設立",q:"設立時募集株式の引受人は、出資の履行期日又は期間内に出資に係る金銭の払込み又は金銭以外の財産の給付をしなければ、株主となることができない。",ans:true,exp:"設立時募集株式の引受人は、払込期日または払込期間内に払込み・現物給付をしなければ株主となる権利を失う（会社法63条3項・76条4項）。"},
{cat:"発起設立",q:"募集設立において、会社の成立の時における検査役の調査を経ていない財産引受けの目的財産の価額が定款に記載され、又は記録された価額に著しく不足するときは、発起人は、その職務を行うについて注意を怠らなかったことを証明した場合でも、当該不足額を支払う義務を免れることができない。",ans:true,exp:"財産引受けについて検査役の調査を経ていない場合、価額の著しい不足があれば発起人は不足額を連帯して支払う義務を負う（会社法52条2項）。無過失責任であり注意を怠らなかったことを証明しても免れない。"},
{cat:"競業取引・利益相反取引",q:"指名委員会等設置会社でない会社の設立手続に重大な瑕疵があるときは、株主、取締役、会社債権者、監査役又は清算人は、会社の成立の日から１年以内に、設立の無効の訴えを提起することができる。",ans:false,exp:"設立無効の訴えの原告適格に会社債権者は含まれない（会社法828条2項1号）。 第2問：競業取引・利益相反取引"},
{cat:"競業取引・利益相反取引",q:"判例によれば、株式会社の事業の部類に属する取引に当たるか否かを判断する場合には、株式会社が現に行っている事業との市場での競合性を基準として判断し、仕入先の競合を考慮する必要はない。",ans:true,exp:"判例は「事業の部類に属する取引」を市場における競合性で判断しており、仕入先の競合を考慮する必要はないとしている。"},
{cat:"競業取引・利益相反取引",q:"取締役会設置会社の取締役が会社の事業と同じ種類の事業を行っている他の株式会社の業務執行者に就任するためには、当該取締役会設置会社の取締役会の承認を受けなければならない。",ans:true,exp:"競業会社の業務執行者への就任は競業取引規制の対象となり、取締役会設置会社では取締役会の承認が必要（会社法356条1項1号・365条1項）。"},
{cat:"競業取引・利益相反取引",q:"取締役会設置会社の取締役が取締役会の承認を受けて会社の事業の部類に属する取引をしたときは、その取引によって当該会社に損害が生じても、当該取締役は、会社に対する損害賠償責任を負わない。",ans:false,exp:"取締役会の承認を受けていても、任務懈怠があれば損害賠償責任を負う（会社法423条1項）。承認は責任を免除するものではない。"},
{cat:"競業取引・利益相反取引",q:"取締役が自己のために取締役会設置会社でない会社と取引をしようとするときに承認を受けなければならない株主総会の決議は、特別決議ではなく、普通決議である。",ans:true,exp:"利益相反取引の承認は、取締役会非設置会社では株主総会の普通決議で足りる（会社法356条1項・309条1項）。"},
{cat:"特別取締役",q:"判例によれば、取締役会設置会社において、取締役と会社との間の取引が株主全員の合意によってされた場合には、利益相反取引としての取締役会の承認を受けることを要しない。",ans:true,exp:"判例（最判昭和49年9月26日）は、株主全員の合意がある場合には取締役会の承認を不要とする。 第3問：特別取締役"},
{cat:"特別取締役",q:"指名委員会等設置会社においては、特別取締役の制度は認められておらず、取締役会は、その決議によって、重要な財産の処分の決定を執行役に委任することができる。",ans:true,exp:"指名委員会等設置会社では特別取締役の制度は適用されず（会社法373条1項）、取締役会は重要な財産の処分等を執行役に委任できる（会社法416条4項）。"},
{cat:"特別取締役",q:"特別取締役による議決の定めは、取締役会で定めれば足り、定款で定めることを要しない。",ans:true,exp:"特別取締役による議決の定めは取締役会の決議によれば足り、定款への記載は不要（会社法373条1項）。"},
{cat:"特別取締役",q:"特別取締役以外の取締役は、特別取締役による取締役会を招集することができる。",ans:false,exp:"特別取締役による取締役会は特別取締役のみが招集権を持つ（会社法373条2項）。"},
{cat:"特別取締役",q:"特別取締役の互選によって定められた者は、特別取締役による取締役会の決議があったときは、遅滞なく、当該決議の内容を特別取締役以外の取締役に報告しなければならない。",ans:true,exp:"特別取締役の互選で定められた者は、決議後遅滞なくその内容を特別取締役以外の取締役に報告する義務がある（会社法373条3項）。"},
{cat:"監査役",q:"特別取締役による議決の定めがある場合は、監査役は、特別取締役による取締役会に出席することを要しない。",ans:false,exp:"監査役は特別取締役による取締役会にも出席する義務がある（会社法383条1項）。 第4問：監査役"},
{cat:"監査役",q:"会社法上の公開会社でない大会社は、監査役会を置くことを要しないが、定款の定めによって、監査役会を置くことができる。",ans:true,exp:"公開会社でない大会社は監査役会の設置義務はないが、定款で任意に設置することは可能。"},
{cat:"監査役",q:"指名委員会等設置会社又は監査等委員会設置会社でない会計監査人設置会社は、監査役を置くことを要しないが、定款の定めによって、監査役を置くことができる。",ans:false,exp:"指名委員会等設置会社・監査等委員会設置会社でない会計監査人設置会社は、監査役を必ず置かなければならない（会社法327条3項）。"},
{cat:"監査役",q:"監査役会においては、招集通知の発出を要せず、書面決議は認められていない。",ans:false,exp:"監査役会にも招集通知の発出は必要（会社法392条1項）。監査役全員の同意があれば省略できるが、書面決議は認められていない。"},
{cat:"監査役",q:"取締役が監査役の全員に対して監査役会に報告すべき事項を通知したときは、当該事項を監査役会に報告することを要しない。",ans:true,exp:"取締役が監査役全員に対して通知したときは、監査役会への報告を省略することができる（会社法395条）。"},
{cat:"会計監査人",q:"監査役が２人以上ある場合には、監査役は、いつでも、監査役の全員の同意により、会計監査人を解任することができる。",ans:false,exp:"会計監査人を監査役（会）が解任できるのは一定の事由がある場合に限られる（会社法340条1項・2項）。「いつでも」ではない。 第5問：会計監査人"},
{cat:"会計監査人",q:"取締役は、監査役会設置会社において会計監査人の報酬を定める場合には、監査役会の同意を得なければならない。",ans:true,exp:"会計監査人の報酬等を定める場合、取締役は監査役会の同意を得なければならない（会社法399条1項・2項）。"},
{cat:"会計監査人",q:"監査役会設置会社において一時会計監査人の職務を行うべき者を監査役会が選任したときは、その報酬も、監査役会が定める。",ans:true,exp:"一時会計監査人は監査役会が選任し（会社法346条4項）、その報酬も監査役会が定める（会社法399条3項）。"},
{cat:"会計監査人",q:"定時株主総会において会計監査人の出席を求める決議があったときは、会計監査人は、定時株主総会に出席して意見を述べなければならない。",ans:true,exp:"定時株主総会で出席を求める決議がされた場合、会計監査人は出席して意見を述べなければならない（会社法398条2項）。"},
{cat:"会計監査人",q:"監査役設置会社が会計監査人に対して責任を追及する訴えを提起する場合には、当該訴えについては、監査役が監査役設置会社を代表する。",ans:true,exp:"会計監査人に対する責任追及訴訟では、監査役が会社を代表する（会社法386条2項2号）。"},
{cat:"会社関係訴訟",q:"会計監査人は、いつでも、辞任することができる。",ans:true,exp:"会計監査人は委任契約に基づく機関であり、いつでも辞任することができる（民法651条）。 第6問：会社関係訴訟"},
{cat:"会社関係訴訟",q:"判例によれば、取締役会設置会社においては、株主総会の招集通知に記載のない事項を当該株主総会で決議したときは、当該決議は無効となる。",ans:false,exp:"招集通知に記載のない事項を決議した場合は決議取消事由（会社法831条1項1号）にとどまり、決議無効ではない。"},
{cat:"会社関係訴訟",q:"株主総会の決議の方法が定款に違反する場合は、当該決議の取消しの原因となるにとどまるが、株主総会の決議の方法が法令に違反する場合は、当該決議の無効の原因となる。",ans:false,exp:"決議の方法が法令に違反する場合も取消事由にとどまる（会社法831条1項1号）。無効原因となるのは決議の内容が法令に違反する場合（会社法830条2項）。"},
{cat:"会社関係訴訟",q:"取締役の全員について、任期が満了して株主総会で再任されなかった場合、当該株主総会の取締役の選任に関する決議に取消しの事由があっても、その再任されなかった者は、当該決議の取消しの訴えを提起することはできない。",ans:false,exp:"決議取消しの訴えの原告適格は株主・取締役・監査役・清算人に認められる（会社法831条1項）。株主であれば提起できる。"},
{cat:"会社関係訴訟",q:"株式会社の役員の解任の訴えは、当該株式会社のみが被告となり、解任の対象となる役員は被告とならない。",ans:true,exp:"役員解任の訴え（会社法854条）では株式会社のみが被告となる。"},
{cat:"募集設立",q:"取締役を解任する旨の議案が株主総会において否決された場合の当該取締役の解任の訴えは、当該株主総会の日から３０日以内に限り、提起することができる。",ans:true,exp:"役員解任の訴えは、解任を否決した株主総会の日から30日以内に提起しなければならない（会社法854条1項）。 第7問：募集設立"},
{cat:"募集設立",q:"定款は、公証人の認証を受けた後であっても、創立総会の決議によって変更することができる。",ans:true,exp:"募集設立においては、公証人の認証後であっても創立総会の決議によって定款を変更することができる（会社法96条）。"},
{cat:"募集設立",q:"発起人によって払込みの取扱いの場所として定められた銀行は、払い込まれた金額に相当する金銭の保管に関する証明書を発起人に交付した場合、当該証明書の記載が事実と異なることをもって成立後の株式会社に対抗することができない。",ans:true,exp:"払込取扱銀行は保管証明書を交付した場合、証明書の記載が事実と異なることを成立後の会社に対抗できない（会社法64条2項）。"},
{cat:"募集設立",q:"設立時取締役を選任する創立総会の決議は、当該創立総会において議決権を行使することができる設立時株主の議決権の過半数であって、出席した当該設立時株主の議決権の過半数をもって行う。",ans:false,exp:"設立時取締役の選任決議は、議決権を行使できる設立時株主の過半数を有する株主が出席し、出席した株主の議決権の過半数で行う（会社法73条1項）。問題文の定足数の記述が不正確。"},
{cat:"募集設立",q:"指名委員会等設置会社を設立する場合には、創立総会の決議によって設立時執行役を選任しなければならない。",ans:true,exp:"指名委員会等設置会社を設立する場合、創立総会において設立時執行役を選任しなければならない（会社法48条1項3号・88条）。"},
{cat:"募集設立",q:"発起人以外の者であっても、募集の広告に自己の氏名及び株式会社の設立を賛助する旨を記載することを承諾したものは、発起人とみなされ、発起人の責任に関する会社法の規定の適用を受ける。",ans:true,exp:"擬似発起人の規定（会社法103条3項）。募集の広告に氏名・設立賛助の旨の記載を承諾した者は発起人とみなされる。"},
{cat:"募集設立",q:"指名委員会等設置会社は、大会社であることを要しないが、会社法上の公開会社でなければならない。",ans:false,exp:"指名委員会等設置会社は大会社である必要も公開会社である必要もない（会社法2条12号）。"},
{cat:"募集設立",q:"監査役会設置会社は、取締役会を置かなければならない。",ans:true,exp:"監査役会設置会社は取締役会を置かなければならない（会社法327条1項2号）。"},
{cat:"募集設立",q:"会計監査人設置会社は、当該会計監査人設置会社が指名委員会等設置会社及び監査等委員会設置会社である場合を除き、監査役会を置かなければならない。",ans:false,exp:"会計監査人設置会社は監査役を置かなければならないが（会社法327条3項）、監査役会の設置が義務付けられるわけではない。"},
{cat:"募集設立",q:"会社法上の公開会社である大会社は、取締役会を置かなければならず、かつ、当該大会社が指名委員会等設置会社及び監査等委員会設置会社である場合を除き、監査役会も置かなければならない。",ans:true,exp:"公開会社である大会社は取締役会（会社法327条1項1号）および監査役会（会社法328条1項）の設置が義務付けられる。ただし指名委員会等・監査等委員会設置会社は除外。"},
{cat:"取締役への金銭貸付",q:"会社法上の公開会社でない大会社は、会計監査人を置かなければならない。",ans:true,exp:"大会社は公開会社かどうかにかかわらず会計監査人を置かなければならない（会社法328条2項）。 第9問：取締役への金銭貸付"},
{cat:"取締役への金銭貸付",q:"判例によれば、株式会社の取締役が当該株式会社の全株式を所有し、当該株式会社の営業が実質上当該取締役の個人経営のものにすぎないときであっても、当該株式会社が当該取締役に対して金銭の貸付けをするためには、当該貸付けに関する取締役会の承認が必要である。",ans:true,exp:"判例（最判昭和45年8月20日）は、一人会社であっても利益相反取引規制の適用を認め、取締役会の承認が必要とする。"},
{cat:"取締役への金銭貸付",q:"金銭の貸付けが取締役会の承認を受けずにされた場合には、株式会社は、金銭の貸付けを受けた取締役に対して、当該貸付けに係る契約の無効を主張することができる。",ans:true,exp:"取締役会の承認を欠く利益相反取引は相対的無効とされ（判例）、会社は取引の無効を主張することができる。"},
{cat:"取締役への金銭貸付",q:"金銭の貸付けを受けた取締役が弁済期限までに弁済せず、株式会社に損害が生じた場合において、当該貸付けを決定した代表取締役は、職務を行うにつき責めに帰することができない事由によるものであることを証明しても、当該株式会社に対して損害を賠償する責任を免れることができない。",ans:false,exp:"貸付けを決定した代表取締役は直接取引をした取締役ではないため、無過失を証明すれば責任を免れ得る。会社法428条1項の無過失責任は自己のために直接取引した取締役に適用される。"},
{cat:"取締役への金銭貸付",q:"金銭の貸付けを受けた取締役が弁済期限までに弁済せず、株式会社に損害が生じた場合において、当該貸付けに関する取締役会の承認の決議に賛成した他の取締役は、その任務を怠ったものと推定される。",ans:true,exp:"取締役会の決議に賛成した取締役は、利益相反取引により会社に損害が生じた場合に任務懈怠が推定される（会社法423条3項）。"},
{cat:"監査役と監査委員の異同",q:"金銭の貸付けを受けた取締役が弁済期限までに弁済せず、株式会社に損害が生じた場合において、当該貸付けに関する取締役会の承認の決議に賛成した他の取締役が当該株式会社に対して損害を賠償する責任は、当該取締役が職務を行うにつき善意で、かつ、重大な過失がないときは、株主総会の特別決議によって一定の限度で免除することができる。",ans:false,exp:"会社法428条2項により、自己のためにした直接取引によって生じた責任については総株主の同意がなければ免除できない。株主総会の特別決議による一部免除は認められない。 第10問：監査役と監査委員の異同"},
{cat:"監査役と監査委員の異同",q:"監査役及び監査委員は、いずれも、自己のために株式会社の事業の部類に属する取引をしようとするときは、当該取引につき取締役会の承認を受けることを要しない。",ans:true,exp:"競業取引規制（会社法356条）は取締役に適用される規定であり、監査役・監査委員には適用されない。"},
{cat:"監査役と監査委員の異同",q:"監査役が取締役に対して法令に違反する行為をやめることを請求するためには、監査役会の承認を受けることを要しないが、監査委員が執行役に対して法令に違反する行為をやめることを請求するためには、監査委員会の承認を受けなければならない。",ans:false,exp:"監査委員が差止請求をする場合も監査委員会の承認は不要（会社法407条）。両者とも単独で差止請求できる。"},
{cat:"監査役と監査委員の異同",q:"監査役はその職務を行うため必要があるときは、また、監査委員会が選定する監査委員は監査委員会の職務を執行するため必要があるときは、いずれも、子会社に対して事業の報告を求めることができる。",ans:true,exp:"監査役は必要があるときに子会社への報告徴求権を持ち（会社法381条3項）、監査委員会が選定する監査委員も同様（会社法405条2項）。"},
{cat:"監査役と監査委員の異同",q:"監査役を辞任した者及び監査委員を辞任した者は、いずれも、辞任後最初に招集される株主総会に出席して、辞任した旨及びその理由を述べることができる。",ans:true,exp:"監査役を辞任した者は辞任後最初の株主総会で辞任理由を述べることができる（会社法345条2項・4項）。監査委員を辞任した者も同様（会社法345条4項）。"},
{cat:"社外取締役・社外監査役・会計監査人の異同",q:"監査役会設置会社が監査役に対して訴えを提起する場合には、代表取締役が当該監査役会設置会社を代表し、指名委員会等設置会社が監査委員に対して訴えを提起する場合には、株主総会で当該訴えについて当該指名委員会等設置会社を代表する者を定めたときはその者が、当該定めがないときは取締役会の定める者が、当該指名委員会等設置会社を代表する。",ans:false,exp:"監査役会設置会社が監査役に対して訴えを提起する場合、代表取締役ではなく取締役会が定めた者が会社を代表する（会社法386条2項1号）。 第11問：社外取締役・社外監査役・会計監査人の異同"},
{cat:"社外取締役・社外監査役・会計監査人の異同",q:"社外取締役、社外監査役及び会計監査人は、いずれも、常勤であることを要しない。",ans:true,exp:"社外取締役・社外監査役・会計監査人はいずれも常勤要件はない。"},
{cat:"社外取締役・社外監査役・会計監査人の異同",q:"社外取締役、社外監査役及び会計監査人は、いずれも、会社の子会社の会計参与（公認会計士に限る。）を兼ねることができる。",ans:false,exp:"会計監査人はその会社または子会社の会計参与を兼ねることができない（会社法337条3項2号）。「いずれも」兼ねることができるという記述が誤り。"},
{cat:"社外取締役・社外監査役・会計監査人の異同",q:"社外取締役、社外監査役及び会計監査人（監査法人を除く。）は、いずれも、会社の親会社である指名委員会等設置会社の監査委員を兼ねることができる。",ans:false,exp:"社外取締役が親会社の監査委員（取締役）を兼ねると社外性を失う可能性がある。「いずれも」兼ねることができるとは言えない。"},
{cat:"社外取締役・社外監査役・会計監査人の異同",q:"社外取締役、社外監査役及び会計監査人は、いずれも、取締役会に出席し、必要があると認めるときは、意見を述べなければならない。",ans:false,exp:"取締役会への出席義務・意見陳述義務があるのは監査役（会社法383条1項）。会計監査人には取締役会への出席義務はない。"},
{cat:"株主代表訴訟",q:"社外取締役、社外監査役及び会計監査人は、いずれも、その会社に対する損害賠償責任について、定款の定めに基づく責任限定契約を会社と締結することができる。",ans:true,exp:"社外取締役・社外監査役・会計監査人はいずれも責任限定契約を締結することができる（会社法427条1項）。 第12問：株主代表訴訟"},
{cat:"株主代表訴訟",q:"株主代表訴訟は、株式会社の本店の所在地を管轄する地方裁判所のほか、会社法上の公開会社にあっては、当該株主代表訴訟を提起する株主の普通裁判籍の所在地を管轄する地方裁判所にも提起することができる。",ans:false,exp:"株主代表訴訟の管轄は会社の本店所在地を管轄する地方裁判所（会社法848条）。株主の普通裁判籍を管轄する裁判所への提起規定はない。"},
{cat:"株主代表訴訟",q:"株主は、株式会社に著しい損害が生ずるおそれがある場合には、株式会社に対する提訴請求をすることなく、直ちに株主代表訴訟を提起することができる。",ans:true,exp:"会社に著しい損害が生ずるおそれがある場合には提訴請求なしに直ちに訴えを提起できる（会社法847条5項）。"},
{cat:"株主代表訴訟",q:"株式会社が取締役を補助するために株主代表訴訟に参加することは、できない。",ans:true,exp:"会社は取締役側を補助するために株主代表訴訟に参加することはできない（会社法849条3項）。"},
{cat:"株主代表訴訟",q:"株主代表訴訟を提起した株主が敗訴した場合であっても、悪意があったときを除き、当該株主は、株式会社に対し、これによって生じた損害を賠償する義務を負わない。",ans:true,exp:"株主代表訴訟で敗訴した株主は、悪意があった場合に限り会社に対して損害賠償責任を負う（会社法852条2項）。"},
{cat:"発起設立",q:"判例によれば、取締役が株式会社との取引によって負担することになった債務についての責任は、株主代表訴訟により追及することができる。",ans:false,exp:"判例（最判平成21年3月10日）によれば、取締役が会社との取引によって負担した債務（契約上の債務）は株主代表訴訟で追及できる「役員等の責任」に当たらない。 第13問：発起設立"},
{cat:"発起設立",q:"株式会社が発起人となってその事業の全部を現物出資する場合には、現物出資をする会社において株主総会の特別決議を経なければならない。",ans:false,exp:"会社が発起人として現物出資をする場合に株主総会の特別決議を要するという会社法上の規定はない。"},
{cat:"発起設立",q:"発起人が２名以上ある場合、そのうちの発起人１名が設立時発行株式の全てを引き受け、他の発起人は、設立時発行株式を引き受けないことができる。",ans:false,exp:"発起人は必ず設立時発行株式を1株以上引き受けなければならない（会社法25条2項）。"},
{cat:"発起設立",q:"設立時取締役は、発起人であることを要しない。",ans:true,exp:"設立時取締役は発起人である必要はなく、発起人以外の者を選任することができる（会社法38条1項）。"},
{cat:"発起設立",q:"定款で設立時取締役として定められた者は、その定款について公証人の認証を受けた時に、設立時取締役に選任されたものとみなされる。",ans:true,exp:"発起設立において定款で設立時取締役を定めた場合、公証人の認証を受けた時点で選任されたものとみなされる（会社法38条3項）。"},
{cat:"株主総会",q:"設立時取締役は、その選任後遅滞なく、設立の手続が法令又は定款に違反していないことを調査しなければならない。",ans:true,exp:"設立時取締役は選任後遅滞なく、設立手続が法令・定款に違反していないかを調査する義務がある（会社法46条1項）。 第14問：株主総会"},
{cat:"株主総会",q:"会社法上の公開会社においては、株主総会の招集通知は、株主総会の日の２週間前までに株主に対して発しなければならず、定款でこれより短い期間を定めることはできない。",ans:true,exp:"公開会社では株主総会の招集通知は2週間前までに発しなければならず（会社法299条1項）、定款でこれを短縮することはできない。"},
{cat:"株主総会",q:"大会社においては、株主の数が１０００人未満でも、株主総会を招集する場合には、株主総会に出席しない株主が書面によって議決権を行使することができる旨を定めなければならない。",ans:false,exp:"書面投票制度の導入義務は株主数が1000人以上の会社に課される（会社法298条2項）。大会社であっても1000人未満であれば義務なし。"},
{cat:"株主総会",q:"判例によれば、株式会社が定款をもって株主総会における議決権行使の代理人の資格を会社の株主に限る旨を定めた場合において、株主である法人がその代表者の指揮下にある職員を代理人として株主総会で議決権を行使することは、定款に反し許されない。",ans:false,exp:"判例（最判昭和51年12月24日）によれば、株主である法人がその使用人を代理人として議決権行使させることは許容される。"},
{cat:"株主総会",q:"取締役会設置会社においては、取締役の解任が株主総会の目的である事項となっていない場合でも、株主は、その株主総会において、取締役の解任の議案を提出することができる。",ans:false,exp:"取締役会設置会社では株主総会の権限が法定事項に限定されており、議題にない事項について株主が議案を提出することはできない。"},
{cat:"株主の権利",q:"取締役は、株主総会において、株主から特定の事項について説明を求められた場合でも、その事項が株主総会の目的である事項に関しないものであるときは、その説明をすることを要しない。",ans:true,exp:"取締役の説明義務（会社法314条）は株主総会の目的事項に関する質問に対するもの。目的事項に関しない質問には説明義務なし。 第15問：株主の権利"},
{cat:"株主の権利",q:"株主が監査役会議事録の閲覧を請求するためには、裁判所の許可を得なければならない。",ans:true,exp:"監査役会議事録の閲覧・謄写請求には裁判所の許可が必要（会社法394条2項）。"},
{cat:"株主の権利",q:"会社法所定の要件を満たす株主は、代表取締役が法令に違反する行為をするおそれがある場合において、その行為によって会社に回復することができない損害が生ずるおそれがあるときは、その行為をやめることを請求することができる。",ans:true,exp:"会社法360条1項により、6ヶ月前から引き続き株式を有する株主は、取締役が法令・定款違反行為をするおそれがあり回復不能な損害が生ずるおそれがあるときに差止請求ができる。"},
{cat:"株主の権利",q:"取締役の職務の執行に関し不正の行為があった場合には、会社法所定の要件を満たす株主は、その取締役を解任する旨の議案が株主総会において否決されたかどうかを問わず、その取締役の解任の訴えを提起することができる。",ans:false,exp:"役員解任の訴え（会社法854条）は、解任議案が株主総会で否決された場合にのみ提起できる。"},
{cat:"株主の権利",q:"株主総会においてある議案について賛成の議決権を行使した株主は、その議案に係る決議の方法が定款に違反する場合でも、決議取消しの訴えを提起することができない。",ans:false,exp:"決議取消しの訴えの原告適格は株主等に広く認められており（会社法831条1項）、賛成票を投じた株主であっても訴えを提起することは妨げられない。"},
{cat:"取締役の責任の免除",q:"株主は、他の株主が提起した株主代表訴訟には、共同訴訟人として参加することができない。",ans:false,exp:"他の株主が提起した株主代表訴訟には共同訴訟参加として参加することが認められる（会社法849条1項）。 第16問：取締役の責任の免除"},
{cat:"取締役の責任の免除",q:"責任の一部の免除に関する議案を取締役が株主総会に提出するためには、監査役の過半数をもって行う決議による監査役会の同意を得なければならない。",ans:true,exp:"取締役が責任一部免除の議案を株主総会に提出するには監査役会の同意が必要であり、その決議は監査役の過半数でなされる（会社法425条3項・390条2項）。"},
{cat:"取締役の責任の免除",q:"取締役会の決議によって責任の一部の免除をするためには、取締役会の決議によって免除することができる旨を定款で定めなければならない。",ans:true,exp:"取締役会決議による責任の一部免除は、定款に取締役会決議で免除できる旨の定めがある場合に限り可能（会社法426条）。"},
{cat:"取締役の責任の免除",q:"責任の一部の免除をするためには、取締役が職務を行うにつき善意で、かつ、過失がないときであることが必要である。",ans:false,exp:"責任の一部免除の要件は、職務執行につき善意かつ重大な過失がないこと（会社法425条1項）。「過失がないこと」ではなく「重大な過失がないこと」が要件。"},
{cat:"取締役の責任の免除",q:"会社と取引をした取締役の責任の一部の免除をするためには、その取引が自己のためにした取引でないことが必要である。",ans:true,exp:"利益相反取引による責任について一部免除をするには、当該取引が自己のためにした直接取引でないことが必要（会社法428条・425条）。"},
{cat:"決議・報告の省略",q:"責任の全部の免除をするためには、総株主の同意がなければならない。",ans:true,exp:"取締役の任務懈怠責任の全部免除には総株主の同意が必要（会社法424条）。 第17問：決議・報告の省略"},
{cat:"決議・報告の省略",q:"株主総会への報告については、取締役が株主の全員に対して株主総会に報告すべき事項を通知した場合において、その事項を株主総会に報告することを要しないことにつき株主の全員が書面により同意の意思表示をしたときは、その事項の報告があったものとみなされる。",ans:true,exp:"株主総会への報告省略については、取締役が全株主に通知し、全株主が書面で同意したときに報告があったものとみなされる（会社法320条）。"},
{cat:"決議・報告の省略",q:"株主総会の決議については、取締役が株主総会の目的である事項について提案をした場合において、その提案につき株主（その事項について議決権を行使することができるものに限る。）の全員が書面により同意の意思表示をしたときは、その提案を可決する旨の決議があったものとみなされる。",ans:true,exp:"株主総会の書面決議（みなし決議）の規定（会社法319条1項）。議決権を行使できる株主全員が書面で同意した場合、決議があったものとみなされる。"},
{cat:"決議・報告の省略",q:"取締役会の決議については、取締役が取締役会の決議の目的である事項について提案をした場合において、その提案につき取締役（その事項について議決に加わることができるものに限る。）の全員が書面により同意の意思表示をしたときは、決議の省略に係る定款の定めがなくても、その提案を可決する旨の決議があったものとみなされる。",ans:false,exp:"取締役会の書面決議（決議の省略）は定款に定めがある場合に限り認められる（会社法370条）。株主総会と異なり、定款の根拠が必要。"},
{cat:"決議・報告の省略",q:"監査役会への報告については、監査役が監査役の全員に対して監査役会に報告すべき事項を通知したときは、その事項を報告することを要しない。",ans:true,exp:"監査役会への報告省略については、監査役が全監査役に通知したときに報告を要しない（会社法395条）。全員の同意は不要。"},
{cat:"監査役の独立性確保",q:"監査役会の決議については、監査役が監査役会の決議の目的である事項について提案をした場合において、その提案につき監査役の全員が書面により同意の意思表示をしたときは、決議の省略に係る定款の定めがなくても、その提案を可決する旨の決議があったものとみなされる。",ans:false,exp:"監査役会には書面決議（決議の省略）の制度がない（会社法393条参照）。 第18問：監査役の独立性確保"},
{cat:"監査役の独立性確保",q:"監査役会設置会社において、取締役が監査役の選任に関する議案を株主総会に提出するには、監査役会の同意を得なければならないとの規律は、監査役の独立性確保を目的とするものである。",ans:true,exp:"監査役の選任議案に監査役会の同意を要求することで、取締役が自らに都合のよい監査役を選任することを防ぐ（会社法343条1項）。"},
{cat:"監査役の独立性確保",q:"補欠の監査役を選任することができるとの規律は、監査役の独立性確保を目的とするものである。",ans:false,exp:"補欠監査役の選任（会社法329条3項）は員数確保・機関の継続性を目的とするものであり、独立性確保とは直接関係しない。"},
{cat:"監査役の独立性確保",q:"監査役の任期は、定款の定めによって短縮することができないとの規律は、監査役の独立性確保を目的とするものである。",ans:true,exp:"監査役の任期（4年）を定款でも短縮できないとする規律（会社法336条1項・2項）は、監査役の地位の安定・独立性確保を目的とする。"},
{cat:"監査役の独立性確保",q:"監査役会の決議は、監査役の過半数をもって行うとの規律は、監査役の独立性確保を目的とするものである。",ans:false,exp:"監査役会の決議要件（会社法393条1項）は意思決定手続の明確化を目的とするものであり、独立性確保とは直接関係しない。"},
{cat:"株主総会決議に係る訴訟",q:"監査役を辞任した者は、辞任後最初に招集される株主総会に出席して、辞任した旨及びその理由を述べることができるとの規律は、監査役の独立性確保を目的とするものである。",ans:true,exp:"辞任した監査役が株主総会で辞任理由を述べられる規律（会社法345条2項）は、監査役の実質的独立性を間接的に保護する目的がある。 第19問：株主総会決議に係る訴訟"},
{cat:"株主総会決議に係る訴訟",q:"株主総会の招集通知の発出に漏れがあった場合、その程度にかかわらず、株主総会決議不存在確認の訴えを提起することはできない。",ans:false,exp:"招集通知の漏れの程度が著しい場合には決議の不存在と判断されることがある（判例）。「程度にかかわらず不存在確認訴訟を提起できない」は誤り。"},
{cat:"株主総会決議に係る訴訟",q:"株主総会決議無効確認の訴えは、確認の利益を有する限り、誰でも提起することができる。",ans:true,exp:"決議無効確認の訴えは一般の確認訴訟であり（会社法830条2項）、確認の利益を有する者であれば誰でも提起できる。"},
{cat:"株主総会決議に係る訴訟",q:"株主総会決議取消しの訴えの提起があった場合において、株主総会の招集の手続が定款に違反するときでも、裁判所は、その違反する事実が重大でなく、かつ、決議に影響を及ぼさないものであると認めるときは、その訴えに係る請求を棄却することができる。",ans:true,exp:"裁量棄却の規定（会社法831条2項）。招集手続・決議方法の違反が法令・定款違反のいずれであっても、違反が軽微で決議に影響しないと認められるときは裁量棄却が可能。"},
{cat:"株主総会決議に係る訴訟",q:"株主総会の決議の方法が法令に違反した場合、株主総会決議無効確認の訴えを提起することができる。",ans:false,exp:"決議の方法が法令に違反した場合は取消事由（会社法831条1項1号）。無効事由となるのは決議の内容が法令に違反する場合（会社法830条2項）。"},
{cat:"株式会社の設立",q:"株主総会決議無効確認の訴えに係る請求を棄却する確定判決は、第三者に対しても、その効力を有する。",ans:false,exp:"対世効が認められるのは認容判決（会社法838条）。棄却判決には対世効はない。 第20問：株式会社の設立"},
{cat:"株式会社の設立",q:"会社がその子会社を設立するには、発起設立又は募集設立のいずれかの方法によらなければならない。",ans:true,exp:"株式会社の設立方法は発起設立と募集設立の2種類のみ（会社法25条1項）。"},
{cat:"株式会社の設立",q:"会社の本店の所在地は、設立する際の定款で定めなければならない。",ans:true,exp:"本店の所在地は定款の絶対的記載事項（会社法27条3号）。"},
{cat:"株式会社の設立",q:"設立時募集株式の引受人が所定の期日又は期間内に設立時募集株式の払込金額の全額の払込みをしなかった場合には、その引受人は、その払込みをすることにより設立時募集株式の株主となる権利を失う。",ans:true,exp:"払込期日・期間内に払込みをしなかった引受人は失権し、株主となる権利を失う（会社法63条3項）。"},
{cat:"株式会社の設立",q:"会社の公告方法は、設立する際の定款で定めなければならない。",ans:false,exp:"公告方法は定款の任意的記載事項。定款に定めがない場合は官報による公告が法定の公告方法となる（会社法939条4項）。"},
{cat:"株式会社の設立",q:"会社の設立を無効とする判決が確定したときは、その会社は、当初から存在しなかったことになる。",ans:false,exp:"設立無効判決は将来に向かってのみ効力を生じる（会社法839条）。遡及効はなく、判決確定前の会社の法律関係は有効なまま維持される。"},
{cat:"定款で定めることができるか（公開会社）",q:"会社は，相続その他の一般承継により会社の譲渡制限株式を取得した者に対し，その株式を会社 に売り渡すことを請求することができる旨を定款で定めることができる。",ans:true,exp:"会社法174条により、相続等の一般承継により譲渡制限株式を取得した者に対して売渡請求ができる旨を定款で定めることができる。"},
{cat:"定款で定めることができるか（公開会社）",q:"会社は，必要と認める場合には，株主総会の特別決議に基づき，その親会社の株式を取得するこ とができる旨を定款で定めることができる。",ans:false,exp:"親会社株式の取得は原則禁止されており（会社法135条）、定款で自由に取得できる旨を定めることはできない。"},
{cat:"定款で定めることができるか（公開会社）",q:"単元未満株主は，その有する単元未満株式について，株主代表訴訟を提起する権利を有しないこ ととする旨を定款で定めることができる。",ans:false,exp:"単元未満株主から剥奪できる権利は会社法189条2項に列挙されており、株主代表訴訟提起権はその中に含まれていない。"},
{cat:"定款で定めることができるか（公開会社）",q:"ある種類の株式の内容として，その種類の株式の種類株主を構成員とする種類株主総会におい て取締役を選任することとする旨を定款で定めることができる。",ans:false,exp:"役員選任権付種類株式（会社法108条1項9号）は公開会社では発行できない（会社法108条1項ただし書）。"},
{cat:"取得請求権付株式",q:"会社法に規定する事項以外の一定の事項について，種類株主総会で決議をすることができる旨を定款で定めることができる。",ans:true,exp:"会社法321条は「種類株主総会は、この法律に規定する事項及び定款で定めた事項に限り、決議をすることができる」と規定しており、定款で法律に規定のない事項を追加することができる。"},
{cat:"取得請求権付株式",q:"取得請求権付株式の株主は，その取得の対価が金銭である場合において，株式会社に分配可能 額がないときは，取得の請求をすることができない。",ans:true,exp:"対価が金銭である場合、分配可能額がなければ取得請求はできない（会社法166条1項ただし書）。財源規制が適用される。"},
{cat:"取得請求権付株式",q:"株式会社が株主の取得の請求によって取得請求権付株式を取得する場合には，その取得につい て株主総会の決議を経なければならない。",ans:false,exp:"取得請求権付株式の取得は株主の請求に基づくものであり、株主総会の決議は不要（会社法166条）。"},
{cat:"取得請求権付株式",q:"株式会社が株主の取得の請求によって取得請求権付株式を取得した場合には，相当の時期に， 取得した自己株式を消却しなければならない。",ans:false,exp:"取得した自己株式を消却しなければならないという義務は会社法上規定されていない。自己株式の消却は任意（会社法178条）。"},
{cat:"取得請求権付株式",q:"株式会社が株主の取得の請求によって取得請求権付株式を取得した結果，取得した日の属する 事業年度に係る計算書類において欠損が生じた場合でも，その行為に関する職務を行った業務執行 者は，その会社に対し，その欠損を塡補する責任を負わない。",ans:true,exp:"欠損填補責任が生じるのは違法配当等の場合（会社法465条）に限られる。取得請求権付株式の適法な取得により欠損が生じても業務執行者に填補責任は生じない。"},
{cat:"譲渡制限株式",q:"優先株式を取得請求権付株式とすることはできるが，その取得の対価を普通株式とすることは できない。",ans:false,exp:"取得請求権付株式の対価は金銭・株式・社債・新株予約権等様々なものを定めることができる（会社法107条2項2号）。普通株式を対価とすることも可能。 第3問：譲渡制限株式"},
{cat:"譲渡制限株式",q:"会社が，定款を変更して，その発行する全部の株式の内容として，譲渡による当該株式の取得 について会社の承認を要する旨の定款の定めを設ける場合には，総株主の同意を得なければならな い。",ans:true,exp:"全株式への譲渡制限設定は公開会社から非公開会社への転換であり、総株主の同意が必要（会社法111条1項）。"},
{cat:"譲渡制限株式",q:"会社は，その発行する一部の株式の内容として，譲渡による当該株式の取得について会社の承 認を要する旨の定款の定めを設けることはできない。",ans:false,exp:"種類株式として一部の株式にのみ譲渡制限を設けることは可能（会社法108条1項4号）。"},
{cat:"譲渡制限株式",q:"譲渡制限株式の株主が死亡した場合には，その相続人は，当該譲渡制限株式の取得について会 社の承認を得ない限り，会社に対し，株主の地位を主張することはできない。",ans:false,exp:"相続は一般承継であり、会社の承認なしに当然に株主の地位を取得する。"},
{cat:"譲渡制限株式",q:"判例の趣旨によれば，取締役会設置会社の唯一の株主がその保有する譲渡制限株式を他に譲渡 した場合には，取締役会の決議による承認がないときであっても，その譲渡は，当事者間だけでは なく，会社に対する関係においても，有効である。",ans:true,exp:"判例（最判昭和48年6月15日）により、一人会社の唯一の株主による譲渡は取締役会承認なしでも会社に対しても有効。"},
{cat:"株式の譲渡（判例）",q:"取締役会設置会社は，定款の定めにより，譲渡による株式の取得についての承認の決定を株主 総会の決議によるものとすることができる。",ans:true,exp:"定款の定めにより承認機関を株主総会とすることができる（会社法139条1項ただし書）。 第4問：株式の譲渡（判例）"},
{cat:"株式の譲渡（判例）",q:"株券発行会社が株券の発行を不当に遅滞し，信義則に照らし，株券発行前にされた株式の譲渡 の効力を否定するのを相当としない状況に至った場合において，株主が意思表示のみによって株式 を譲渡したときは，その譲渡は，会社に対しても，その効力を有する。",ans:true,exp:"判例（最判昭和47年11月8日）は、株券発行の不当遅滞がある場合は意思表示のみの譲渡でも会社に対して有効と認める。"},
{cat:"株式の譲渡（判例）",q:"譲渡制限株式について，会社の承認を得ないで譲渡がされた場合，その譲渡は，譲渡当事者間 において，その効力を有しない。",ans:false,exp:"会社の承認のない譲渡制限株式の譲渡は当事者間では有効であり、会社に対する関係でのみ効力を生じない（相対的無効説）。"},
{cat:"株式の譲渡（判例）",q:"株式の譲渡について，会社に対し適法に株主名簿の名義書換請求がされたにもかかわらず，会 社の過失により名義書換が行われなかったときは，会社は，株主名簿の名義書換のないことを理由 として，株式の譲渡を否定することができない。",ans:true,exp:"判例（最判昭和41年7月28日）は、適法な名義書換請求を会社が正当な理由なく拒んだ場合、会社は名義書換未了を理由に譲渡を否定できないとする。"},
{cat:"株式の譲渡（判例）",q:"株式の譲渡に関する株主名簿の名義書換が会社の都合で遅れている場合には，会社は，その譲 渡を認め譲受人を株主として取り扱うことができない。",ans:false,exp:"名義書換が会社側の都合で遅れている場合、会社は譲受人を株主として取り扱うことができる（会社法130条の趣旨）。"},
{cat:"株券",q:"株券発行会社の株式について，その会社の剰余金の配当の基準日より前に株券が交付されて譲 渡されたが，その基準日までに株主名簿の名義書換請求がされずに譲渡人が配当金を受領したとき は，譲渡人は，譲受人に対し，受領した配当金相当額の金員について不当利得返還義務を負わない。",ans:true,exp:"判例（最判昭和37年4月20日）は、名義書換前の譲渡人による配当受領について不当利得返還義務を負わないとする。 第5問：株券"},
{cat:"株券",q:"判例の趣旨によれば，株券としての効力が発生するのは，株式会社が会社法所定の形式を具備 した文書を作成した時ではなく，当該文書を株主に交付した時である。",ans:true,exp:"判例は株券の効力発生時期を株主への交付時とする。作成時ではなく交付によって有価証券としての効力が生じる。"},
{cat:"株券",q:"一部の種類の株式についてのみ譲渡制限がある株式会社は，株主から請求があるまでは，株券 を発行しないことができる。",ans:false,exp:"株券発行会社では株主の請求前でも株券を発行する義務がある（会社法215条1項）。"},
{cat:"株券",q:"株主は，株式会社に対し，株券の所持を希望しない旨を申し出ることができ，当該株主が所持 していた株券は，当該株主が当該株券を当該株式会社に提出した時に無効となる。",ans:true,exp:"株主は株券不所持の申出をすることができ（会社法217条1項）、株券提出時にその株券は無効となる（会社法217条4項）。"},
{cat:"株券",q:"株券喪失登録がされた株券は，その登録が抹消された場合又は株式会社が株券発行会社でなく なることにより株券が無効となった場合を除き，株券喪失登録日の翌日から起算して１年を経過し た日に無効となる。",ans:true,exp:"株券喪失登録制度において、登録日翌日から1年を経過した日に当該株券は無効となる（会社法228条1項）。"},
{cat:"株式の譲渡（判例・重複）",q:"株式会社がその株式に係る株券を発行する旨の定款の定めを廃止する定款変更をしたときは， 当該株式会社の株券は，株主が株券を当該株式会社に提出しなくても，当該定款変更がその効力を 生ずる日に無効となる。",ans:true,exp:"株券発行会社が株券不発行会社に移行する定款変更をした場合、効力発生日に既存の株券は当然に無効となる（会社法218条4項）。 第6問：株式の譲渡（判例・重複）"},
{cat:"株式の譲渡（判例・重複）",q:"株券発行会社が株券の発行を不当に遅滞し，信義則に照らし，株券発行前にされた株式の譲渡 の効力を否定するのを相当としない状況に至った場合において，株主が意思表示のみによって株式 を譲渡したときは，その譲渡は，会社に対しても，その効力を有する。",ans:true,exp:"判例（最判昭和47年11月8日）。株券発行の不当遅滞がある場合は意思表示のみの譲渡でも会社に対して有効。"},
{cat:"株式の譲渡（判例・重複）",q:"譲渡制限株式について，会社の承認を得ないで譲渡がされた場合，その譲渡は，譲渡当事者間 において，その効力を有しない。",ans:false,exp:"当事者間では有効、会社との関係でのみ無効という相対的無効説が判例の立場。"},
{cat:"株式の譲渡（判例・重複）",q:"株式の譲渡について，会社に対し適法に株主名簿の名義書換請求がされたにもかかわらず，会 社の過失により名義書換が行われなかったときは，会社は，株主名簿の名義書換のないことを理由 として，株式の譲渡を否定することができない。",ans:true,exp:"適法な請求を無視した会社は名義書換未了を対抗できない。"},
{cat:"株式の譲渡（判例・重複）",q:"株式の譲渡に関する株主名簿の名義書換が会社の都合で遅れている場合には，会社は，その 譲渡を認め譲受人を株主として取り扱うことができない。",ans:false,exp:"会社から積極的に譲受人を株主として扱うことは可能。"},
{cat:"自己株式",q:"株券発行会社の株式について，その会社の剰余金の配当の基準日より前に株券が交付されて 譲渡されたが，その基準日までに株主名簿の名義書換請求がされずに譲渡人が配当金を受領したと きは，譲渡人は，譲受人に対し，受領した配当金相当額の金員について不当利得返還義務を負わな い。",ans:true,exp:"名義書換前の受領配当金について不当利得返還義務なしという判例の立場。 第7問：自己株式"},
{cat:"自己株式",q:"株式会社は，自己株式について，株主総会における議決権を有しない。",ans:true,exp:"自己株式には議決権がない（会社法308条2項）。"},
{cat:"自己株式",q:"株式会社は，自己株式について，剰余金の配当をすることができない。",ans:true,exp:"自己株式には剰余金配当請求権がない（会社法453条）。"},
{cat:"自己株式",q:"株式会社は，自己株式の取得価額を貸借対照表の資産の部に計上しなければならない。",ans:false,exp:"自己株式は純資産の部の控除項目として計上される。資産の部には計上できない。"},
{cat:"自己株式",q:"自己株式を消却することにより，資本金の額は，減少する。",ans:false,exp:"自己株式の消却により減少するのは発行済株式総数であり、資本金の額は減少しない（会社法178条）。"},
{cat:"利益供与",q:"自己株式を消却することにより，発行可能株式総数は，減少する。",ans:false,exp:"自己株式の消却により発行可能株式総数は減少しない。発行済株式総数のみが減少する。 第8問：利益供与"},
{cat:"利益供与",q:"判例によれば，会社から見て好ましくない株主が議決権を行使することを回避する目的で，会 社が，自己の計算において，第三者に対してその株主から株式を譲り受けるための対価を供与した 場合には，株主の権利の行使に関する利益の供与に該当する。",ans:true,exp:"判例（最判平成18年4月10日）は、会社が第三者を通じて問題株主から株式を買い取るための費用を負担した行為を利益供与に該当するとする。"},
{cat:"利益供与",q:"会社が，自己の計算において， 特定の株主に対して無償で財産上の利益の供与をした場合には， その会社は，株主の権利の行使に関する利益の供与をしたものと推定される。",ans:true,exp:"会社法120条2項により、特定株主への無償の財産上の利益供与は株主権行使に関する利益供与と推定される。"},
{cat:"利益供与",q:"株主が，自己の計算において，株主総会における議決権の行使に関し，他の株主に対して財産 上の利益の供与をした場合には，株主の権利の行使に関する利益の供与に該当する。",ans:false,exp:"利益供与規制（会社法120条）は会社が行う供与を対象とする。株主間の利益供与は同条の対象外。"},
{cat:"利益供与",q:"取締役が株主の権利の行使に関する利益の供与をした場合には，その利益の供与をすることに 関与した他の取締役は，その職務を行うについて注意を怠ったかどうかにかかわらず，会社に対し， 供与した利益の価額に相当する額を支払う義務を負う。",ans:false,exp:"無過失責任は本人のみ"},
{cat:"株主名簿",q:"会社から株主の権利の行使に関する利益の供与を受けた者が取締役，会計参与，監査役，執行 役又は会計監査人でない場合には，その者に対してその利益の返還を求める株主代表訴訟は，提起 することができない。",ans:true,exp:"株主代表訴訟の対象は会社法847条1項所定の役員等に限られる。役員等でない第三者に対する利益返還請求は代表訴訟の対象外。 第9問：株主名簿"},
{cat:"株主名簿",q:"株式会社は，株主名簿に株主が株式を取得した日を記載又は記録することを要しない。",ans:false,exp:"株主名簿の記載事項には株式取得日が含まれる（会社法121条4号）。"},
{cat:"株主名簿",q:"株式会社は，株主名簿管理人を置く旨を定款で定め，株主名簿の作成及び備置きその他の株主 名簿に関する事務を行うことを委託することができる。",ans:true,exp:"株主名簿管理人制度（会社法123条）により、定款の定めに基づき株主名簿管理人に株主名簿事務を委託することができる。"},
{cat:"株主名簿",q:"株式会社は，株主から株主名簿の閲覧の請求があった場合において，当該請求を行う株主が当 該株式会社の業務と実質的に競争関係にある事業を営み，又はこれに従事する者であるときは，当 該請求を拒むことができる。",ans:true,exp:"株主名簿の閲覧拒絶事由の一つとして、請求者が競業者である場合が明記されている（会社法125条3項3号）。"},
{cat:"株主名簿",q:"株主が別に通知を受ける場所又は連絡先を株式会社に通知していないときは，当該株式会社が 当該株主に対してする通知は，株主名簿に記載又は記録された当該株主の住所に宛てて発すれば足 りる。",ans:true,exp:"会社法126条1項により、株主への通知は株主名簿上の住所に宛てて発すれば足りる。"},
{cat:"株式の併合・分割",q:"株式会社は，一定の日を定めて，当該日において株主名簿に記載又は記録されている株主をそ の権利を行使することができる者と定めることができる。",ans:true,exp:"基準日制度（会社法124条）の内容。一定の日（基準日）における株主名簿上の株主を権利行使者と定めることができる。 第10問：株式の併合・分割"},
{cat:"株式の併合・分割",q:"株式の併合については，株式の併合が法令又は定款に違反する場合において，株主が不利益を 受けるおそれがあるときは，株主が会社に対し株式の併合をやめることを請求することができる権 利が会社法に規定されているが，株式の分割については，株主が会社に対し株式の分割をやめるこ とを請求することができる権利が会社法に規定されていない。",ans:true,exp:"株式の併合には差止請求権が認められる（会社法182条の3）。株式の分割については差止請求に関する規定はない。"},
{cat:"株式の併合・分割",q:"株式の併合及び株式の分割のいずれについても，反対株主の株式買取請求権が会社法に規定さ れている。",ans:false,exp:"反対株主の株式買取請求権は株式の併合についてのみ規定（会社法182条の4）。株式の分割については買取請求権の規定はない。"},
{cat:"株式の併合・分割",q:"会社は，取締役会の決議によって株式の併合をすることができる旨を定款で定めることができ る。",ans:false,exp:"株式の併合は株主総会の特別決議が必要であり（会社法180条2項）、定款で取締役会に委任することはできない。"},
{cat:"株式の併合・分割",q:"発行可能株式総数が１０００株であって，発行済株式の総数が３００株である会社が１株を５ 株とする株式の分割をする場合には，株主総会の決議によらないで，発行可能株式総数を４０００ 株に増加する定款の変更をすることができる。",ans:true,exp:"株式分割に伴う発行可能株式総数の増加は、分割の割合を超えない範囲であれば取締役会決議のみで可能（会社法184条2項）。"},
{cat:"株式の併合・分割",q:"会社が会社法上の公開会社である場合であっても，株式の併合により，その効力が生ずる日に おける発行可能株式総数が発行済株式の総数の４倍を超えることとなることが認められる。",ans:false,exp:"会社法180条3項"},
{cat:"公開会社における募集株式の発行",q:"判例の趣旨によれば，募集事項の株主に対する通知又は公告をいずれも欠いたことは，募集株 式の発行差止請求をしたとしても差止めの事由がないためにこれが許容されないと認められる場 合でない限り，募集株式の発行の無効原因となる。",ans:true,exp:"判例（最判平成9年1月28日）は、通知・公告のいずれも欠いた場合は無効原因になるとする（差止めが許容されない場合を除く）。"},
{cat:"公開会社における募集株式の発行",q:"募集に係る株式の発行が，法令又は定款に違反しない場合であっても，著しく不公正な方法に より行われる場合において，株主が不利益を受けるおそれがあるときは，株主は，株式会社に対し， 当該株式の発行をやめることを請求することができる。",ans:true,exp:"会社法210条2号により、著しく不公正な方法による発行に対して差止請求ができる。"},
{cat:"公開会社における募集株式の発行",q:"株式会社が株主に株式の割当てを受ける権利を与える場合には，株主は，募集株式の引受けの 申込みをしなくても，募集株式の引受人となる。",ans:false,exp:"株主割当ての場合でも株主は申込みをしなければ引受人とはならない（会社法202条4項）。"},
{cat:"公開会社における募集株式の発行",q:"募集株式の引受人は，募集株式の払込金額の払込みをする債務と株式会社に対する債権とを相 殺することができない。",ans:true,exp:"払込債務と会社に対する債権の相殺は禁止されている（会社法208条3項）。"},
{cat:"新株予約権",q:"募集株式の引受人が募集株式の払込金額の払込みを仮装した場合には，当該払込みの仮装に関 する職務を行った取締役（当該払込みを仮装したものを除く。）は，その職務を行うについて注意を 怠らなかったことを証明したときであっても，株式会社に対し，払込みを仮装した払込金額の支払 をする義務を負う。",ans:false,exp:"会社法213条の3"},
{cat:"新株予約権",q:"募集新株予約権についての払込期日が定められている場合において，新株予約権者が当該払込 期日までに募集新株予約権の払込金額の全額の払込みをしないときは，当該募集新株予約権は消滅 する。",ans:true,exp:"払込期日までに払込みがなかった場合、募集新株予約権は当然に消滅する（会社法246条1項）。"},
{cat:"新株予約権",q:"新株予約権者は，募集新株予約権の払込金額の全額の払込みに代えて，払込金額に相当する金 銭以外の財産を給付しようとする場合だけでなく，その株式会社に対する債権をもって相殺する場 合にも，当該株式会社の承諾を得なければならない。",ans:false,exp:"新株予約権の行使に際しての払込みは相殺が認められている。現物出資のみ会社の承諾が必要（会社法281条1項）。"},
{cat:"新株予約権",q:"新株予約権者は，現物出資財産の実際の価額が新株予約権の内容として定められた現物出資財 産の価額に著しく不足することについて，善意でかつ重大な過失がないときであっても，その株式 会社に対し，当該不足額を支払う義務があり，新株予約権の行使に係る意思表示を取り消して，そ の支払義務を免れることはできない。",ans:false,exp:"現物出資財産の価額が著しく不足する場合、善意かつ重大な過失がない新株予約権者は不足額支払義務を負わない（会社法285条1項ただし書）。"},
{cat:"新株予約権",q:"公開会社でない取締役会設置会社は，新株予約権を引き受ける者の募集をするに当たって株主4 に新株予約権の割当てを受ける権利を与えることを決定する場合において，取締役会の決議によっ て募集事項等を定めることができる旨の定款の定めを設けることはできない。",ans:false,exp:"非公開会社の取締役会設置会社でも、定款の定めにより取締役会に新株予約権の募集事項の決定を委任することができる（会社法239条）。"},
{cat:"会社の計算",q:"株式交換完全親株式会社は，株式交換契約に定めることにより，株式交換に際して，株式交換 完全子会社の新株予約権の新株予約権者に対し，当該新株予約権に代わる当該株式交換完全親株式 会社の新株予約権を交付することができる。",ans:true,exp:"株式交換に際して、完全子会社の新株予約権者に対して完全親会社の新株予約権を交付する旨を株式交換契約に定めることができる（会社法768条1項4号）。 第13問：会社の計算"},
{cat:"会社の計算",q:"株式会社が資本金の額を減少する場合には，当該株式会社の債権者は，当該株式会社に対し， 資本金の額の減少について異議を述べることができる。",ans:true,exp:"資本金の減少は債権者の利益に影響するため、債権者異議手続が必要（会社法449条1項）。"},
{cat:"会社の計算",q:"株式会社は，株主総会の決議によることなく，剰余金の額を減少してその分を準備金とするこ とができる。",ans:true,exp:"剰余金から準備金への振替は取締役会の決議で行うことができ、株主総会決議は不要（会社法451条）。"},
{cat:"会社の計算",q:"設立に際して株主となる者が株式会社に対して払込み又は給付をした財産の額のうち資本金と して計上しないこととされた額は，資本準備金として計上されなければならない。",ans:true,exp:"払込金額のうち資本金に計上しない額は資本準備金として計上しなければならない（会社法445条2項・3項）。"},
{cat:"会社の計算",q:"株式会社における準備金の額の減少は，訴えによらなくてもその無効を主張することができる。",ans:false,exp:"準備金の額の減少の無効は訴えによってのみ主張することができる（会社法828条1項5号）。"},
{cat:"資本金・準備金",q:"株式会社は，資本金の額を減少した場合には，変更の登記をしなければならない。",ans:true,exp:"資本金の額は登記事項であり（会社法911条3項5号）、変更があれば変更登記が必要（会社法915条1項）。 第14問：資本金・準備金"},
{cat:"資本金・準備金",q:"株式会社が取得条項付新株予約権を取得するのと引換えに当該取得条項付新株予約権の新株予 約権者に対して当該株式会社の新たに発行する株式を交付するときは，当該株式会社は，資本金の 額を増加することができない。",ans:false,exp:"新株を発行する場合には資本金を増加することは可能かつ必要。取得条項付新株予約権の取得と引換えに株式を交付する場合も同様。"},
{cat:"資本金・準備金",q:"株式会社が株式の発行と同時に資本金の額を減少する場合において，当該資本金の額の減少の 効力が生ずる日後の資本金の額が当該日前の資本金の額を下回らないときは，当該株式会社の債権 者は，当該株式会社に対し，当該資本金の額の減少について異議を述べることができない。",ans:true,exp:"同時に新株発行をして資本金が維持される場合には債権者保護の必要性が低いため、債権者異議手続が不要（会社法449条1項ただし書）。"},
{cat:"資本金・準備金",q:"株式会社が準備金の額を減少する場合において，減少する準備金の額の全部を資本金とすると きは，当該株式会社の債権者は，当該株式会社に対し，当該準備金の額の減少について異議を述べ ることができない。",ans:true,exp:"準備金を全額資本金に振り替える場合は会社財産の社外流出がなく、債権者異議手続は不要（会社法449条1項ただし書）。"},
{cat:"資本金・準備金",q:"株式会社が剰余金の額を減少して，資本金の額を増加するには，株主総会の特別決議によらな ければならない。",ans:false,exp:"剰余金から資本金への振替は株主総会の普通決議で足りる（会社法450条）。特別決議は不要。"},
{cat:"剰余金の配当（公開会社）",q:"株式会社における資本金の額の減少について承認をしたものとみなされた債権者は，当該資本 金の額の減少の無効の訴えを提起することができない。",ans:true,exp:"承認したとみなされた債権者は資本金の額の減少無効の訴えの原告適格を持たない（会社法828条2項5号参照）。 第15問：剰余金の配当（公開会社）"},
{cat:"剰余金の配当（公開会社）",q:"配当財産が金銭であるときは，当該公開会社は，株主総会の決議によって，その株主に対し， 株主の有する株式１０００株までは１株につき１００円，１０００株を超える株式については１株 につき５０円を割り当てる旨を定めることができる。",ans:false,exp:"剰余金の配当は株式数に応じて平等に行わなければならず（会社法454条3項）、株式数によって単価を変える差別的配当は認められない。"},
{cat:"剰余金の配当（公開会社）",q:"配当財産が金銭以外の財産であるときは，当該公開会社は，株主総会の決議によって，一定の 数未満の数の株式を有する株主に対して当該配当財産の割当てをしないこととすることができる。",ans:true,exp:"現物配当の場合、一定株数未満の株主に割当てをしないことができる（会社法454条4項1号）。"},
{cat:"剰余金の配当（公開会社）",q:"当該公開会社は，当該公開会社の株式を配当財産として剰余金の配当をすることができる。",ans:false,exp:"会社が自己の株式を配当財産として配当することは認められていない（会社法454条1項）。"},
{cat:"剰余金の配当（公開会社）",q:"当該公開会社は，定款の定めがない場合であっても，一事業年度の途中において１回に限り取 締役会の決議によって中間配当をすることができる。",ans:false,exp:"中間配当（取締役会決議による期中配当）は定款の定めがある場合に限り認められる（会社法454条5項）。"},
{cat:"自己株式取得と分配可能額規制",q:"当該公開会社が定時株主総会の決議に基づき剰余金の配当をした場合において，当該剰余金の 配当をした日の属する事業年度に係る計算書類につき定時株主総会の承認を受けた時において欠 損が生じたときは，当該剰余金の配当に関する職務を行った業務執行者は，当該公開会社に対し， 連帯して，当該欠損の額を支払う義務を負う。",ans:false,exp:"定時株主総会の承認を受けた場合は免責される（会社法465条2項）。本問は定時株主総会決議に基づく配当なので義務を負わない。 第16問：自己株式取得と分配可能額規制"},
{cat:"自己株式取得と分配可能額規制",q:"取得条項付株式の取得により株主に対して交付する金銭の額は，分配可能額を超えてはならな い。",ans:true,exp:"取得条項付株式の取得も財源規制の対象（会社法461条1項3号）。"},
{cat:"自己株式取得と分配可能額規制",q:"株式会社が譲渡制限株式の取得の承認をしない旨の決定をする場合において，譲渡制限株式の 買取りの請求に応じて行う当該株式会社の株式の買取りにより株主に対して交付する金銭の額は， 分配可能額を超えてはならない。",ans:true,exp:"会社が承認しない旨の決定をした場合の買取りも財源規制の対象（会社法461条1項1号）。"},
{cat:"自己株式取得と分配可能額規制",q:"単元未満株式の買取りの請求があった場合において，当該単元未満株式の買取りにより株主に 対して交付する金銭の額は，分配可能額を超えてはならない。",ans:false,exp:"単元未満株式の買取りは会社法461条1項の列挙事由に含まれておらず、分配可能額規制の対象外。"},
{cat:"自己株式取得と分配可能額規制",q:"株式会社が他の会社の事業の全部を譲り受けることにより当該他の会社が有する当該株式会社 の株式を取得する場合において，当該株式会社の株式の取得により当該他の会社に対して交付する 金銭の額は，分配可能額を超えてはならない。",ans:false,exp:"事業の全部譲受けに伴う自社株式の取得は分配可能額規制の対象外。"},
{cat:"債権者異議手続",q:"株式交換をする場合において，株式交換をする株式会社の反対株主の株式買取請求があったと きは，当該反対株主が有する株式の買取りにより当該反対株主に対して交付する金銭の額は，分配 可能額を超えてはならない。",ans:false,exp:"組織再編行為に伴う反対株主の株式買取請求に応じた買取りは、会社法461条1項の財源規制の対象外。 第17問：債権者異議手続"},
{cat:"債権者異議手続",q:"組織変更をする株式会社の債権者は，当該株式会社に対し，組織変更について異議を述べるこ とができない。",ans:false,exp:"組織変更をする株式会社の債権者は異議を述べることができる（会社法779条1項）。"},
{cat:"債権者異議手続",q:"新設合併をする株式会社の債権者は，当該株式会社に対し，新設合併について異議を述べるこ とができる。",ans:true,exp:"新設合併消滅会社の債権者は異議を述べることができる（会社法810条1項）。"},
{cat:"債権者異議手続",q:"吸収分割をする株式会社が株主総会の決議によって吸収分割契約の承認を受けなければならな い場合において，当該株式会社の債権者が当該株式会社に対し吸収分割について異議を述べること ができるときは，当該債権者が異議を述べることができる期間の初日は，当該承認があった日後の 日でなければならない。",ans:true,exp:"債権者が異議を述べることができる期間の初日は株主総会承認日後でなければならない（会社法789条2項）。"},
{cat:"債権者異議手続",q:"株式交換完全親株式会社が株式交換に際して株式交換完全子会社の株主に対して交付する対価 が金銭のみである場合には，当該株式交換完全親株式会社の債権者は，当該株式交換完全親株式会 社に対し，株式交換について異議を述べることができる。",ans:true,exp:"対価が金銭のみの場合、完全親会社から財産が流出するため債権者保護の必要があり、異議を述べることができる（会社法799条1項3号）。"},
{cat:"事業譲渡・吸収分割",q:"社債管理者の設置がされていない社債の社債権者が，当該社債を発行した株式会社に対し，資 本金の額の減少について異議を述べるには，社債権者集会の決議によらなければならない。",ans:false,exp:"社債管理者が設置されていない場合、各社債権者が個別に異議を述べることができる。社債権者集会の決議は不要。 第18問：事業譲渡・吸収分割"},
{cat:"事業譲渡・吸収分割",q:"事業譲渡をする場合には，譲渡会社の新株予約権者は，譲渡会社に対し，自己の有する新株予 約権を買い取ることを請求することができないが，吸収分割をする場合には，吸収分割会社の新株 予約権者は，吸収分割会社に対し，自己の有する新株予約権を買い取ることを請求することができ ることがある。",ans:true,exp:"吸収分割では反対新株予約権者の買取請求権が認められる場合がある（会社法787条1項）。事業譲渡については新株予約権者の買取請求権の規定はない。"},
{cat:"事業譲渡・吸収分割",q:"譲渡会社及び吸収分割会社のいずれについても，当事会社の別段の意思表示がない限り競業避 止義務を負う旨が会社法に規定されている。",ans:false,exp:"競業避止義務は事業譲渡についてのみ規定（会社法21条）。吸収分割については会社法上の競業避止義務規定はない。"},
{cat:"事業譲渡・吸収分割",q:"事業譲渡については，債権者異議手続をすることを要しないが，吸収分割については，債権者 異議手続をしなければならないことがある。",ans:true,exp:"事業譲渡は契約による移転であり法律上の債権者異議手続は不要。吸収分割では債権者異議手続が必要な場合がある（会社法789条1項2号）。"},
{cat:"事業譲渡・吸収分割",q:"事業譲渡の無効及び吸収分割の無効は，いずれも訴えをもってのみ主張することができる。",ans:false,exp:"事業譲渡の無効は通常の契約の無効として処理されるため、訴えによらなくても主張できる。"},
{cat:"組織再編と登記",q:"吸収分割会社が吸収分割承継会社に承継されない債務の債権者を害することを知って吸収分割 をした場合には，当該債権者が吸収分割承継会社に対して当該債務の履行を請求することができる ときがあることが会社法に規定されているが，譲渡会社が譲受会社に承継されない債務の債権者を 害することを知って事業譲渡をした場合には，当該債権者が譲受会社に対して当該債務の履行を請 求することができるときがあることは会社法に規定されていない。",ans:true,exp:"吸収分割における詐害的分割に対する残存債権者保護規定は会社法764条4項に規定。事業譲渡については会社法上の対応規定はない。 第19問：組織再編と登記"},
{cat:"組織再編と登記",q:"吸収合併存続会社は，吸収合併の登記をした日に，吸収合併消滅会社の権利義務を承継する。",ans:false,exp:"吸収合併の効力発生日は吸収合併契約で定めた効力発生日（会社法750条1項）であり、登記日ではない。"},
{cat:"組織再編と登記",q:"吸収合併消滅会社の吸収合併による解散は，吸収合併の登記の後でなければ，これをもって第 三者に対抗することができない。",ans:true,exp:"消滅会社の解散は登記後でなければ第三者に対抗できない（会社法750条2項）。"},
{cat:"組織再編と登記",q:"新設合併設立会社は，その本店の所在地において設立の登記をした日に，新設合併消滅会社の 権利義務を承継する。",ans:true,exp:"新設合併の場合は設立登記日に効力が発生し（会社法754条1項）、その日に権利義務を承継する。"},
{cat:"組織再編と登記",q:"同一の不動産について，その差押えと吸収分割による権利義務の承継との間の優劣は，不動産 の差押えの登記の時と吸収分割承継会社が吸収分割の登記をした時の先後で決する。",ans:false,exp:"吸収分割による不動産の承継と差押えの優劣は吸収分割の効力発生日と差押えの先後で決する。登記日ではない。"},
{cat:"振替株式",q:"株式交換完全子会社の株主は，株式交換の登記がされた日に，株式交換完全親会社の株主とな る。",ans:false,exp:"株式交換の効力発生日は株式交換契約で定めた効力発生日（会社法769条1項）であり、登記日ではない。 第20問：振替株式"},
{cat:"振替株式",q:"振替株式に係る株主名簿の名義書換は，振替機関から会社に対し総株主通知がされた場合には 行われるが，振替機関から会社に対し個別株主通知がされた場合には行われない。",ans:true,exp:"総株主通知に基づいて株主名簿の名義書換が行われる（社債株式振替法151条）。個別株主通知は名義書換の根拠にはならない。"},
{cat:"振替株式",q:"振替株式の譲渡は，当事者の意思表示のみによってその効力を生ずるが，振替の申請により， 振替口座簿中の譲受人の口座における保有欄にその譲渡に係る数の増加の記録がされなければ，会 社に対抗することができない。",ans:false,exp:"振替株式の譲渡は意思表示のみでは効力を生じず、振替口座簿への記録（振替）が効力発生要件（社債株式振替法140条）。"},
{cat:"振替株式",q:"振替口座簿中の譲渡人の口座における保有欄に，譲渡人が有する振替株式の数を超過する振替 株式の数が誤って記録されていた場合でも，譲受人が譲渡人からその記録に係る全ての振替株式を 譲り受ける旨の合意をし，かつ，振替の申請により，譲受人の口座における保有欄にその譲渡に係 る数の増加の記録がされたときは，譲受人は，悪意又は重大な過失があるときを除き，その増加の 記録に係る権利を取得する。",ans:true,exp:"振替株式については善意取得制度が認められており（社債株式振替法144条）、悪意・重過失がなければ超過記録分も含めて権利を取得する。"},
{cat:"振替株式",q:"振替株式の質入れがあった場合には，総株主通知の際に，その振替株式の質入れの事実を会社 に知らせないようにすることはできない。",ans:true,exp:"振替株式の質入れは質権者の口座の質権欄への記録によって行われ、総株主通知において質入れの事実も会社に通知される（社債株式振替法151条）。質入れの事実を隠蔽することは制度上不可能。"},
{cat:"振替株式",q:"振替株式を発行した会社は，正当な理由があるときは，振替機関に対し，所定の費用を支払っ て，その備える振替口座簿中の加入者の口座に記録されている事項を証明した書面の交付を請求す ることができる。",ans:false,exp:"振替口座簿の記録内容の証明書交付請求ができるのは加入者等であり、発行会社が振替機関に対して加入者の口座情報の証明書交付を請求できるという規定はない。"},
{cat:"共有株式の権利行使者",q:"判例の趣旨によれば，権利行使者の指定及び通知がされている場合であっても，株主総会の決議事 項について，その株式の共有者の間に意見の相違が生じたときは，権利行使者として指定された者は， 自己の判断に基づいて議決権を行使することができない。",ans:false,exp:"権利行使者として指定・通知された者は、共有者間の意見の相違にかかわらず自己の判断に基づいて議決権を行使することができる（最判平成11年12月14日の趣旨）。"},
{cat:"共有株式の権利行使者",q:"共有に属する株式につき株主総会における議決権を行使する者については，株主総会の都度，権利 行使者の指定及び通知がされなければならない。",ans:false,exp:"権利行使者の指定・通知を株主総会のたびに行う必要はない。一度有効に指定・通知がされれば継続して権利行使者として扱うことができる。"},
{cat:"共有株式の権利行使者",q:"判例の趣旨によれば，権利行使者の指定及び通知を要する旨の会社法の規定は，民法の共有の規定 に対する特別の定めに当たる。",ans:true,exp:"判例（最判平成27年2月19日）は、会社法106条の規定は民法の共有規定に対する特別法として優先適用されるとする。"},
{cat:"共有株式の権利行使者",q:"判例の趣旨によれば，各共有者の持分の価格に従い，その過半数を有する株式の共有者は，権利行 使者の指定及び通知がされなければ，その株式会社の同意があっても，取締役選任決議の議決権を行 使することはできない。",ans:false,exp:"判例（最判平成27年2月19日）は、会社が同意した場合には権利行使者の指定・通知なしでも議決権行使を認めることができるとする。"},
{cat:"譲渡制限株式",q:"判例の趣旨によれば，株式を相続により共有するに至った共同相続人は，株主としての地位に基づ き株主総会決議不存在確認の訴えを提起する場合であっても，権利行使者の指定及び通知がされてい ないときは，特段の事情がない限り，原告適格を有しない。",ans:false,exp:"権利行使者の指定・通知がなくても共同相続人各自が株主総会決議不存在確認の訴えを提起できる。権利行使者指定制度は訴訟提起を制限するものではない。 第6問〜第10問：譲渡制限株式"},
{cat:"譲渡制限株式",q:"事前に株式会社の承認を得ることなくその発行する譲渡制限株式を取得した者は，当該株式会社に 対し，当該譲渡制限株式を取得したことについて承認をするか否かの決定をすることを請求する場合 に，その請求と併せて，当該株式会社が承認をしない旨の決定をするときには当該株式会社又は指定 買取人が当該譲渡制限株式を買い取ることも請求しなければならない。",ans:false,exp:"承認請求と買取請求は一緒に行う必要はなく、承認請求のみを行うことも可能（会社法137条1項）。"},
{cat:"譲渡制限株式",q:"判例の趣旨によれば，株券を発行する株式会社の株主が当該株式会社の事前の承認を得ることなく その発行する譲渡制限株式を譲渡する旨の合意をして株券を交付した場合には，当該譲渡は，当該株 式会社に対する関係では効力を生じないが，当事者間では有効である。",ans:true,exp:"判例は譲渡制限株式の無承認譲渡について相対的無効説をとり、当事者間では有効だが会社に対しては効力を生じないとする（最判昭和48年6月15日）。"},
{cat:"譲渡制限株式",q:"株式会社は，その発行する譲渡制限株式を相続により取得した者に対し，当該譲渡制限株式を当該 株式会社に売り渡すことを請求することができる旨を定款で定めることができる。",ans:true,exp:"会社法174条により、相続等の一般承継により譲渡制限株式を取得した者に対して売渡請求ができる旨を定款で定めることができる。"},
{cat:"譲渡制限株式",q:"譲渡制限株式を他人に譲渡しようとする株主がその株式会社に対して譲渡を承認するか否かの決 定をすることを請求した場合において，当該株式会社がその請求の日から２週間又は定款で定めたそ れより短い期間内に決定の内容を通知しなかったときは，当該株式会社は，当該株主との間に別段の 合意のない限り，譲渡を承認しない旨の決定をしたものとみなされる。",ans:false,exp:"会社が期間内に通知しなかった場合、承認をしたとみなされる（会社法145条1号）。「承認しない」とみなされるのではない。"},
{cat:"種類株式",q:"株式会社がある種類の株式の内容として譲渡による当該種類の株式の取得について当該株式会社 の承認を要することの定めを設ける定款の変更をする場合には，当該種類の株式を目的とする新株予 約権を有する新株予約権者は，当該株式会社に対し，自己の有する新株予約権を公正な価格で買い取 ることを請求することができる。",ans:true,exp:"当該種類の株式に譲渡制限を設ける定款変更をする場合、その株式を対象とする新株予約権を有する者には買取請求権が認められる（会社法118条1項2号）。 第11問〜第15問：種類株式"},
{cat:"種類株式",q:"会社法上の公開会社は，株主に対してその有する当該種類の株式の数にかかわらず同額の剰余金 の配当をすることを内容とする種類の株式を発行することはできない。",ans:true,exp:"均等配当種類株式（持株数にかかわらず同額を配当する株式）は会社法108条1項に列挙されておらず、公開会社では発行できない。"},
{cat:"種類株式",q:"会社法上の公開会社は，当該種類の株式の株主が１株につき複数個の議決権を有することを内容 とする種類の株式を発行することができる。",ans:false,exp:"複数議決権株式は公開会社では一株一議決権原則（会社法308条1項）との関係から認められていない。"},
{cat:"種類株式",q:"指名委員会等設置会社は，当該種類の株式の種類株主を構成員とする種類株主総会において取締 役を選任することを内容とする種類の株式を発行することができない。",ans:true,exp:"役員選任権付種類株式は指名委員会等設置会社では発行できない（会社法108条1項ただし書）。"},
{cat:"種類株式",q:"株主総会において決議をすることができる事項の全部につき議決権を行使することができない議 決権制限株式の株主であっても，当該種類の株式の種類株主を構成員とする種類株主総会においては， 議決権を有する。",ans:true,exp:"完全無議決権株式の株主であっても自己の種類株主総会においては議決権を有する（会社法111条1項・323条）。"},
{cat:"株主の権利・単元株",q:"定款で定めた各種類の株式の発行可能種類株式総数の合計数は，定款で定めた発行可能株式総数 と一致していなければならない。",ans:false,exp:"発行可能種類株式総数の合計は発行可能株式総数と一致する必要はない。 第16問〜第20問：株主の権利・単元株"},
{cat:"株主の権利・単元株",q:"株式会社は，株主に剰余金の配当を受ける権利及び残余財産の分配を受ける権利の全部を与えな い旨を定款で定めることができない。",ans:true,exp:"剰余金配当請求権と残余財産分配請求権の両方を全部与えないとする定款の定めは認められない（会社法105条2項）。"},
{cat:"株主の権利・単元株",q:"Ａ種株式を１０万株，Ｂ種株式を１０万株発行している種類株式発行会社は，Ａ種株式について は単元株式数を１００株，Ｂ種株式については単元株式数を１０００株とする旨を定款で定めること ができる。",ans:true,exp:"単元株式数は種類株式ごとに異なる数を定めることができる（会社法188条1項）。"},
{cat:"株主の権利・単元株",q:"株式が２以上の者の共有に属する場合において，共有者が，株式会社に対し，当該株式会社が株 主に対してする通知又は催告を受領する者１人の氏名又は名称を通知していないときは，当該株式会 社が株主に対してする通知又は催告は，当該共有者の全員に対してしなければならない。",ans:false,exp:"通知受領者が定められていない場合、会社は共有者のうちの1人に対して通知・催告をすれば足りる（会社法126条4項）。全員に対して行う必要はない。"},
{cat:"株主の権利・単元株",q:"株式会社は，単元未満株主が当該株式会社に対して単元未満株式の買取りの請求をすることがで きない旨を定款で定めることができない。",ans:true,exp:"単元未満株式の買取請求権（会社法192条）は定款で排除することができない。"},
{cat:"利益供与",q:"株式会社が株主に対してする通知又は催告が５年以上継続して到達しない場合において，当該株 主に対する通知又は催告をすることを要しないときは，当該株主に対する当該株式会社の義務の履行 を行う場所は，当該株式会社の住所地である。",ans:true,exp:"会社法196条2項"},
{cat:"利益供与",q:"判例によれば，会社から見て好ましくない株主が議決権を行使することを回避する目的で，会社 が，自己の計算において，第三者に対してその株主から株式を譲り受けるための対価を供与した場合 には，株主の権利の行使に関する利益の供与に該当する。",ans:true,exp:"判例（最判平成18年4月10日）により、会社が第三者を通じて問題株主の株式を買い取るために費用を負担する行為も利益供与に該当する。"},
{cat:"利益供与",q:"会社が，自己の計算において，特定の株主に対して無償で財産上の利益の供与をした場合には， その会社は，株主の権利の行使に関する利益の供与をしたものと推定される。",ans:true,exp:"会社法120条2項により、特定株主への無償の財産上の利益供与は株主権行使に関する利益供与と推定される。"},
{cat:"利益供与",q:"株主が，自己の計算において，株主総会における議決権の行使に関し，他の株主に対して財産上 の利益の供与をした場合には，株主の権利の行使に関する利益の供与に該当する。",ans:false,exp:"利益供与規制（会社法120条）は会社が行う供与を対象とする。株主間の利益供与は同条の対象外。"},
{cat:"利益供与",q:"取締役が株主の権利の行使に関する利益の供与をした場合には，その利益の供与をすることに関 与した他の取締役は，その職務を行うについて注意を怠ったかどうかにかかわらず，会社に対し，供 与した利益の価額に相当する額を支払う義務を負う。",ans:false,exp:"無過失責任は本人のみ"},
{cat:"譲渡制限株式（続き）",q:"会社から株主の権利の行使に関する利益の供与を受けた者が取締役，会計参与，監査役，執行役 又は会計監査人でない場合には，その者に対してその利益の返還を求める株主代表訴訟は，提起する ことができない。",ans:true,exp:"株主代表訴訟の対象は会社法847条1項所定の役員等に限られる。役員等でない第三者への利益返還請求は代表訴訟の対象外。 第26問〜第30問：譲渡制限株式（続き）"},
{cat:"譲渡制限株式（続き）",q:"会社が，定款を変更して，その発行する全部の株式の内容として，譲渡による当該株式の取得に ついて会社の承認を要する旨の定款の定めを設ける場合には，総株主の同意を得なければならない。",ans:true,exp:"全株式への譲渡制限設定は公開会社から非公開会社への転換であり、総株主の同意が必要（会社法111条1項）。"},
{cat:"譲渡制限株式（続き）",q:"会社は，その発行する一部の株式の内容として，譲渡による当該株式の取得について会社の承認 を要する旨の定款の定めを設けることはできない。",ans:false,exp:"種類株式として一部の株式にのみ譲渡制限を設けることは可能（会社法108条1項4号）。"},
{cat:"譲渡制限株式（続き）",q:"譲渡制限株式の株主が死亡した場合には，その相続人は，当該譲渡制限株式の取得について会社 の承認を得ない限り，会社に対し，株主の地位を主張することはできない。",ans:false,exp:"相続は一般承継であり、会社の承認なしに当然に株主の地位を取得する。"},
{cat:"譲渡制限株式（続き）",q:"判例の趣旨によれば，取締役会設置会社の唯一の株主がその保有する譲渡制限株式を他に譲渡し た場合には，取締役会の決議による承認がないときであっても，その譲渡は，当事者間だけではなく， 会社に対する関係においても，有効である。",ans:true,exp:"判例（最判昭和48年6月15日）により、一人会社では取締役会承認なしでも会社に対しても有効。"},
{cat:"株主の権利",q:"取締役会設置会社は，定款の定めにより，譲渡による株式の取得についての承認の決定を株主総 会の決議によるものとすることができる。",ans:true,exp:"定款の定めにより承認機関を株主総会とすることができる（会社法139条1項ただし書）。 第31問〜第35問：株主の権利"},
{cat:"株主の権利",q:"取得請求権付株式の株主は、当該取得請求権付株式と引換えに交付される金銭の額が分配可能額 を超えているときでも、株式会社に対し、当該取得請求権付株式を取得することを請求することがで きる。",ans:false,exp:"対価が金銭の場合、分配可能額がないときは取得請求ができない（会社法166条1項ただし書）。"},
{cat:"株主の権利",q:"単元未満株主は、定款に定めがなくても、株式会社に対し、当該株主が保有する単元未満株式の 数と併せて単元株式数となる数の株式を売り渡すことを請求することができる。",ans:false,exp:"単元未満株主が会社に対して不足数の株式の売渡しを請求できるのは定款に定めがある場合に限られる（会社法194条1項）。"},
{cat:"株主の権利",q:"株主総会において決議事項の全部について議決権を行使することができない株主は、当該株主総 会について提出された議決権行使書面の閲覧又は謄写をすることができない。",ans:false,exp:"議決権行使書面の閲覧・謄写請求権（会社法311条4項）は議決権の有無にかかわらず株主に認められる。"},
{cat:"株主の権利",q:"会社法上の公開会社において、募集株式の引受人が株主となることによって有することとなる議 決権の数が総株主の議決権の数の２分の１を超える場合において、総株主の議決権の１０分の１以上 の議決権を有する株主が当該引受人による募集株式の引受けに反対したときは、当該公開会社は、当 該引受人に対する募集株式の割当てについて、株主総会の特別決議による承認を受けなければならな い。",ans:false,exp:"支配株主の異動を伴う第三者割当て（会社法206条の2）では、10分の1以上の株主が反対したときは株主総会の普通決議による承認が必要。特別決議ではない。"},
{cat:"自己株式",q:"監査役設置会社の株主は、その権利を行使するため必要があるときは、裁判所の許可を得て、取 締役会議事録の閲覧又は謄写をすることができる。",ans:true,exp:"監査役設置会社において株主が取締役会議事録を閲覧・謄写するには裁判所の許可が必要（会社法371条3項）。 第36問〜第40問：自己株式"},
{cat:"自己株式",q:"株式会社は，自己株式について，株主総会における議決権を有しない。",ans:true,exp:"自己株式には議決権がない（会社法308条2項）。"},
{cat:"自己株式",q:"株式会社は，自己株式について，剰余金の配当をすることができない。",ans:true,exp:"自己株式には剰余金配当請求権がない（会社法453条）。"},
{cat:"自己株式",q:"株式会社は，自己株式の取得価額を貸借対照表の資産の部に計上しなければならない。",ans:false,exp:"自己株式は純資産の部の控除項目として計上される。資産の部には計上できない。"},
{cat:"自己株式",q:"自己株式を消却することにより，資本金の額は，減少する。",ans:false,exp:"自己株式の消却により減少するのは発行済株式総数であり、資本金の額は減少しない。"},
{cat:"株式の分割と株式無償割当て",q:"自己株式を消却することにより，発行可能株式総数は，減少する。",ans:false,exp:"自己株式の消却により発行可能株式総数は減少しない。発行済株式総数のみが減少する。 第41問〜第45問：株式の分割と株式無償割当て"},
{cat:"株式の分割と株式無償割当て",q:"株式の分割により自己株式も分割され得るが，自己株式に対し株式無償割当てをすることはでき ない。",ans:true,exp:"株式の分割は自己株式にも適用されるが（会社法183条2項）、株式無償割当ては株主に対して行うものであり自己株式への割当ては認められない（会社法186条2項）。"},
{cat:"株式の分割と株式無償割当て",q:"株式の分割により１株に満たない端数が生じ得るが，株式無償割当てにより１株に満たない端数 が生ずることはない。",ans:false,exp:"株式無償割当てでも、割当比率によっては1株未満の端数が生じる場合がある。"},
{cat:"株式の分割と株式無償割当て",q:"株式の分割により株主の有する株式と異なる種類の株式をその株主に取得させることはできない が，株式無償割当てにより株主の有する株式と異なる種類の株式をその株主に取得させることはでき る。",ans:true,exp:"株式の分割は同一種類の株式を増加させるものであり異なる種類の株式を割り当てることはできない（会社法183条1項）。株式無償割当ては異なる種類の株式を割り当てることができる（会社法185条）。"},
{cat:"株式の分割と株式無償割当て",q:"株式の分割の場合には，現に２以上の種類の株式を発行していない限り，株主総会の決議によら ないで発行可能株式総数を増加する定款変更をすることができるが，株式無償割当ての場合には，株 主総会の決議によらなければ発行可能株式総数を増加する定款変更をすることはできない。",ans:true,exp:"株式の分割に伴う発行可能株式総数の増加は種類株式を発行していない場合に取締役会決議のみで可能（会社法184条2項）。株式無償割当てにはこのような特則がなく、定款変更には株主総会決議が必要。"},
{cat:"株主の権利（判例）",q:"株式の分割により自己株式を株主に取得させることはできないが，株式無償割当てにより自己株 式を株主に取得させることはできる。",ans:true,exp:"株式無償割当ては自己株式の処分によって行うことができる（会社法186条1項）。株式の分割では自己株式を株主に交付するものではない。 第46問〜第50問：株主の権利（判例）"},
{cat:"株主の権利（判例）",q:"基準日前に株式の譲渡があった場合には，会社側においては，株主名簿の名義書換が何らかの都 合でされていなくとも，当該譲渡を認め，基準日が定められた権利を譲受人に行使させることができ る。",ans:false,exp:"基準日制度において、会社は基準日の株主名簿上の株主を権利行使者とすることができ（会社法124条1項）、名義書換されていない譲受人を権利行使者とすることは制度の趣旨に反する。"},
{cat:"株主の権利（判例）",q:"株式会社の株主が，当該株式会社の業務及び財産の状況を調査させるため，裁判所に検査役選任 の申立てをした時点で，当該申立てをするために必要な持株要件を満たしていたとしても， その後， 当該株式会社が新株を発行したことにより，当該株主が当該持株要件を満たさないものとなった場合 には，特段の事情のない限り，当該申立ては，申立人の適格を欠くものとして 不適法となる。",ans:true,exp:"判例（最判昭和43年12月25日の趣旨）は、申立て後に持株要件を欠くこととなった場合には原則として不適法になるとする。"},
{cat:"株主の権利（判例）",q:"株式会社の会計帳簿の閲覧の請求をする株主は，当該請求の理由を明らかにし，かつ，当該請求 の理由を基礎付ける事実が客観的に存在することを立証しなければならない。",ans:false,exp:"会計帳簿閲覧請求（会社法433条）において株主は理由を明らかにすれば足り、その理由を基礎付ける事実が客観的に存在することまで立証する義務はない（最判平成16年7月1日）。"},
{cat:"株主の権利（判例）",q:"株式会社の会計帳簿の閲覧の請求をした株主が当該株式会社の業務と実質的に競争関係にある事 業を営む場合には，当該株式会社は，当該株主に会計帳簿の閲覧によって知り得る情報を自己の事業 に利用するなどの主観的意図がないときであっても，当該請求を拒むことができる。",ans:true,exp:"会社法433条2項1号は競業者であることを会計帳簿閲覧拒絶事由として規定しており、主観的意図の有無にかかわらず拒絶できる。"},
{cat:"譲渡制限株式の取得",q:"株主の提起した株主総会の決議の取消しの訴えの係属中当該株主が死亡した場合には，相続によ り株式を取得した相続人はその訴訟の原告たる地位を承継せず，その訴訟は当然に終了する。",ans:false,exp:"決議取消しの訴えは一身専属的な権利ではなく、相続人が原告たる地位を承継する（最判昭和45年7月15日）。 第51問〜第55問：譲渡制限株式の取得"},
{cat:"譲渡制限株式の取得",q:"譲渡制限株式に関しては，相続その他の一般承継による当該株式の取得について取締役会の承認 を要する旨を定款で定めることができる。",ans:false,exp:"一般承継による取得に対しては承認規制を設けることができない。会社法174条により売渡請求の定款規定は可能だが、承認を要するとする定款規定は認められない。"},
{cat:"譲渡制限株式の取得",q:"譲渡制限株式に関しては，当該株式を従業員以外の者に譲渡する場合に限り，取締役会の承認を 要する旨を定款で定めることができる。",ans:false,exp:"特定の相手方への譲渡に限定する形での承認制度は会社法上認められていない。"},
{cat:"譲渡制限株式の取得",q:"判例の趣旨によれば，いわゆる一人会社であっても，取締役会の承認がない限り，譲渡制限株式 の譲渡は，会社に対し，その効力を有しない。",ans:false,exp:"判例（最判昭和48年6月15日）により、一人会社では取締役会承認なしでも会社に対して有効。"},
{cat:"譲渡制限株式の取得",q:"取締役会の承認を得ないで譲渡制限株式が譲渡された場合には，当該株式の譲受人は，当該株式 の取得について取締役会の承認を求めることができない。",ans:false,exp:"会社法137条1項により、譲受人も承認請求をすることができる。"},
{cat:"株式の譲渡・名義書換",q:"取締役会が譲渡制限株式の取得について承認をしない旨の決定をし，会社が当該株式を買い取り， 又は当該株式を買い取る者（以下「指定買取人」という。）を指定しなければならないときは，当該会 社は，当該株式の一部について買い取り，残りについて指定買取人を指定することができる。",ans:true,exp:"会社は株式の一部を自社で買い取り、残りについて指定買取人を指定するという組み合わせが認められている（会社法140条1項・4項）。 第56問〜第60問：株式の譲渡・名義書換"},
{cat:"株式の譲渡・名義書換",q:"判例の趣旨によれば，株式を譲り受けた株式取得者が株主名簿の名義書換の請求をしたにもかか わらず，株式会社が正当な事由なく当該請求に応じなかったときは，当該株式会社は, 株主名簿の名 義書換がないことを理由として，株式の譲渡を否定することができず，当該株式取得者を株主として 取り扱わなければならない。",ans:true,exp:"判例（最判昭和41年7月28日）により、正当な理由なく名義書換を拒んだ会社は名義書換未了を対抗できない。"},
{cat:"株式の譲渡・名義書換",q:"判例の趣旨によれば，株券発行会社の株式について，株式会社が定めた剰余金の配当の基準日よ り前に株券が交付されて譲渡されたが，当該基準日までに株主名簿の名義書換の請求がされなかった ときは，株主名簿上の株主である譲渡人が適法に配当金を受領することができ，譲渡人は, 譲受人に 対し，受領した配当金相当額の金員について不当利得返還義務を負わない。",ans:true,exp:"判例（最判昭和37年4月20日）により、名義書換前の譲渡人による配当受領は法律上の原因があり不当利得にはならない。"},
{cat:"株式の譲渡・名義書換",q:"相続により譲渡制限株式を取得した株式取得者が株式会社に対し，株主名簿の名義書換の請求を するには，当該譲渡制限株式を取得したことについて当該株式会社の承認を受けていなければならな い。",ans:false,exp:"相続による取得は一般承継であり、会社の承認なしで名義書換請求ができる（会社法134条4号参照）。"},
{cat:"株式の譲渡・名義書換",q:"振替株式は，株券発行会社でない株式会社の株式であるから，振替株式の譲渡は，当事者間にお いては，意思表示のみによって，その効力を生ずる。",ans:false,exp:"振替株式の譲渡は意思表示のみでは効力を生じず、振替口座簿への増加記録が効力発生要件（社債株式振替法140条）。"},
{cat:"新株発行の無効原因",q:"振替株式に係る株主名簿の名義書換は，振替機関から株式会社に対してされる総株主通知に基づ いて行われる。",ans:true,exp:"振替株式の株主名簿名義書換は振替機関からの総株主通知に基づいて行われる（社債株式振替法151条）。 第61問〜第65問：新株発行の無効原因"},
{cat:"新株発行の無効原因",q:"募集株式を引き受ける者に特に有利な払込金額による募集株式の発行が株主総会の特別決議を経 ないでされたことは，無効原因とならない。",ans:false,exp:"有利発行を株主総会の特別決議を経ないで行うことは無効原因となる（最判平成6年7月14日）。"},
{cat:"新株発行の無効原因",q:"募集事項の株主に対する通知又は公告のいずれも欠いたことは，無効原因とならない。",ans:false,exp:"判例（最判平成9年1月28日）は、通知・公告のいずれも欠いた場合は無効原因となるとする（差止めが許容されない場合を除く）。"},
{cat:"新株発行の無効原因",q:"募集株式の発行が著しく不公正な方法によってされたことは，無効原因とならない。",ans:true,exp:"判例（最判昭和46年7月16日）は、著しく不公正な方法による発行は差止請求の対象となるが、既に発行された場合の無効原因にはならないとする。"},
{cat:"新株発行の無効原因",q:"募集株式の発行に必要とされる取締役会の決議を経ていないことは，無効原因とならない。",ans:true,exp:"判例は、取締役会決議を欠く新株発行であっても公開会社では無効原因にならないとする（最判昭和36年3月31日）。"},
{cat:"公開会社における募集株式の発行",q:"募集株式の発行差止請求訴訟を本案とする募集株式の発行の差止めの仮処分命令があるにもかか わらずその仮処分命令に違反して募集株式の発行がされたことは, 無効原因とならない。",ans:false,exp:"仮処分命令に違反した新株発行は無効原因となる（最判平成5年12月16日）。 第66問〜第70問：公開会社における募集株式の発行"},
{cat:"公開会社における募集株式の発行",q:"判例の趣旨によれば，募集事項の株主に対する通知又は公告をいずれも欠いたことは，募集株式 の発行差止請求をしたとしても差止めの事由がないためにこれが許容されないと認められる場合でな い限り，募集株式の発行の無効原因となる。",ans:true,exp:"判例（最判平成9年1月28日）の立場。通知・公告のいずれも欠いた場合は差止めが許容されない場合を除き無効原因となる。"},
{cat:"公開会社における募集株式の発行",q:"募集に係る株式の発行が，法令又は定款に違反しない場合であっても，著しく不公正な方法によ り行われる場合において，株主が不利益を受けるおそれがあるときは，株主は，株式会社に対し，当 該株式の発行をやめることを請求することができる。",ans:true,exp:"会社法210条2号により、著しく不公正な方法による発行に対して差止請求ができる。"},
{cat:"公開会社における募集株式の発行",q:"株式会社が株主に株式の割当てを受ける権利を与える場合には，株主は，募集株式の引受けの申 込みをしなくても，募集株式の引受人となる。",ans:false,exp:"株主割当ての場合でも株主は申込みをしなければ引受人とはならない（会社法202条4項）。"},
{cat:"公開会社における募集株式の発行",q:"募集株式の引受人は，募集株式の払込金額の払込みをする債務と株式会社に対する債権とを相殺 することができない。",ans:true,exp:"払込債務と会社に対する債権の相殺は禁止されている（会社法208条3項）。"},
{cat:"現物出資と検査役調査",q:"募集株式の引受人が募集株式の払込金額の払込みを仮装した場合には，当該払込みの仮装に関す る職務を行った取締役（当該払込みを仮装したものを除く。）は，その職務を行うについて注意を怠ら なかったことを証明したときであっても，株式会社に対し，払込みを仮装した払込金額の支払をする 義務を負う。",ans:false,exp:"会社法213条の3"},
{cat:"現物出資と検査役調査",q:"当該株式会社が募集株式の引受人に割り当てる株式の総数が５００株である場合には，当該募集 株式の引受人が給付する現物出資財産の価額に関する検査役の調査は不要である。",ans:true,exp:"引受人が割当てを受ける株式数が発行済株式総数の10分の1以下である場合、検査役調査は不要（会社法207条9項2号）。500株÷5000株＝10分の1であり要件を満たす。"},
{cat:"現物出資と検査役調査",q:"当該株式会社が現物出資財産について定めた価額の総額が５００万円である場合には，当該現物 出資財産の価額に関する検査役の調査は不要である。",ans:true,exp:"現物出資財産の価額の総額が500万円以下の場合は検査役調査が不要（会社法207条9項1号）。"},
{cat:"現物出資と検査役調査",q:"当該株式会社から１０００株の割当てを受けた募集株式の引受人が，現物出資財産として，その 価額が１０００万円と定められた市場価格のある有価証券を給付する場合において，法務省令で定め る方法により算定される当該有価証券の市場価格も１０００万円であるときは，当該有価証券につい ての現物出資財産の価額に関する検査役の調査は不要である。",ans:true,exp:"市場価格のある有価証券で定められた価額が市場価格以下である場合は検査役調査が不要（会社法207条9項3号）。定められた価額＝市場価格なので要件を満たす。"},
{cat:"現物出資と検査役調査",q:"当該株式会社から１０００株の割当てを受けた募集株式の引受人が，現物出資財産として，その 価額が１０００万円と定められた不動産を給付する場合において，当該価額が相当であることについ て税理士の証明を受けたときは，当該証明を受けた当該不動産についての現物出資財産の価額に関す る検査役の調査は不要である。",ans:false,exp:"不動産については不動産鑑定士の鑑定評価が必要（会社法207条9項4号・会社法施行規則43条）。税理士の証明では足りない。"},
{cat:"資本金・発行済株式総数",q:"当該株式会社から１０００株の割当てを受けた募集株式の引受人が，現物出資財産として，当該 株式会社に対する弁済期が到来していない金銭債権を給付する場合において，当該金銭債権について 定められた価額と当該金銭債権に係る負債の帳簿価額とがいずれも１０００万円であるときは，当該 金銭債権についての現物出資財産の価額に関する検査役の調査は不要である。",ans:true,exp:"弁済期未到来の金銭債権で定められた価額が帳簿価額以下の場合は検査役調査が不要（会社法207条9項5号）。本問では両者が一致しているので要件を満たす。 第76問〜第80問：資本金・発行済株式総数"},
{cat:"資本金・発行済株式総数",q:"株式会社が自己株式を消却することにより，発行済株式の総数は減少するが，資本金の額は減少 しない。",ans:true,exp:"自己株式の消却は発行済株式総数を減少させるが、資本金の額には影響しない（会社法178条）。"},
{cat:"資本金・発行済株式総数",q:"株式会社が株式の併合をすることにより，発行済株式の総数は減少するが，資本金の額は減少し ない。",ans:true,exp:"株式の併合は発行済株式総数を減少させるが、資本金の額は変動しない（会社法180条）。"},
{cat:"資本金・発行済株式総数",q:"株式会社がその処分する自己株式を引き受ける者の募集をし，自己株式を処分することにより， 発行済株式の総数は増加しないが，資本金の額は増加する。",ans:false,exp:"自己株式の処分により発行済株式総数は増加せず、資本金が増加するかどうかは会計処理による。「資本金の額は増加する」という断定は誤り。"},
{cat:"資本金・発行済株式総数",q:"資本金の額は，株式会社の業績と連動して増加し，又は減少する。",ans:false,exp:"資本金の額は業績と連動しない。利益・損失は剰余金・欠損として処理され、資本金は法定の手続によってのみ変動する。"},
{cat:"剰余金の配当規制",q:"発行済株式の総数が増加し，又は減少した場合には，変更の登記をしなければならない。",ans:true,exp:"発行済株式総数は登記事項であり（会社法911条3項6号）、変動があれば変更登記が必要（会社法915条1項）。 第81問〜第85問：剰余金の配当規制"},
{cat:"剰余金の配当規制",q:"会計監査人設置会社である監査役会設置会社であって取締役の任期が選任後１年以内に終了する 事業年度のうち最終のものに関する定時株主総会の終結の時までである株式会社は、金銭による剰余 金の配当について取締役会が定めることができる旨を定款で定めることができる。",ans:true,exp:"取締役会配当の制度（会社法459条1項）。会計監査人設置会社かつ監査役会設置会社で取締役任期が1年以内の場合に、定款の定めにより取締役会が金銭配当を決定できる。"},
{cat:"剰余金の配当規制",q:"株式会社は、株主に金銭以外の財産を配当する場合には、株主総会の特別決議により、当該配当 財産に代えて金銭を交付することを当該株式会社に対して請求する権利を株主に与える旨を定めなけ ればならない。",ans:false,exp:"現物配当の場合、金銭交付請求権を株主に与えることは任意であり（会社法454条4項2号）、必ず定めなければならないわけではない。"},
{cat:"剰余金の配当規制",q:"株式会社が剰余金の配当をする場合には、当該配当により減少する剰余金の額に１０分の１を乗 じて得た額を準備金として計上しなければならないものの、配当を行った日における準備金の額が資 本金の額の４分の１以上であるときは、これを計上する必要はない。",ans:true,exp:"配当に伴う準備金積立義務（会社法445条4項）は、準備金の額が資本金の4分の1に達するまで義務付けられる。既に4分の1以上であれば積立不要。"},
{cat:"剰余金の配当規制",q:"株式会社が分配可能額を超えて剰余金の配当を行ったときは、当該配当に関する職務を行った業 務執行者は、当該株式会社に対し、連帯して、当該配当を受けた者が交付を受けた金銭等の帳簿価額 に相当する金銭を支払う義務を負い、その職務を行うについて注意を怠らなかった ことを証明してもその義務を免れない。",ans:false,exp:"会社法462条2項により、業務執行者は注意を怠らなかったことを証明したときは義務を負わない（過失責任）。"},
{cat:"スクイーズアウト",q:"株式会社が株主に剰余金の配当を行った場合において、配当を行った日の属する事業年度に係る 計算書類の承認を受けた時において欠損が生じたときは、当該分配に関する職務を行った業務執行者 は、当該株式会社に対し、連帯して、欠損の額を支払う義務を負うものの、定時株主総会の決議によ って剰余金の配当を行った場合には、その義務を負わない。",ans:true,exp:"欠損填補責任（会社法465条）は規定されているが、定時株主総会の決議に基づく配当については免責規定がある（会社法465条2項）。 第86問〜第90問：スクイーズアウト"},
{cat:"スクイーズアウト",q:"株式の併合、全部取得条項付種類株式の取得及び特別支配株主の株式等売渡請求のいずれの手法 を用いる場合も、Ａ社において株主総会の特別決議が必要である。",ans:false,exp:"特別支配株主の株式等売渡請求（会社法179条以下）は対象会社の株主総会決議を不要とすることが制度の特色。株式の併合・全部取得条項付種類株式は株主総会特別決議が必要。"},
{cat:"スクイーズアウト",q:"株式の併合又は全部取得条項付種類株式の取得の手法を用いる場合において、一株に満たない端 数の処理として、その端数の合計数に相当する数の株式を裁判所の許可を得て競売以外の方法により 売却するためには、Ａ社の取締役の全員の同意を得る必要がある。",ans:false,exp:"競売以外の方法による売却に必要なのは裁判所の許可（会社法234条2項）。取締役全員の同意は要件とされていない。"},
{cat:"スクイーズアウト",q:"特別支配株主の株式等売渡請求の手法を用いる場合には、Ａ社の新株予約権についても売り渡す ことを請求することができるが、株式の併合又は全部取得条項付種類株式の取得の手法を用いる場合 には、Ａ社の新株予約権に取得条項が定められていない限り、その新株予約権を当然には取得するこ とができない。",ans:true,exp:"特別支配株主は株式等売渡請求において新株予約権売渡請求もできる（会社法179条の2第1項2号）。株式の併合・全部取得条項付種類株式では新株予約権は当然には対象にならない。"},
{cat:"スクイーズアウト",q:"Ｂ社がＡ社の総株主の議決権の１０分の７を有し、Ｄ株式会社（Ｂ社がその総株主の議決権の３ 分の２を有している。）がＡ社の総株主の議決権の１０分の２を有しているときは、Ｂ社は、特別支配 株主の株式等売渡請求の手法を用いることができる。",ans:true,exp:"B社が10分の7、B社が3分の2以上の議決権を持つD社がA社の10分の2を保有するため合算が可能。合計10分の9以上となりB社は特別支配株主に該当する（会社法179条1項）。"},
{cat:"訴訟・非訟の区別",q:"Ｂ社は、Ａ社との間で株式交換契約を締結し、Ｃらに対価として金銭又はＢ社の株式を交付する ことによって、Ｃらの有するＡ社の株式を取得することができる。",ans:true,exp:"株式交換では対価として金銭または株式交換完全親会社の株式を交付することができる（会社法768条1項2号・3号）。 第91問〜第95問：訴訟・非訟の区別"},
{cat:"訴訟・非訟の区別",q:"株式の発行の差止めは，非訟事件の手続による。",ans:false,exp:"株式発行差止めは仮処分（訴訟手続）であり、非訟事件手続ではない（会社法210条）。"},
{cat:"訴訟・非訟の区別",q:"株式交換において反対株主による株式買取請求権が行使された場合の買取価格決定は，非訟事件の手続による。",ans:true,exp:"買取価格の決定は当事者間の協議がまとまらない場合に裁判所に申立てをする非訟事件（会社法786条2項）。"},
{cat:"訴訟・非訟の区別",q:"自己株式の処分の無効は，非訟事件の手続による。",ans:false,exp:"自己株式の処分の無効は訴えによってのみ主張でき（会社法828条1項2号）、訴訟手続による。"},
{cat:"訴訟・非訟の区別",q:"株主総会の招集手続等に関する検査役の選任は，非訟事件の手続による。",ans:true,exp:"検査役の選任は裁判所への申立てによる非訟事件（会社法306条1項）。"},
{cat:"訴訟・非訟の区別",q:"株式会社の取締役の解任は，非訟事件の手続による。",ans:false,exp:"取締役の解任の訴えは訴訟手続による（会社法854条）。 第96問〜第100問：吸収合併・事業譲渡"},
{cat:"吸収合併・事業譲渡",q:"吸収合併及び事業譲渡は、いずれも、株主総会の決議によって吸収合併契約又は事業譲渡契約の 承認を受けることを要しない場合がある。",ans:true,exp:"吸収合併では略式合併・簡易合併により、事業譲渡では簡易事業譲渡により株主総会決議が不要な場合がある。"},
{cat:"吸収合併・事業譲渡",q:"吸収合併の場合には、消滅会社はそれによって当然に解散し、事業の全部の譲渡の場合にも、譲 渡会社はそれによって当然に解散する。",ans:false,exp:"吸収合併では消滅会社は当然に解散するが（会社法471条4号）、事業の全部の譲渡では譲渡会社は当然には解散しない。"},
{cat:"吸収合併・事業譲渡",q:"吸収合併及び事業譲渡は、いずれも、訴えによらなければその無効を主張することができない。",ans:false,exp:"事業譲渡の無効は通常の契約の無効として処理されるため、訴えによらなくても主張することができる。"},
{cat:"吸収合併・事業譲渡",q:"吸収合併及び事業譲渡は、いずれも、吸収合併契約又は事業譲渡契約において、会社法所定の事 項を定めなければならない。",ans:true,exp:"吸収合併契約（会社法749条）および事業譲渡のいずれも会社法所定の事項を定めることが求められる。"},
{cat:"吸収合併・事業譲渡",q:"吸収合併及び事業譲渡は、いずれも、合併対価又は譲渡される事業の対価として交付される 財産の種類は金銭に限定されない。",ans:true,exp:"吸収合併の対価は存続会社の株式・社債・金銭等様々なものが認められる（会社法749条1項2号以下）。事業譲渡の対価も契約自由の原則により金銭以外の財産も可能。"},
,
{cat:"公開会社の株式",q:"株式会社は、ある種類の株式の株主が当該種類の株式１株につき複数個の議決権を有することを内容とする種類の株式を発行することができる。",ans:false,exp:"公開会社では1株につき複数の議決権を付与する複数議決権株式は会社法上認められていない（108条1項限定列挙）。会社法が定める種類株式の内容は限定列挙であり、複数議決権株式は含まれない。"},
{cat:"公開会社の株式",q:"株式会社は、定款を変更して発行可能株式総数についての定めを廃止することができない。",ans:true,exp:"発行可能株式総数は定款の絶対的記載事項（27条4号）であり、廃止する定款変更は不可能。"},
{cat:"公開会社の株式",q:"株式会社は、定款を変更して発行可能株式総数を減少する場合には、変更後の発行可能株式総数を当該定款の変更が効力を生じた時における発行済株式の総数未満とすることができる。",ans:false,exp:"変更後の発行可能株式総数は効力発生時の発行済株式総数を下回ることができない（113条1項）。「発行済株式総数未満とすることができる」は誤り。"},
{cat:"公開会社の株式",q:"株式会社は、定款を変更して発行可能株式総数を増加する場合には、変更後の発行可能株式総数を当該定款の変更が効力を生じた時における発行済株式の総数の４倍以下としなければならない。",ans:true,exp:"公開会社が発行可能株式総数を増加する定款変更をする場合、変更後は効力発生時の発行済株式総数の4倍を超えることができない（113条3項）。"},
{cat:"公開会社の株式",q:"株券発行会社は、単元未満株式に係る株券を発行しないことができる旨を定款で定めることができない。",ans:false,exp:"株券発行会社は単元未満株式に係る株券を発行しない旨を定款で定めることができる（189条3項）。よって「定めることができない」は誤り。"},
{cat:"共有株式の権利行使者",q:"判例の趣旨によれば、権利行使者の指定及び通知がされている場合であっても、株主総会の決議事項について、その株式の共有者の間に意見の相違が生じたときは、権利行使者として指定された者は、自己の判断に基づいて議決権を行使することができない。",ans:false,exp:"判例（最判平成9年1月28日の趣旨）によれば、権利行使者として指定・通知された者は、共有者間に意見の相違があっても自己の判断で議決権を行使できる。"},
{cat:"共有株式の権利行使者",q:"共有に属する株式につき株主総会における議決権を行使する者については、株主総会の都度、権利行使者の指定及び通知がされなければならない。",ans:false,exp:"権利行使者の指定・通知は都度行う必要はなく、一度指定・通知された権利行使者は継続的に権利を行使できると解されている（106条参照）。"},
{cat:"共有株式の権利行使者",q:"判例の趣旨によれば、権利行使者の指定及び通知を要する旨の会社法の規定は、民法の共有の規定に対する特別の定めに当たる。",ans:true,exp:"最判平成9年1月28日は、会社法106条が民法の共有規定（249条以下）の特別規定に当たると判示している。"},
{cat:"共有株式の権利行使者",q:"判例の趣旨によれば、各共有者の持分の価格に従い、その過半数を有する株式の共有者は、権利行使者の指定及び通知がされなければ、その株式会社の同意があっても、取締役選任決議の議決権を行使することはできない。",ans:false,exp:"判例（最判平成9年1月28日）によれば、会社の同意があれば、権利行使者の指定・通知なしに共有者が議決権を行使することが許容される場合がある。"},
{cat:"共有株式の権利行使者",q:"判例の趣旨によれば、株式を相続により共有するに至った共同相続人は、株主としての地位に基づき株主総会決議不存在確認の訴えを提起する場合であっても、権利行使者の指定及び通知がされていないときは、特段の事情がない限り、原告適格を有しない。",ans:false,exp:"共同相続人が株主総会決議不存在確認の訴えを提起する場合、権利行使者の指定・通知がなくても各共同相続人が単独で原告適格を有する（株主権の確認は保存行為に類する）。"},
{cat:"譲渡制限株式",q:"事前に株式会社の承認を得ることなくその発行する譲渡制限株式を取得した者は、当該株式会社に対し、当該譲渡制限株式を取得したことについて承認をするか否かの決定をすることを請求する場合に、その請求と併せて、当該株式会社が承認をしない旨の決定をするときには当該株式会社又は指定買取人が当該譲渡制限株式を買い取ることも請求しなければならない。",ans:false,exp:"会社法138条2号ハは、会社に買い取ることを請求する「ときは、その旨」と規定しており、買取請求は任意であって承認請求と同時に行う義務はない。"},
{cat:"譲渡制限株式",q:"判例の趣旨によれば、株券を発行する株式会社の株主が当該株式会社の事前の承認を得ることなくその発行する譲渡制限株式を譲渡する旨の合意をして株券を交付した場合には、当該譲渡は、当該株式会社に対する関係では効力を生じないが、当事者間では有効である。",ans:true,exp:"最判昭和48年6月15日は、譲渡制限株式の無承認譲渡は当事者間では有効だが会社に対する関係では効力を生じないという相対的無効説をとる。"},
{cat:"譲渡制限株式",q:"株式会社は、その発行する譲渡制限株式を相続により取得した者に対し、当該譲渡制限株式を当該株式会社に売り渡すことを請求することができる旨を定款で定めることができる。",ans:true,exp:"会社法174条により、相続等の一般承継により譲渡制限株式を取得した者に対して売渡請求できる旨を定款で定めることができる。"},
{cat:"譲渡制限株式",q:"譲渡制限株式を他人に譲渡しようとする株主がその株式会社に対して譲渡を承認するか否かの決定をすることを請求した場合において、当該株式会社がその請求の日から２週間又は定款で定めたそれより短い期間内に決定の内容を通知しなかったときは、当該株式会社は、当該株主との間に別段の合意のない限り、譲渡を承認しない旨の決定をしたものとみなされる。",ans:false,exp:"145条1号により、会社が2週間以内に通知しなかったときは「譲渡を承認した」とみなされる。「承認しない旨の決定をした」とみなされるは逆であり誤り。"},
{cat:"譲渡制限株式",q:"株式会社がある種類の株式の内容として譲渡による当該種類の株式の取得について当該株式会社の承認を要することの定めを設ける定款の変更をする場合には、当該種類の株式を目的とする新株予約権を有する新株予約権者は、当該株式会社に対し、自己の有する新株予約権を公正な価格で買い取ることを請求することができる。",ans:true,exp:"会社法118条1項により、譲渡制限を設ける定款変更をする場合、当該種類株式を目的とする新株予約権者は公正価格による買取請求権を有する。"},
{cat:"種類株式",q:"会社法上の公開会社は、株主に対してその有する当該種類の株式の数にかかわらず同額の剰余金の配当をすることを内容とする種類の株式を発行することはできない。",ans:true,exp:"持株数にかかわらず同額の剰余金配当を内容とする種類株式は108条1項に列挙されておらず、株主平等原則（109条）に反するため発行できない。"},
{cat:"種類株式",q:"会社法上の公開会社は、当該種類の株式の株主が１株につき複数個の議決権を有することを内容とする種類の株式を発行することができる。",ans:false,exp:"公開会社では1株につき複数の議決権を付与する種類株式は認められていない。複数議決権株式は会社法が認める種類株式の類型に含まれない。"},
{cat:"種類株式",q:"指名委員会等設置会社は、当該種類の株式の種類株主を構成員とする種類株主総会において取締役を選任することを内容とする種類の株式を発行することができない。",ans:true,exp:"取締役選任権付種類株式は指名委員会等設置会社・監査等委員会設置会社では発行できない（108条1項8号但書）。"},
{cat:"種類株式",q:"株主総会において決議をすることができる事項の全部につき議決権を行使することができない議決権制限株式の株主であっても、当該種類の株式の種類株主を構成員とする種類株主総会においては、議決権を有する。",ans:true,exp:"議決権制限株式の株主であっても自己の種類株主総会においては議決権を有する（325条・108条1項3号参照）。種類株主総会はその種類株主による自治的決定の場であり、制限なく議決権が認められる。"},
{cat:"種類株式",q:"定款で定めた各種類の株式の発行可能種類株式総数の合計数は、定款で定めた発行可能株式総数と一致していなければならない。",ans:false,exp:"各種類の発行可能種類株式総数の合計と発行可能株式総数は一致しなくてもよい（114条1項はその一致を要求していない）。"},
{cat:"株主の権利・単元株",q:"株式会社は、株主に剰余金の配当を受ける権利及び残余財産の分配を受ける権利の全部を与えない旨を定款で定めることができない。",ans:false,exp:"105条2項により、剰余金配当請求権と残余財産分配請求権の双方を全部与えないとする定款の定めは効力を有しない。「定めることができない」という記述自体は正しく、誤りではない。"},
{cat:"株主の権利・単元株",q:"Ａ種株式を１０万株、Ｂ種株式を１０万株発行している種類株式発行会社は、Ａ種株式については単元株式数を１００株、Ｂ種株式については単元株式数を１０００株とする旨を定款で定めることができる。",ans:true,exp:"会社法188条2項は、単元株式数は株式の種類ごとに定めることができると規定する。A種・B種それぞれ異なる単元株式数を定めることは可能。"},
{cat:"株主の権利・単元株",q:"株式が２以上の者の共有に属する場合において、共有者が、株式会社に対し、当該株式会社が株主に対してする通知又は催告を受領する者１人の氏名又は名称を通知していないときは、当該株式会社が株主に対してする通知又は催告は、当該共有者の全員に対してしなければならない。",ans:false,exp:"会社法126条3項は、通知等を受領する者の通知がない場合、共有者の一人に対してすれば足りると規定する（選択的通知）。全員に対してする必要はない。"},
{cat:"株主の権利・単元株",q:"株式会社は、単元未満株主が当該株式会社に対して単元未満株式の買取りの請求をすることができない旨を定款で定めることができない。",ans:true,exp:"会社法192条の単元未満株主の買取請求権は強行規定であり、定款で排除することはできない。"},
{cat:"株主の権利・単元株",q:"株式会社が株主に対してする通知又は催告が５年以上継続して到達しない場合において、当該株主に対する通知又は催告をすることを要しないときは、当該株主に対する当該株式会社の義務の履行を行う場所は、当該株式会社の住所地である。",ans:true,exp:"会社法196条2項"},
{cat:"株主名簿",q:"株式会社は、株主名簿に株主が株式を取得した日を記載又は記録することを要しない。",ans:false,exp:"会社法121条2号は株主名簿の記載事項として株式の取得日（取得年月日）を規定している。よって記載を要しないとする本記述は誤り。"},
{cat:"株主名簿",q:"株式会社は、株主名簿管理人を置く旨を定款で定め、株主名簿の作成及び備置きその他の株主名簿に関する事務を行うことを委託することができる。",ans:true,exp:"会社法123条は、定款の定めにより株主名簿管理人を設置し株主名簿に関する事務を委託できると規定する。"},
{cat:"株主名簿",q:"株式会社は、株主から株主名簿の閲覧の請求があった場合において、当該請求を行う株主が当該株式会社の業務と実質的に競争関係にある事業を営み、又はこれに従事する者であるときは、当該請求を拒むことができる。",ans:true,exp:"会社法125条3項2号は、請求者が会社の業務と実質的に競争関係にある事業を営む者等である場合、閲覧・謄写請求を拒否できると規定する。"},
{cat:"株主名簿",q:"株主が別に通知を受ける場所又は連絡先を株式会社に通知していないときは、当該株式会社が当該株主に対してする通知は、株主名簿に記載又は記録された当該株主の住所に宛てて発すれば足りる。",ans:true,exp:"会社法126条1項は、株主への通知は株主名簿に記載された住所に宛てて発すれば足りると規定する。"},
{cat:"株主名簿",q:"株式会社は、一定の日を定めて、当該日において株主名簿に記載又は記録されている株主をその権利を行使することができる者と定めることができる。",ans:true,exp:"会社法124条1項は、基準日制度として、一定の日（基準日）に株主名簿に記載された株主を権利行使者として定めることができると規定する。"},
{cat:"自己株式",q:"株式会社は、自己株式を相当の時期に処分しなければならない。",ans:false,exp:"会社法は自己株式を「相当の時期に処分しなければならない」とは規定していない。自己株式の保有・消却・処分は会社の判断に委ねられており、強制処分義務はない。"},
{cat:"自己株式",q:"株式会社は、自己株式について、株主総会における議決権、剰余金の配当を受ける権利及び募集株式の割当てを受ける権利のいずれも有しない。",ans:false,exp:"自己株式には議決権（308条2項）・剰余金配当（453条）はないが、「募集株式の割当てを受ける権利を有しない」の表現が厳密には正確でない（202条4項は割当てを「しない」と規定）。"},
{cat:"自己株式",q:"株式会社が行う事業の全部の譲渡に反対する株主が株式買取請求を行ったことにより、当該株式会社が当該株主の保有する株式を買い取る場合において、当該株式会社から当該買取りに際して当該株主に交付される金銭の額は、当該買取りの日における分配可能額を超えてはならない。",ans:false,exp:"事業全部譲渡に反対する株主の買取請求（469条・470条）については、分配可能額による制限規定は直接適用されない。よって「分配可能額を超えてはならない」とする本記述は誤り。"},
{cat:"自己株式",q:"株券発行会社が自己株式の処分により行う株式の譲渡は、当該株式に係る株券を交付しなくても、その効力を生ずる。",ans:false,exp:"会社法128条1項は、株券発行会社の株式の譲渡は株券の交付によって効力が生ずると規定する。自己株式の処分による譲渡も同様であり、株券の交付が必要。"},
{cat:"自己株式",q:"株式会社が自己株式を消却した場合には、発行可能株式総数についての定款の変更をしなくても、消却された自己株式の数だけ発行可能株式総数が減少する。",ans:false,exp:"自己株式を消却しても発行可能株式総数は変動しない。発行済株式総数は減少するが、発行可能株式総数は定款変更なしに減少することはない。"},
{cat:"株式の分割と株式無償割当て",q:"株式の分割により自己株式も分割され得るが、自己株式に対し株式無償割当てをすることはできない。",ans:true,exp:"株式分割（183条2項）では自己株式にも分割の効果が及ぶ。一方、株式無償割当て（186条2項）では自己株式には割り当てをしないと規定されている。"},
{cat:"株式の分割と株式無償割当て",q:"株式の分割により１株に満たない端数が生じ得るが、株式無償割当てにより１株に満たない端数が生ずることはない。",ans:false,exp:"株式の分割では端数が生じ得るが、株式無償割当てでも割当比率次第で1株未満の端数が生じ得る。「無償割当てで端数が生じることはない」は誤り。"},
{cat:"株式の分割と株式無償割当て",q:"株式の分割により株主の有する株式と異なる種類の株式をその株主に取得させることはできないが、株式無償割当てにより株主の有する株式と異なる種類の株式をその株主に取得させることはできる。",ans:true,exp:"株式分割（183条1項）は同種の株式の分割に限られる。株式無償割当て（185条）は異なる種類の株式の割当ても可能。"},
{cat:"株式の分割と株式無償割当て",q:"株式の分割の場合には、現に２以上の種類の株式を発行していない限り、株主総会の決議によらないで発行可能株式総数を増加する定款変更をすることができるが、株式無償割当ての場合には、株主総会の決議によらなければ発行可能株式総数を増加する定款変更をすることはできない。",ans:true,exp:"株式分割の場合、単一種類の株式のみを発行している会社は取締役会決議のみで発行可能株式総数を増加できる（184条2項）。株式無償割当てにはこの特則がなく、定款変更には株主総会決議が必要。"},
{cat:"株式の分割と株式無償割当て",q:"株式の分割により自己株式を株主に取得させることはできないが、株式無償割当てにより自己株式を株主に取得させることはできる。",ans:false,exp:"株式無償割当て（186条2項）では自己株式に対しては割り当てを「しない」とされており、自己株式を株主に取得させることはできない。よって「無償割当てにより自己株式を株主に取得させることができる」は誤り。"},
{cat:"株式の併合",q:"株式買取請求をした反対株主は、会社法上所定の期間内に株式会社との間で株式の価格の決定についての協議が調った後であっても、当該株式会社の承諾を得ることなく株式買取請求を撤回することができる。",ans:false,exp:"協議が調った後は会社の承諾なしに撤回できない（182条の5第4項）。「協議が調った後でも承諾なく撤回できる」は誤り。"},
{cat:"株式の併合",q:"株式会社が株式の併合をしようとするときは、株主総会の決議によって、当該株式の併合の効力発生日のほか、当該株式の併合の基準日を定めなければならない。",ans:false,exp:"株式の併合をする際に株主総会で定めるべき事項（180条2項各号）には「効力発生日」は含まれるが、「基準日」は必須記載事項ではない。"},
{cat:"株式の併合",q:"株式の併合が法令に違反する場合において、株主が不利益を受けるおそれがあるときは、株主は、株式会社に対し、当該株式の併合をやめることを請求することができる。",ans:true,exp:"会社法182条の3は、株式の併合が法令・定款に違反し株主が不利益を受けるおそれがあるときは、差止請求ができると規定する。"},
{cat:"株式の併合",q:"株式の併合をした株式会社は、株主総会で決議された当該株式の併合の効力発生日における発行可能株式総数についての定めに従い、当該効力発生日に、当該発行可能株式総数に係る定款の変更をしたものとみなされる。",ans:true,exp:"会社法182条1項・180条2項3号により、株式の併合の効力発生日に株主総会で決議された発行可能株式総数に係る定款変更がされたものとみなされる。"},
{cat:"株式の併合",q:"会社法上の公開会社である株券発行会社は、株式の併合をしたときは、併合した株式に係る株券を発行することを要しない。",ans:false,exp:"会社法215条2項により、株券発行会社は株式の併合をしたときは効力発生日後遅滞なく新株券を発行しなければならない（非公開会社のみ株主請求まで猶予可）。"},
{cat:"株式の譲渡・名義書換",q:"判例の趣旨によれば、株式を譲り受けた株式取得者が株主名簿の名義書換の請求をしたにもかかわらず、株式会社が正当な事由なく当該請求に応じなかったときは、当該株式会社は、株主名簿の名義書換がないことを理由として、株式の譲渡を否定することができず、当該株式取得者を株主として取り扱わなければならない。",ans:true,exp:"最判昭和41年7月28日は、会社が正当な事由なく名義書換請求を拒絶した場合、会社は名義書換がないことを理由に譲渡を否定できず、名義書換済みとして取り扱うべきとした。"},
{cat:"株式の譲渡・名義書換",q:"判例の趣旨によれば、株券発行会社の株式について、株式会社が定めた剰余金の配当の基準日より前に株券が交付されて譲渡されたが、当該基準日までに株主名簿の名義書換の請求がされなかったときは、株主名簿上の株主である譲渡人が適法に配当金を受領することができ、譲渡人は、譲受人に対し、受領した配当金相当額の金員について不当利得返還義務を負わない。",ans:false,exp:"判例によれば、名義書換前の譲渡人が配当を受領することは認められるが、その配当金は譲受人に引き渡す義務（不当利得返還義務）を負うとされている。「不当利得返還義務を負わない」は誤り。"},
{cat:"株式の譲渡・名義書換",q:"相続により譲渡制限株式を取得した株式取得者が株式会社に対し、株主名簿の名義書換の請求をするには、当該譲渡制限株式を取得したことについて当該株式会社の承認を受けていなければならない。",ans:false,exp:"会社法134条4号は、相続等一般承継による株式取得の場合は会社の承認なしに名義書換を請求できると規定する（相続は承認不要の例外）。"},
{cat:"株式の譲渡・名義書換",q:"振替株式は、株券発行会社でない株式会社の株式であるから、振替株式の譲渡は、当事者間においては、意思表示のみによって、その効力を生ずる。",ans:false,exp:"振替株式の譲渡は意思表示のみでは効力を生じず、振替口座への記録（振替）が効力発生要件（社債株式等振替法140条）。"},
{cat:"株式の譲渡・名義書換",q:"振替株式に係る株主名簿の名義書換は、振替機関から株式会社に対してされる総株主通知に基づいて行われる。",ans:true,exp:"振替機関からの総株主通知に基づいて株主名簿の名義書換が行われる（社債株式等振替法151条）。"},
{cat:"現物出資と検査役調査",q:"当該株式会社が募集株式の引受人に割り当てる株式の総数が５００株である場合には、当該募集株式の引受人が給付する現物出資財産の価額に関する検査役の調査は不要である。",ans:true,exp:"500株÷発行済5000株＝10分の1。会社法207条9項の要件（割当株数が発行済株式総数の10分の1以下等）を満たすため検査役調査は不要。"},
{cat:"現物出資と検査役調査",q:"当該株式会社が現物出資財産について定めた価額の総額が５００万円である場合には、当該現物出資財産の価額に関する検査役の調査は不要である。",ans:true,exp:"会社法207条9項1号は、現物出資財産の価額の総額が500万円以下の場合には検査役調査が不要と規定する。"},
{cat:"現物出資と検査役調査",q:"当該株式会社から１０００株の割当てを受けた募集株式の引受人が、現物出資財産として、その価額が１０００万円と定められた市場価格のある有価証券を給付する場合において、法務省令で定める方法により算定される当該有価証券の市場価格も１０００万円であるときは、当該有価証券についての現物出資財産の価額に関する検査役の調査は不要である。",ans:true,exp:"会社法207条9項2号は、市場価格のある有価証券で定めた価額が市場価格以下の場合は検査役調査不要と規定する。定めた価額＝市場価格なので要件を満たす。"},
{cat:"現物出資と検査役調査",q:"当該株式会社から１０００株の割当てを受けた募集株式の引受人が、現物出資財産として、その価額が１０００万円と定められた不動産を給付する場合において、当該価額が相当であることについて税理士の証明を受けたときは、当該証明を受けた当該不動産についての現物出資財産の価額に関する検査役の調査は不要である。",ans:false,exp:"不動産については税理士の証明のみでは足りず、不動産鑑定士の鑑定評価が追加で必要（207条9項3号括弧書）。よって検査役調査は必要。"},
{cat:"現物出資と検査役調査",q:"当該株式会社から１０００株の割当てを受けた募集株式の引受人が、現物出資財産として、当該株式会社に対する弁済期が到来していない金銭債権を給付する場合において、当該金銭債権について定められた価額と当該金銭債権に係る負債の帳簿価額とがいずれも１０００万円であるときは、当該金銭債権についての現物出資財産の価額に関する検査役の調査は不要である。",ans:true,exp:"定められた価額が負債の帳簿価額以下の場合は検査役調査が不要（207条9項5号）。本問では両者が同額なので要件を満たし不要。"},
{cat:"公開会社における募集株式の発行",q:"判例の趣旨によれば、募集事項の株主に対する通知又は公告をいずれも欠いたことは、募集株式の発行差止請求をしたとしても差止めの事由がないためにこれが許容されないと認められる場合でない限り、募集株式の発行の無効原因となる。",ans:true,exp:"最判平成9年1月28日の趣旨によれば、通知・公告のいずれも欠いた場合は差止めが許容されない場合を除き無効原因となる。"},
{cat:"公開会社における募集株式の発行",q:"募集に係る株式の発行が、法令又は定款に違反しない場合であっても、著しく不公正な方法により行われる場合において、株主が不利益を受けるおそれがあるときは、株主は、株式会社に対し、当該株式の発行をやめることを請求することができる。",ans:true,exp:"会社法210条2号は、著しく不公正な方法による株式発行に対して株主が差止請求できると規定する。"},
{cat:"公開会社における募集株式の発行",q:"株式会社が株主に株式の割当てを受ける権利を与える場合には、株主は、募集株式の引受けの申込みをしなくても、募集株式の引受人となる。",ans:false,exp:"株主割当ての場合でも株主は申込みをしなければ引受人とはならない（202条5項）。"},
{cat:"公開会社における募集株式の発行",q:"募集株式の引受人は、募集株式の払込金額の払込みをする債務と株式会社に対する債権とを相殺することができない。",ans:true,exp:"会社法208条3項は、引受人は払込債務と会社に対する債権とを相殺することができないと規定する（資本充実の原則）。"},
{cat:"公開会社における募集株式の発行",q:"募集株式の引受人が募集株式の払込金額の払込みを仮装した場合には、当該払込みの仮装に関する職務を行った取締役（当該払込みを仮装したものを除く。）は、その職務を行うについて注意を怠らなかったことを証明したときであっても、株式会社に対し、払込みを仮装した払込金額の支払をする義務を負う。",ans:false,exp:"会社法213条の3第2項は、注意を怠らなかったことを証明した場合の免責を認める（過失責任）。「注意を怠らなかったことを証明しても義務を負う」は誤り。"},
{cat:"新株予約権",q:"新株予約権付社債に付された新株予約権を行使することができる期間の終期は、当該新株予約権付社債の償還の期限と一致するように定めなければならない。",ans:false,exp:"会社法236条1項以下は、新株予約権付社債の新株予約権の行使期間の終期を社債の償還期限と一致させることを要求していない。自由に定めることができる。"},
{cat:"新株予約権",q:"募集新株予約権の引受けの申込みをした者は、割当日に、株式会社が割り当てた募集新株予約権の新株予約権者となる。",ans:true,exp:"会社法245条1項は、募集新株予約権の引受けの申込みをした者は割当日に新株予約権者となると規定する。"},
{cat:"新株予約権",q:"株式会社は、株主に対して新たに払込みをさせないで当該株式会社の新株予約権の割当てをすることができる。",ans:true,exp:"会社法277条は新株予約権無償割当てを認めており、株主に対して払込みなしに新株予約権を割り当てることができる。"},
{cat:"新株予約権",q:"株式会社は、譲渡による譲渡制限新株予約権の取得を承認しない旨の決定をしたときは、当該譲渡制限新株予約権を買い取る者を指定し、又は当該譲渡制限新株予約権を買い取らなければならない。",ans:false,exp:"不承認の場合の手続は264条以下に規定されており、指定買取人の指定は任意的選択肢の一つ。「必ず買い取る者を指定し又は買い取らなければならない」とする本記述は誤り。"},
{cat:"新株予約権",q:"株式会社は、取得条項付新株予約権の内容に基づき当該取得条項付新株予約権を取得するのと引換えに、当該取得条項付新株予約権の新株予約権者に対して分配可能額を超える額の金銭を交付することができない。",ans:true,exp:"取得条項付新株予約権の取得に際して交付する金銭は分配可能額を超えることができない（461条1項各号参照）。"},
