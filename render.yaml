# Render (https://render.com) ワンクリックデプロイ設定
# ダッシュボードで「New +」→「Blueprint」→ このリポジトリを選択すると
# この設定どおりに Web サービスが作成される。
services:
  - type: web
    name: kokugo-tensaku-ai
    runtime: docker
    plan: free  # 無料枠(15分無アクセスでスリープ)。常時稼働なら starter 以上に変更
    branch: claude/japanese-exam-grader-9bdwfj
    healthCheckPath: /
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false  # ダッシュボードで手入力(リポジトリに含めない)
      - key: APP_PASSWORD
        sync: false  # 公開URLの保護用パスワード。手入力
